      const hsh = Noise.hash(k, 3);
      if (hsh < 0.45) continue;
      const x = k * TILE + hsh * 12, y = H[k] * TILE + 1;
      const sw = Math.sin(t * 2 + k) * 1.5;
      c.strokeStyle = M.mixColor(bb.top, INK, 0.3); c.lineWidth = 1.2;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x - 2 + sw, y - 6 - hsh * 4); c.moveTo(x + 2, y); c.lineTo(x + 3 + sw, y - 5 - hsh * 3); c.stroke();
    }
    /* hồ băng */
    const [l0, l1] = W.lake;
    if (l1 >= c0 && l0 <= c1) {
      const ly = H[l0] * TILE;
      c.fillStyle = 'rgba(190,228,245,0.55)';
      c.fillRect(l0 * TILE, ly - 2, (l1 - l0 + 1) * TILE, 5);
      for (let k = l0; k <= l1; k += 3) { c.fillStyle = 'rgba(255,255,255,0.5)'; c.fillRect(k * TILE + ((t * 20 + k * 7) % 30), ly - 1, 6, 1); }
    }
    /* tường xây */
    this.builtWalls(c, W, c0, c1);
  },
  builtWalls(c, L, c0, c1) {
    for (let i = c0; i <= c1; i++) {
      for (let r = 0; r < L.rows; r++) {
        const tt = L.get(i, r);
        if (tt !== T_WOOD && tt !== T_STONE) continue;
        const x = i * TILE, y = r * TILE;
        if (tt === T_WOOD) {
          c.fillStyle = '#5a3e26'; c.fillRect(x + 1, y, 14, 16);
          c.fillStyle = '#6e4e30'; c.fillRect(x + 2, y + 1, 5, 14); c.fillRect(x + 9, y + 1, 5, 14);
          if (L.get(i, r - 1) === T_AIR) Spr.poly(c, [x + 1, y, x + 4.5, y - 4, x + 8, y, x + 11.5, y - 4, x + 15, y], '#5a3e26');
        } else {
          c.fillStyle = '#5c5a54'; c.fillRect(x, y, 16, 16);
          c.strokeStyle = '#3a3934'; c.lineWidth = 1; c.strokeRect(x + 0.5, y + 0.5, 15, 7.5); c.strokeRect(x + 4.5, y + 8, 7, 7.5);
        }
        const hp = L.wallHp.get(i * 1000 + r);
        if (hp != null) { c.fillStyle = 'rgba(0,0,0,0.35)'; c.fillRect(x, y, 16 * (1 - hp / DATA.walls[tt].hp), 3); }
      }
    }
  },

  /* ---------- Ô bí cảnh ---------- */
  dungeonTiles(c, G, cx, cy, t) {
    const L = G.level, pal = L.def.pal;
    const c0 = Math.max(0, Math.floor(cx / TILE) - 1), c1 = Math.min(L.cols - 1, Math.ceil((cx + this.vw) / TILE) + 1);
    const r0 = Math.max(0, Math.floor(cy / TILE) - 1), r1 = Math.min(L.rows - 1, Math.ceil((cy + this.vh) / TILE) + 1);
    for (let i = c0; i <= c1; i++) {
      for (let r = r0; r <= r1; r++) {
        const tt = L.get(i, r);
        const x = i * TILE, y = r * TILE;
        if (tt === T_ROCK) {
          c.fillStyle = pal.rock; c.fillRect(x, y, TILE + 0.5, TILE + 0.5);
          const hs = Noise.hash(i * 131 + r, 9);
          if (hs > 0.8) { c.fillStyle = M.mixColor(pal.rock, '#000000', 0.25); c.fillRect(x + hs * 8, y + 4, 5, 3); }
          if (!L.solid(i, r - 1)) {
            c.fillStyle = pal.rockTop; c.fillRect(x, y, TILE + 0.5, 3);
            if (hs > 0.55) { c.fillStyle = M.rgba(pal.accent, 0.7); c.fillRect(x + hs * 10, y - 3, 2, 3); }
          }
          if (!L.solid(i, r + 1) && L.get(i, r + 1) !== T_HAZARD && hs > 0.6) Spr.poly(c, [x + 4, y + 16, x + 8, y + 16 + hs * 10, x + 12, y + 16], pal.rock);
        } else if (tt === T_HAZARD) {
          const wv = Math.sin(t * 3 + i * 0.8) * 2;
          c.fillStyle = M.mixColor(pal.hazard, '#000000', 0.3);
          c.fillRect(x, y + 4 + wv, TILE + 0.5, TILE - 4 - wv);
          c.fillStyle = pal.hazard; c.fillRect(x, y + 3 + wv, TILE + 0.5, 3);
          if (Noise.hash(i, Math.floor(t * 2)) > 0.92) G.particle(x + 8, y + 2, 0, -40, 0.7, 'ember', pal.glow, 2);
        } else if (tt === T_GATE) {
          c.fillStyle = M.rgba(pal.glow, 0.25 + Math.sin(t * 8 + r) * 0.1); c.fillRect(x + 4, y, 8, TILE);
          c.fillStyle = pal.glow; c.fillRect(x + 7, y, 2, TILE);
        }
      }
    }
  },

  /* ---------- Vật thể trong thế giới ---------- */
  objects(c, G, cx, cy, t, dt) {
    const inView = (x, pad = 120) => x > cx - pad && x < cx + this.vw + pad;
    if (G.level === G.world) {
      const W = G.world;
      for (const pr of W.props) if (inView(pr.x)) this.prop(c, pr, W);
      Spr.array(c, W.array.x, W.array.y, G.placed, t, G.won);
      for (const pt of W.portals) if (inView(pt.x)) Spr.portal(c, pt.x, pt.y, pt.id, G.player.realm >= DATA.dungeons[pt.id].req, t, G.cleared[pt.id]);
      for (const r of W.resources) {
        if (!inView(r.x)) continue;
        if (r.shake > 0) r.shake -= dt;
        Spr.resource(c, r, W.biomeAt(r.c), t);
      }
      for (const s of G.structures) if (inView(s.x)) Spr.structure(c, s, t, G);
      for (const b of G.bags) if (inView(b.x)) {
        Spr.glow(c, b.x, b.y - 6, 22, '#ffd27a', 0.4 + Math.sin(t * 4) * 0.15);
        Spr.ellipse(c, b.x, b.y - 5, 6, 5, '#7a5a3a');
        Spr.line(c, b.x - 3, b.y - 10, b.x + 3, b.y - 10, '#c9a24f', 1.5);
      }
    } else {
      const D = G.dungeon, pal = D.def.pal;
      for (const tc of D.torches) if (inView(tc.x)) {
        Spr.line(c, tc.x, tc.y + 10, tc.x, tc.y, '#3a2a1a', 2);
        Spr.glow(c, tc.x, tc.y - 4, 26, pal.glow, 0.5);
        Spr.ellipse(c, tc.x, tc.y - 4, 2.5, 4 + Math.sin(t * 18 + tc.x) * 1, pal.glow);
      }
      Spr.portal(c, D.entrance.x, D.entrance.y, D.id, true, t, false);
      if (D.exitPortal) Spr.portal(c, D.exitPortal.x, D.exitPortal.y, D.id, true, t * 1.5, true);
      for (const sh of D.shrines) if (inView(sh.x)) {
        Spr.poly(c, [sh.x - 6, sh.y, sh.x - 4, sh.y - 18, sh.x + 4, sh.y - 18, sh.x + 6, sh.y], '#2b2722');
        Spr.poly(c, [sh.x - 8, sh.y - 18, sh.x + 8, sh.y - 18, sh.x, sh.y - 26], '#2b2722');
        if (sh.lit) { Spr.glow(c, sh.x, sh.y - 13, 26, '#ffd27a', 0.6); Spr.circle(c, sh.x, sh.y - 13, 2.5, '#ffe9a8'); }
        else Spr.circle(c, sh.x, sh.y - 13, 2, '#5a5248');
      }
      for (const ch of D.chests) if (inView(ch.x)) {
        c.fillStyle = ch.open ? '#3a2a1a' : '#6b4a2a';
        c.fillRect(ch.x - 9, ch.y - 12, 18, 12);
        c.fillStyle = '#c9a24f'; c.fillRect(ch.x - 9, ch.y - 9, 18, 2); c.fillRect(ch.x - 1.5, ch.y - 9, 3, 5);
        if (!ch.open) Spr.glow(c, ch.x, ch.y - 8, 20, '#ffd27a', 0.25 + Math.sin(t * 3) * 0.1);
      }
    }
    /* vật phẩm rơi */
    c.font = '12px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
    c.textAlign = 'center';
    for (const d of G.drops) {
      if (!inView(d.x)) continue;
      const tier = DATA.items[d.id].tier;
      const bob = d.onGround ? Math.sin(t * 4 + d.x) * 1.5 : 0;
      Spr.glow(c, d.x + 5, d.y + 5 + bob, 12, tier >= 3 ? '#ffd27a' : '#f4ead2', tier >= 3 ? 0.6 : 0.3);
      c.fillText(DATA.items[d.id].icon, d.x + 5, d.y + 10 + bob);
    }
  },
  marker(c, G, t) {
    c.textAlign = 'center';
    if (G.interactTarget && G.mode === 'play') {
      const p = G.player;
      c.fillStyle = 'rgba(239,231,210,0.9)';
      c.font = 'bold 10px "Be Vietnam Pro",sans-serif';
      const bx = p.cx, by = p.y - 22 + Math.sin(t * 5) * 2;
      c.beginPath(); c.arc(bx, by, 7, 0, Math.PI * 2); c.fill();
      c.fillStyle = INK; c.fillText(Input.usedTouch ? '!' : 'E', bx, by + 3.5);
    }
  },
  prop(c, pr, W) {
    const col = M.mixColor(W.biomeAtX(pr.x).ground, INK, 0.55);
    c.save();
    c.translate(pr.x, pr.y);
    c.scale(pr.s, pr.s);
    c.fillStyle = col;
    if (pr.kind === 'pillar') { c.fillRect(-5, -60, 10, 60); c.fillRect(-8, -64, 16, 5); c.fillRect(-7, -6, 14, 6); }
    else if (pr.kind === 'gate') { c.fillRect(-30, -70, 6, 70); c.fillRect(24, -70, 6, 70); c.fillRect(-38, -78, 76, 7); c.fillRect(-32, -64, 64, 4); }
    else if (pr.kind === 'stele') { c.fillRect(-7, -34, 14, 34); c.beginPath(); c.arc(0, -34, 7, Math.PI, 0); c.fill(); }
    else if (pr.kind === 'lantern') { c.fillRect(-2, -26, 4, 26); c.fillRect(-7, -32, 14, 8); c.fillRect(-9, -35, 18, 3); }
    else if (pr.kind === 'spire') { c.beginPath(); c.moveTo(-10, 0); c.lineTo(-2, -90); c.lineTo(3, -70); c.lineTo(10, 0); c.fill(); }
    c.restore();
  },

  /* ---------- Đạn, vùng nguy hiểm, hiệu ứng ---------- */
  projectiles(c, G, t) {
    for (const pr of G.projs) {
      if (pr.delay > 0) continue;
      const col = G.projColor(pr.kind);
      if (pr.kind === 'wave') {
        c.save(); c.translate(pr.x, pr.y); c.scale(Math.sign(pr.vx) || 1, 1);
        c.beginPath(); c.arc(-8, 0, 16, -1.1, 1.1); c.strokeStyle = 'rgba(233,246,255,0.85)'; c.lineWidth = 4; c.stroke();
        c.restore();
      } else if (pr.kind === 'quake' || pr.kind === 'shock' || pr.kind === 'frost') {
        for (let i = 0; i < 3; i++) Spr.poly(c, [pr.x - 8 + i * 6 * Math.sign(pr.vx), pr.y + 12, pr.x - 4 + i * 6 * Math.sign(pr.vx), pr.y - 6 + i * 3, pr.x + i * 6 * Math.sign(pr.vx), pr.y + 12], M.rgba(col, 0.85));
        Spr.glow(c, pr.x, pr.y + 4, 20, col, 0.4);
      } else if (pr.kind === 'bolt') {
        Spr.glow(c, pr.x, pr.y, 14, col, 0.7);
        Spr.line(c, pr.x - pr.vx * 0.03, pr.y - pr.vy * 0.03, pr.x, pr.y, '#ffffff', 2.5);
      } else if (pr.kind === 'ice') {
        c.save(); c.translate(pr.x, pr.y); c.rotate(Math.atan2(pr.vy, pr.vx));
        Spr.poly(c, [8, 0, 0, -3, -6, 0, 0, 3], '#e9fbff'); c.restore();
        Spr.glow(c, pr.x, pr.y, 12, col, 0.45);
      } else {
        Spr.glow(c, pr.x, pr.y, pr.r * 3, col, 0.6);
        Spr.circle(c, pr.x, pr.y, pr.r * 0.7, pr.kind === 'seed' ? '#3f6b2a' : '#fff4d8');
      }
    }
  },
  zones(c, G, t, emissive) {
    for (const z of G.zones) {
      const warm = z.t < z.delay;
      if (emissive !== (z.kind === 'bolt')) continue;
      if (warm) {
        const k = z.t / z.delay;
        if (z.kind === 'line') { c.fillStyle = 'rgba(255,80,60,' + (0.12 + k * 0.2) + ')'; c.fillRect(z.x, z.y, z.w, z.h); continue; }
        if (z.kind === 'bolt') {
          c.fillStyle = (z.trib ? 'rgba(190,160,255,' : 'rgba(255,70,60,') + (0.08 + k * 0.2) + ')';
          c.fillRect(z.x, z.y, z.w, z.h);
          c.fillStyle = z.trib ? 'rgba(220,200,255,0.8)' : 'rgba(255,90,70,0.8)';
          c.fillRect(z.x + z.w / 2 - 1, z.y + z.h - 6, 2, 6);
          Spr.circle(c, z.x + z.w / 2, z.y + z.h - 3, 5 + k * 10, 'rgba(255,255,255,' + (0.1 + k * 0.2) + ')');
        } else {
          c.fillStyle = 'rgba(255,70,60,' + (0.12 + k * 0.25) + ')';
          c.fillRect(z.x, z.y + z.h - 6, z.w, 6);
        }
        continue;
      }
      if (z.kind === 'bolt') {
        c.beginPath();
        let x = z.x + z.w / 2, y = z.y;
        c.moveTo(x, y);
        while (y < z.y + z.h) { y += 18; x = z.x + z.w / 2 + (Math.random() - 0.5) * z.w * 0.7; c.lineTo(x, Math.min(y, z.y + z.h)); }
        c.strokeStyle = 'rgba(225,214,255,0.95)'; c.lineWidth = 5; c.stroke();
        c.strokeStyle = '#ffffff'; c.lineWidth = 2; c.stroke();
        Spr.glow(c, z.x + z.w / 2, z.y + z.h, 60, '#c7b8ff', 0.6);
      } else if (z.kind === 'root') {
        const k = M.clamp((z.t - z.delay) / 0.12, 0, 1);
        for (let i = 0; i < 3; i++) Spr.poly(c, [z.x + 4 + i * 10, z.y + z.h, z.x + 9 + i * 10, z.y + z.h - z.h * k * (0.7 + i * 0.15), z.x + 14 + i * 10, z.y + z.h], '#3a2a1a');
      }
    }
  },
  particles(c, G, emissive) {
    const EM = { ring: 1, qi: 1, ember: 1, spark: 1 };
    for (const q of G.parts) {
      if (!!EM[q.kind] !== emissive) continue;
      const a = Math.max(0, q.life / q.max);
      if (q.kind === 'ring') {
        c.beginPath(); c.arc(q.x, q.y, q.size * (1.6 - a), 0, Math.PI * 2);
        c.strokeStyle = M.rgba(q.color, a); c.lineWidth = 2; c.stroke();
      } else if (q.kind === 'ghost') {
        c.fillStyle = M.rgba('#e9e2cf', a * 0.25); c.fillRect(q.x - 6, q.y - 14, 12, 28);
      } else if (q.kind === 'qi' || q.kind === 'ember' || q.kind === 'spark') {
        Spr.glow(c, q.x, q.y, q.size * 3, q.color, a * 0.6);
        c.fillStyle = M.rgba(q.color, a); c.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
      } else if (q.kind === 'smoke' || q.kind === 'dust') {
        Spr.circle(c, q.x, q.y, q.size * (1.5 - a * 0.5), M.rgba(q.color, a * 0.35));
      } else {
        c.fillStyle = M.rgba(q.color, Math.min(1, a * 1.4));
        c.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
      }
    }
  },
  texts(c, G) {
    c.textAlign = 'center';
    for (const tx of G.texts) {
      const a = 1 - tx.t / 0.9;
      c.font = (tx.big ? 'bold 16px ' : 'bold 12px ') + '"Be Vietnam Pro",sans-serif';
      c.lineWidth = 3; c.strokeStyle = 'rgba(10,9,8,' + a + ')';
      c.strokeText(tx.s, tx.x, tx.y);
      c.fillStyle = M.rgba(tx.color.length === 7 ? tx.color : '#ffffff', a);
      c.fillText(tx.s, tx.x, tx.y);
    }
  },
  ghost(c, G, t) {
    const pl = G.placement();
    if (!pl) return;
    c.globalAlpha = 0.5 + Math.sin(t * 6) * 0.1;
    if (pl.wall) {
      c.fillStyle = pl.ok ? 'rgba(127,208,138,0.45)' : 'rgba(214,90,67,0.45)';
      c.fillRect(pl.x, pl.y, pl.w, pl.h);
    } else {
      Spr.structure(c, { type: pl.type, x: pl.x, y: pl.y, fuel: 0 }, t, G);
      c.strokeStyle = pl.ok ? '#7fd08a' : '#d65a43'; c.lineWidth = 1.5;
      c.strokeRect(pl.x - pl.w / 2, pl.y - pl.h, pl.w, pl.h);
    }
    c.globalAlpha = 1;
  },

  /* ---------- Ánh sáng ---------- */
  lights(G, t) {
    const L = [];
    const p = G.player;
    const torch = G.lightRadius();
    L.push({ x: p.cx, y: p.cy, r: 70 + p.realm * 3 + torch, f: torch ? 0.06 : 0 });
    if (G.level === G.world) {
      for (const s of G.structures) {
        const S = DATA.structures[s.type];
        if (!S.light || (S.fuel && s.fuel <= 0)) continue;
        L.push({ x: s.x, y: s.y - 12, r: S.light, f: s.type === 'lua_trai' ? 0.08 : 0.02 });
      }
      for (const pt of G.world.portals) L.push({ x: pt.x, y: pt.y - 30, r: 90, f: 0 });
      L.push({ x: G.world.array.x, y: G.world.array.y - 10, r: 80 + G.placed.length * 30, f: 0 });
      for (const b of G.bags) L.push({ x: b.x, y: b.y, r: 40, f: 0 });
    } else {
      const D = G.dungeon;
      for (const tc of D.torches) L.push({ x: tc.x, y: tc.y, r: 110, f: 0.05 });
      for (const sh of D.shrines) if (sh.lit) L.push({ x: sh.x, y: sh.y - 12, r: 90, f: 0.03 });
      L.push({ x: D.entrance.x, y: D.entrance.y - 30, r: 100, f: 0 });
      if (D.exitPortal) L.push({ x: D.exitPortal.x, y: D.exitPortal.y - 30, r: 120, f: 0 });
      const cam = G.cam;
      for (let i = Math.floor(cam.x / TILE); i < (cam.x + this.vw) / TILE; i += 3) if (D.hazardCols[i]) L.push({ x: i * TILE + 8, y: (D.rows - 3) * TILE, r: 60, f: 0.04 });
      for (const m of G.mobs) if (m.alive && (m.def.look === 'wisp' || m.def.look === 'dragon' || m.def.look === 'phoenix' || m.def.look === 'crystal')) L.push({ x: m.cx, y: m.cy, r: m.boss ? 160 : 70, f: 0.04 });
    }
    for (const pr of G.projs) if (pr.kind === 'fireball' || pr.kind === 'fire' || pr.kind === 'bolt') L.push({ x: pr.x, y: pr.y, r: 45, f: 0.1 });
    for (const z of G.zones) if (z.kind === 'bolt' && z.t >= z.delay) L.push({ x: z.x + z.w / 2, y: z.y + z.h, r: 260, f: 0 });
    return L;
  },
  lighting(c, G, cx, cy, t) {
    const dark = this.darkness(G);
    if (dark <= 0.01) return;
    const l = this.lctx, w = this.light.width, h = this.light.height;
    l.globalCompositeOperation = 'source-over';
    l.clearRect(0, 0, w, h);
    const blood = G.level === G.world && G.bloodMoon();
    l.fillStyle = blood ? 'rgba(30,4,6,' + dark + ')' : G.level === G.world ? 'rgba(6,9,22,' + dark + ')' : 'rgba(4,4,8,' + dark + ')';
    l.fillRect(0, 0, w, h);
    l.globalCompositeOperation = 'destination-out';
    for (const L of this.lights(G, t)) {
      const x = (L.x - cx) / 2, y = (L.y - cy) / 2;
      const r = (L.r * (1 + (L.f ? Math.sin(t * 13 + L.x) * L.f : 0))) / 2;
      if (x < -r || x > w + r || y < -r || y > h + r) continue;
      const g = l.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, 'rgba(0,0,0,1)');
      g.addColorStop(0.55, 'rgba(0,0,0,0.75)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      l.fillStyle = g;
      l.fillRect(x - r, y - r, r * 2, r * 2);
    }
    c.drawImage(this.light, 0, 0, this.vw, this.vh);
  },

  /* ---------- Thời tiết ---------- */
  weatherFx(c, G, biome, t, dt) {
    const kind = biome.weather;
    if (kind === 'none') return;
    const vw = this.vw, vh = this.vh;
    for (const w of this.weather) {
      if (kind === 'snow') { w.y += dt * (0.05 + w.s * 0.06); w.x += dt * 0.02 * Math.sin(t + w.r); }
      else if (kind === 'leaves') { w.y += dt * (0.04 + w.s * 0.04); w.x -= dt * (0.03 + w.s * 0.03); }
      else if (kind === 'embers') { w.y -= dt * (0.03 + w.s * 0.05); w.x += dt * 0.01 * Math.sin(t * 2 + w.r); }
      else if (kind === 'storm') { w.y += dt * (0.9 + w.s * 0.6); w.x -= dt * 0.25; }
      if (w.y > 1.05) { w.y = -0.05; w.x = Math.random(); }
      if (w.y < -0.05) { w.y = 1.05; w.x = Math.random(); }
      if (w.x < -0.05) w.x = 1.05; if (w.x > 1.05) w.x = -0.05;
      const x = w.x * vw, y = w.y * vh;
      if (kind === 'snow') Spr.circle(c, x, y, 1 + w.s * 1.6, 'rgba(255,255,255,0.8)');
      else if (kind === 'leaves') Spr.ellipse(c, x, y, 3, 1.4, M.rgba(w.s > 0.5 ? '#9fc77a' : '#d9b85a', 0.75), t * 2 + w.r);
      else if (kind === 'embers') { c.fillStyle = 'rgba(255,140,60,' + (0.4 + w.s * 0.5) + ')'; c.fillRect(x, y, 2, 2); }
      else if (kind === 'storm') Spr.line(c, x, y, x - 4, y + 12, 'rgba(200,205,235,0.35)', 1);
    }
    if (kind === 'storm' && Math.random() < dt * 0.15) G.flash = 0.15;
  },
};

/* ===== js/ui.js ===== */
'use strict';
/* Giao diện HTML phủ trên canvas: HUD, túi đồ & chế tạo, các màn hình */

const $ = (s, r = document) => r.querySelector(s);

const UI = {
  selSlot: -1,
  lastHot: '',
  panelOpen: false,
  pickups: new Map(),

  init() {
    this.hud = $('#hud');
    this.panel = $('#panel');
    this.screen = $('#screen');
    Input.onAction = (a) => {
      if (Game.mode === 'title') return;
      if (a === 'inv') this.toggleInventory();
      if (a === 'pause') { if (this.panelOpen) this.closeInventory(); else this.togglePause(); }
    };
    document.addEventListener('click', (e) => {
      const b = e.target.closest('[data-ui]');
      if (!b || b.disabled) return;
      Sfx.resume();
      Sfx.play('ui');
      const fn = this.actions[b.dataset.ui];
      if (fn) fn.call(this, b.dataset.arg, b, e);
    });
    $('#hotbar').addEventListener('click', (e) => {
      const s = e.target.closest('[data-slot]');
      if (!s) return;
      const i = +s.dataset.slot;
      if (Game.inv.sel === i && Input.usedTouch) Input.tap('use');
      Game.inv.sel = i;
      this.lastHot = '';
    });
    document.addEventListener('touchstart', () => { Sfx.resume(); if (!document.body.classList.contains('touch')) document.body.classList.add('touch'); Input.usedTouch = true; }, { passive: true });
    document.addEventListener('pointerdown', () => Sfx.resume(), { passive: true });
    if ('ontouchstart' in window || navigator.maxTouchPoints > 0) document.body.classList.add('touch');
    Input.bindTouch($('#touch'));
    try { const st = JSON.parse(localStorage.getItem('linhvuc_settings') || '{}'); Sfx.on = st.sound !== false; Sfx.musicOn = st.music !== false; } catch (e) { /* bỏ qua */ }
    this.showTitle();
  },
  saveSettings() { try { localStorage.setItem('linhvuc_settings', JSON.stringify({ sound: Sfx.on, music: Sfx.musicOn })); } catch (e) { /* bỏ qua */ } },

  /* ======================= Màn hình ======================= */
  showScreen(html, cls = '') {
    const b = document.getElementById('banner');

      '<div class="menu"><button class="btn primary" data-ui="keepplaying">Ở lại tiếp tục tu luyện</button><button class="btn ghost" data-ui="totitle">Về màn hình chính</button></div>', 'victory');
  },

  },

  actions: {
    newgame() {
      if (Game.hasSave()) {
        this.showScreen('<h2>Bắt đầu lại?</h2><p class="story">Hành trình đang lưu sẽ bị ghi đè.</p><div class="seed"><label for="seed-in">Hạt giống thế giới (tùy chọn)</label><input id="seed-in" inputmode="numeric" placeholder="Ngẫu nhiên"></div><div class="menu"><button class="btn primary" data-ui="startnew">Bắt đầu hành trình mới</button><button class="btn ghost" data-ui="totitle">Quay lại</button></div>', 'title-screen');
        return;
      }
      this.actions.startnew.call(this);
    },
    startnew() {
      const inp = $('#seed-in');
      const seed = inp && inp.value.trim() ? (parseInt(inp.value.replace(/\D/g, ''), 10) || 0) : 0;
      Game.wipe();
      Game.newGame(seed || 0);
      Game.save();
    },
    continue() { if (!Game.load()) this.toast('Không đọc được dữ liệu lưu', 'bad'); },
    help() {

      if (b) b.textContent = this.soundLabel();

    fullscreen() {
      const el = document.documentElement;
      try {
        if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) { /* bỏ qua */ } }).catch(() => this.toast('Trình duyệt không cho phép toàn màn hình', 'bad'));
        else if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
      } catch (e) { this.toast('Trình duyệt không hỗ trợ toàn màn hình', 'bad'); }

    resume() { this.hideScreen(); Game.paused = false; Input.clear(); },
    totitle() { if (Game.mode === 'play' || Game.mode === 'victory') Game.save(); this.showTitle(); },

    inv() { this.toggleInventory(); },
    pause() { this.togglePause(); },
    closepanel() { this.closeInventory(); },
    craft(arg) {
      const [i, n] = arg.split(':');
      const r = DATA.recipes[+i];
      const res = Craft.make(Game, r, +n);
      this.toast(res.msg, res.ok ? 'good' : 'bad');

    slot(arg) {
      const i = +arg;
      if (this.selSlot >= 0 && this.selSlot !== i) { Game.inv.swap(this.selSlot, i); this.selSlot = i; }

      this.renderPanel();

    useSlot(arg) {
      const prev = Game.inv.sel;

      this.renderPanel();
    },
    tohot(arg) {
      const i = +arg;
      const empty = Game.inv.slots.findIndex((s, k) => k < 8 && !s);
      const target = empty >= 0 ? empty : Game.inv.sel;
      Game.inv.swap(i, target);
      this.selSlot = target;
      this.renderPanel();
    },
    drop(arg) {
      const s = Game.inv.slots[+arg];
      if (!s) return;
      Game.spawnDrop(s.id, s.n, Game.player.cx + Game.player.face * 30, Game.player.y);
      Game.drops[Game.drops.length - 1].t = -1.5;
      Game.inv.slots[+arg] = null;
      this.selSlot = -1;
      this.renderPanel();
    },
    unequip() {
      if (!Game.inv.armor) return;
      if (Game.inv.add(Game.inv.armor, 1) === 0) Game.inv.armor = null;
      this.renderPanel();
    },
    tab(arg) { this.panelTab = arg; this.renderPanel(); },
  },

  /* ======================= Túi đồ & chế tạo ======================= */
  toggleInventory() { if (this.panelOpen) this.closeInventory(); else this.openInventory(); },
  openInventory(tab) {
    if (Game.mode !== 'play' || !this.screen.hidden) return;
    this.panelOpen = true;
    Game.paused = true;
    Game.stopMeditate();
    if (tab) this.panelTab = tab;
    this.panel.hidden = false;
    this.renderPanel();
  },
  closeInventory(silent) {
    this.panelOpen = false;
    this.selSlot = -1;
    if (this.panel) this.panel.hidden = true;
    if (!silent && Game.mode === 'play') Game.paused = false;
    Input.clear();
    this.lastHot = '';
  },
  slotHTML(s, i, extra = '') {
    const d = s ? DATA.items[s.id] : null;
    const sel = i === this.selSlot ? ' sel' : '';
    const hot = i < 8 ? ' hot' : '';
    return '<button class="slot' + sel + hot + (d ? ' t' + d.tier : ' empty') + '" data-ui="slot" data-arg="' + i + '" title="' + (d ? M.esc(d.name) : '') + '">' +
      (i < 8 ? '<em>' + (i + 1) + '</em>' : '') + (d ? '<span class="ic">' + d.icon + '</span>' + (s.n > 1 ? '<b>' + s.n + '</b>' : '') : '') + extra + '</button>';
  },
  renderPanel() {
    if (!this.panelOpen) return;
    const inv = Game.inv;
    const tab = this.panelTab || 'craft';
    let grid = '<div class="inv-grid">' + inv.slots.map((s, i) => this.slotHTML(s, i)).join('') + '</div>';
    const arm = inv.armor ? DATA.items[inv.armor] : null;
    grid += '<div class="armor-row"><span>Giáp:</span>' + (arm ? '<span class="armor">' + arm.icon + ' ' + arm.name + ' · thủ ' + arm.def + '</span><button class="btn sm ghost" data-ui="unequip">Tháo</button>' : '<span class="muted">Chưa mặc giáp</span>') + '</div>';
    let detail = '<p class="muted small">Chọn một ô để xem chi tiết. Chọn ô rồi chọn ô khác để đổi chỗ; 8 ô đầu là thanh công cụ.</p>';
    if (this.selSlot >= 0 && inv.slots[this.selSlot]) {
      const s = inv.slots[this.selSlot], d = DATA.items[s.id];
      const usable = ['food', 'pill', 'armor', 'place'].includes(d.cat);
      detail = '<div class="detail"><div class="d-head"><span class="ic big">' + d.icon + '</span><div><b>' + d.name + '</b> ×' + s.n + '<div class="muted small">' + this.catName(d.cat) + this.itemStats(d) + '</div></div></div><p class="small">' + d.desc + '</p><div class="row">' +
        (usable ? '<button class="btn sm primary" data-ui="useSlot" data-arg="' + this.selSlot + '">' + (d.cat === 'place' ? 'Cầm để đặt' : d.cat === 'armor' ? 'Mặc' : 'Dùng') + '</button>' : '') +
        (this.selSlot >= 8 ? '<button class="btn sm" data-ui="tohot" data-arg="' + this.selSlot + '">Đưa lên thanh công cụ</button>' : '') +
        '<button class="btn sm ghost" data-ui="drop" data-arg="' + this.selSlot + '">Vứt bỏ</button></div></div>';
    }
    const list = Craft.list(Game);
    const near = Craft.stationsNear(Game);
    const groups = [[null, 'Tay không']].concat(Object.keys(DATA.stationNames).map((k) => [k, DATA.stationNames[k]]));
    let craft = '<div class="near">Trạm gần đây: ' + (near.size ? [...near].map((k) => '<span class="chip">' + DATA.stationNames[k] + '</span>').join('') : '<span class="muted">không có</span>') + '</div>';
    for (const [st, name] of groups) {
      const rows = list.map((x, i) => Object.assign({ i }, x)).filter((x) => x.r.station === st);
      if (!rows.length) continue;
      const avail = !st || near.has(st);
      craft += '<h4' + (avail ? '' : ' class="dim"') + '>' + name + (avail ? '' : ' · cần đứng gần') + '</h4>';
      rows.sort((a, b) => (b.can - a.can));
      for (const x of rows) {
        const r = x.r, d = DATA.items[r.out];
        const need = Object.keys(r.need).map((id) => '<span class="' + (inv.count(id) >= r.need[id] ? 'ok' : 'miss') + '">' + DATA.items[id].icon + ' ' + inv.count(id) + '/' + r.need[id] + '</span>').join('');
        const max = Craft.maxTimes(Game, r);
        craft += '<div class="recipe' + (x.can ? ' can' : '') + '"><span class="ic">' + d.icon + '</span><div class="rinfo"><b>' + d.name + (r.n > 1 ? ' ×' + r.n : '') + '</b><div class="need">' + need + '</div></div>' +
          '<button class="btn sm' + (x.can ? ' primary' : '') + '" data-ui="craft" data-arg="' + x.i + ':1"' + (x.can ? '' : ' disabled') + '>Chế</button>' +
          (x.can && max >= 5 && d.stack > 1 ? '<button class="btn sm" data-ui="craft" data-arg="' + x.i + ':5">×5</button>' : '') + '</div>';
      }
    }
    const p = Game.player;
    const R = DATA.realms[p.realm];
    const info = '<div class="pinfo"><b style="color:' + DATA.realmColor(p.realm) + '">' + R.name + '</b> · Sát thương ×' + R.dmg.toFixed(2) + ' · Thủ ' + Game.defense() + '<div class="muted small">Đã lĩnh ngộ: ' + (DATA.unlocks.filter((u) => p.realm >= u.realm).map((u) => u.name).join(', ') || 'chưa có') + (DATA.unlocks.find((u) => u.realm > p.realm) ? ' · Kế tiếp: ' + DATA.unlocks.find((u) => u.realm > p.realm).name + ' (' + DATA.realms[DATA.unlocks.find((u) => u.realm > p.realm).realm].name + ')' : '') + '</div></div>';
    this.panel.innerHTML = '<div class="panel-card">' +
      '<div class="panel-head"><h2>Túi Trữ Vật</h2><div class="tabs"><button class="tab' + (tab === 'craft' ? ' on' : '') + '" data-ui="tab" data-arg="craft">Chế tạo</button><button class="tab' + (tab === 'bag' ? ' on' : '') + '" data-ui="tab" data-arg="bag">Chi tiết</button></div><button class="btn sm ghost" data-ui="closepanel">Đóng' + (Input.usedTouch ? '' : ' (Tab)') + '</button></div>' +
      '<div class="panel-body tab-' + tab + '"><section class="col-inv">' + info + grid + detail + '</section><section class="col-craft">' + craft + '</section></div></div>';
  },
  catName(c) { return { mat: 'Nguyên liệu', food: 'Thức ăn', pill: 'Đan dược', tool: 'Công cụ', weapon: 'Vũ khí', armor: 'Giáp', place: 'Công trình', light: 'Chiếu sáng', key: 'Bảo vật' }[c] || c; },
  itemStats(d) {
    const o = [];
    if (d.dmg && d.cat === 'weapon') o.push('Sát thương ' + d.dmg);
    if (d.axe) o.push('Chặt ' + d.axe);
    if (d.pick) o.push('Khai thác cấp ' + d.pickTier);
    if (d.def) o.push('Thủ ' + d.def);
    if (d.hunger) o.push('No ' + (d.hunger > 0 ? '+' : '') + d.hunger);
    if (d.hp) o.push('Máu ' + (d.hp > 0 ? '+' : '') + d.hp);
    return o.length ? ' · ' + o.join(' · ') : '';
  },

  /* ======================= Thông báo ======================= */
  toastRoot() { return $('#toasts'); },
  toast(msg, type = 'info') {
    const root = this.toastRoot();
    if (!root) return;
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = msg;
    root.appendChild(el);
    while (root.children.length > 5) root.removeChild(root.firstChild);
    setTimeout(() => el.classList.add('out'), 2600);
    setTimeout(() => el.remove(), 3100);
  },
  pickup(id, n) {
    const d = DATA.items[id];
    const now = performance.now();
    const ex = this.pickups.get(id);
    if (ex && now - ex.t < 1500 && ex.el.isConnected) {
      ex.n += n; ex.t = now;
      ex.el.textContent = '+' + ex.n + ' ' + d.icon + ' ' + d.name + ' (' + Game.inv.count(id) + ')';
      return;
    }
    const root = this.toastRoot();
    const el = document.createElement('div');
    el.className = 'toast pickup t' + d.tier;
    el.textContent = '+' + n + ' ' + d.icon + ' ' + d.name + ' (' + Game.inv.count(id) + ')';
    root.appendChild(el);
    while (root.children.length > 5) root.removeChild(root.firstChild);
    this.pickups.set(id, { n, t: now, el });
    setTimeout(() => el.classList.add('out'), 2000);
    setTimeout(() => el.remove(), 2500);
  },
  banner(title, sub, kind = '') {
    const b = $('#banner');
    b.className = 'banner ' + kind;
    b.innerHTML = '<div class="b-title">' + M.esc(title) + '</div>' + (sub ? '<div class="b-sub">' + M.esc(sub) + '</div>' : '');
    void b.offsetWidth;
    b.classList.add('show');
    clearTimeout(this.bannerT);
    this.bannerT = setTimeout(() => b.classList.remove('show'), 2600);
  },
  unlock(u) {
    setTimeout(() => this.banner('Lĩnh ngộ: ' + u.name, u.desc, 'realm'), 2700);
  },
  onLevelChange() { this.lastHot = ''; },

  /* ======================= Cập nhật HUD mỗi khung hình ======================= */
  update() {
    if (Game.mode === 'title' || this.hud.hidden) return;
    const p = Game.player;
    const setBar = (id, v, max, txt) => {
      const el = document.getElementById(id);
      el.firstElementChild.style.width = M.clamp(v / max * 100, 0, 100) + '%';
      el.lastElementChild.textContent = txt;
    };
    const R = DATA.realms[p.realm];
    const realmEl = $('#h-realm');
    realmEl.textContent = R.name;
    realmEl.style.color = DATA.realmColor(p.realm);
    setBar('b-hp', p.hp, Game.maxHp(), Math.ceil(Math.max(0, p.hp)) + ' / ' + Game.maxHp());
    setBar('b-mp', p.mp, Game.maxMp(), Math.floor(p.mp) + ' / ' + Game.maxMp());
    setBar('b-food', p.hunger, 100, Math.ceil(p.hunger) + '%');
    setBar('b-tv', R.req === Infinity ? 1 : p.tuvi, R.req === Infinity ? 1 : R.req, R.req === Infinity ? 'Viên mãn' : Math.floor(p.tuvi) + ' / ' + R.req + (R.pill && p.tuvi >= R.req ? ' · cần ' + DATA.items[R.pill].name : ''));
    $('#b-food').classList.toggle('warn', p.hunger < 25);
    $('#b-hp').classList.toggle('warn', p.hp < Game.maxHp() * 0.3);
    /* đồng hồ */
    const h = Game.hours();
    const hh = Math.floor(h), mm = Math.floor((h - hh) * 60);
    const night = Game.isNight();
    const icon = Game.level !== Game.world ? '🏛️' : Game.bloodMoon() ? '🩸' : night ? '🌙' : '☀️';
    const where = Game.level !== Game.world ? Game.dungeon.def.name + ' · Hồn Đăng ' + '●'.repeat(Game.lives) + '○'.repeat(3 - Game.lives) : Game.world.biomeAtX(p.cx).name;
    $('#h-clock').innerHTML = '<span class="ci">' + icon + '</span><b>Ngày ' + Game.day + '</b> · ' + String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0') + '<div class="where">' + where + '</div>';
    /* mục tiêu */
    const g = DATA.goals[Game.goal];
    $('#h-goal').innerHTML = g ? '<span>Mục tiêu</span>' + g.text : '<span>Tự do</span>Linh Vực rộng lớn, tiếp tục tu luyện tới Nguyên Anh.';
    /* gợi ý tương tác */
    const pr = $('#prompt');
    const pl = Game.placement();
    const txt = Game.prompt ? (Input.usedTouch ? '' : '[E] ') + Game.prompt : pl ? (pl.ok ? (Input.usedTouch ? 'Nhấn Dùng' : '[F]') + ' để đặt ' + (pl.wall ? 'tường' : DATA.structures[pl.type].name) : 'Không thể đặt ở đây') : p.med ? 'Đang nhập định… (di chuyển để dừng)' : '';
    if (pr.textContent !== txt) pr.textContent = txt;
    pr.hidden = !txt;
    $('#t-act').textContent = Game.prompt ? '✋' : 'E';
    /* thanh công cụ */
    const sig = Game.inv.sel + '|' + Game.inv.slots.slice(0, 8).map((s) => s ? s.id + s.n : '-').join(',');
    if (sig !== this.lastHot) {
      this.lastHot = sig;
      $('#hotbar').innerHTML = Game.inv.slots.slice(0, 8).map((s, i) => {
        const d = s ? DATA.items[s.id] : null;
        return '<button class="hs' + (i === Game.inv.sel ? ' sel' : '') + (d ? ' t' + d.tier : '') + '" data-slot="' + i + '" title="' + (d ? M.esc(d.name) : '') + '"><em>' + (i + 1) + '</em>' + (d ? '<span class="ic">' + d.icon + '</span>' + (s.n > 1 ? '<b>' + s.n + '</b>' : '') : '') + '</button>';
      }).join('');
      const d = Game.inv.selectedDef();
      $('#held-name').textContent = d ? d.name : 'Tay không';
    }
    /* thanh máu thủ lĩnh */
    const bb = $('#bossbar');
    if (Game.boss && Game.boss.alive) {
      bb.hidden = false;
      bb.firstElementChild.textContent = Game.boss.def.name;
      bb.lastElementChild.firstElementChild.style.width = Math.max(0, Game.boss.hp / Game.boss.maxHp * 100) + '%';
    } else bb.hidden = true;
    this.minimap();
    $('#t-skill').classList.toggle('lock', !Game.unlocked('fireball'));
    $('#t-dash').classList.toggle('lock', !Game.unlocked('dash'));
    if (this.panelOpen) { this.panelT = (this.panelT || 0) + 1; }
  },

  minimap() {
    const cv = $('#minimap');
    const c = cv.getContext('2d');
    const W = cv.width, H = cv.height;
    c.clearRect(0, 0, W, H);
    c.fillStyle = 'rgba(14,13,11,0.6)'; c.fillRect(0, 0, W, H);
    const p = Game.player;
    if (Game.level === Game.world) {
      const sx = W / Game.world.w;
      for (const b of DATA.biomes) { c.fillStyle = M.rgba(b.top, 0.55); c.fillRect(b.from * TILE * sx, H - 5, (b.to - b.from) * TILE * sx, 5); }
      for (const pt of Game.world.portals) {
        const D = DATA.dungeons[pt.id];
        c.fillStyle = Game.cleared[pt.id] ? '#ffd27a' : p.realm >= D.req ? D.pal.glow : '#6a645a';
        c.beginPath(); c.arc(pt.x * sx, H / 2 - 1, 4, 0, Math.PI * 2); c.fill();
      }
      c.fillStyle = '#ffe9a8'; c.fillRect(Game.world.array.x * sx - 2, 3, 4, 8);
      for (const s of Game.structures) if (s.type === 'lua_trai') { c.fillStyle = s.fuel > 0 ? '#ff9a3c' : '#5a5248'; c.fillRect(s.x * sx - 1, 5, 2, 5); }
      for (const b of Game.bags) { c.fillStyle = '#ffd27a'; c.fillRect(b.x * sx - 1.5, 2, 3, 3); }
      for (const m of Game.mobs) if (m.alive && m.ai !== 'passive' && Math.abs(m.cx - p.cx) < 1200) { c.fillStyle = '#d65a43'; c.fillRect(m.cx * sx - 1, H / 2, 2, 2); }
      c.fillStyle = '#ffffff';
      c.beginPath(); const px = p.cx * sx; c.moveTo(px, 1); c.lineTo(px - 4, H - 3); c.lineTo(px + 4, H - 3); c.closePath(); c.fill();
    } else {
      const D = Game.dungeon, sx = W / D.w;
      c.fillStyle = M.rgba(D.def.pal.accent, 0.4); c.fillRect(0, H / 2 - 1, W, 2);
      c.fillStyle = '#d65a43'; c.fillRect(D.arena.x0 * sx, 3, W - D.arena.x0 * sx, H - 6);
      for (const sh of D.shrines) { c.fillStyle = sh.lit ? '#ffd27a' : '#6a645a'; c.fillRect(sh.x * sx - 1.5, 4, 3, H - 8); }
      for (const ch of D.chests) if (!ch.open) { c.fillStyle = '#c9a24f'; c.fillRect(ch.x * sx - 2, H / 2 - 2, 4, 4); }
      c.fillStyle = '#ffffff';
      c.beginPath(); const px = p.cx * sx; c.moveTo(px, 1); c.lineTo(px - 4, H - 3); c.lineTo(px + 4, H - 3); c.closePath(); c.fill();
    }
  },
};

/* ===== js/main.js ===== */
'use strict';
/* Khởi động & vòng lặp cố định 60 bước/giây */

const Main = {
  STEP: 1 / 60,
  acc: 0,
  last: 0,
  start() {
    const cv = document.getElementById('cv');
    Renderer.init(cv);
    Input.init(cv);
    UI.init();
    document.addEventListener('visibilitychange', () => { if (document.hidden && Game.mode === 'play') Game.save(); });
    window.addEventListener('beforeunload', () => { if (Game.mode === 'play') Game.save(); });
    requestAnimationFrame((t) => { this.last = t; this.loop(t); });
  },
  loop(ts) {
    const dt = Math.min(0.1, (ts - this.last) / 1000);
    this.last = ts;
    if (Game.mode === 'title') Game.demoTick(dt);
    else {
      this.acc += dt;
      let n = 0;
      while (this.acc >= this.STEP && n < 6) { Game.update(this.STEP); Input.endStep(); this.acc -= this.STEP; n++; }
      if (n === 6) this.acc = 0;
    }
    try { Renderer.draw(Game, ts / 1000, dt); } catch (e) { console.error(e); }
    UI.update(dt);
    let mood = 'day';
    if (Game.mode === 'play') mood = Game.boss && Game.boss.alive ? 'boss' : Game.level !== Game.world ? 'dungeon' : Game.isNight() ? 'night' : 'day';
    Sfx.music(dt, mood);
    requestAnimationFrame((t) => this.loop(t));
  },
};

/* Hỗ trợ giữ tiến trình khi trang được cập nhật trực tiếp */
(function () {
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) { try { hot.snapshot(() => ({ save: Game.mode === 'play' ? Game.serialize() : null })); } catch (e) { /* bỏ qua */ } }
  const boot = (data) => {
    Main.start();
    if (data && data.save) Game.load(data.save);
  };
  const go = () => { if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {}); };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
})();

</script>
