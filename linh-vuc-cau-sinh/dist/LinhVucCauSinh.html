<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Linh Vực Cầu Sinh</title>
<meta name="description" content="Linh Vực Cầu Sinh — game tu tiên sinh tồn màn hình ngang: chặt cây, chế tạo, dựng trại qua đêm, tu luyện đột phá, chinh phục bốn bí cảnh.">
<meta name="theme-color" content="#0e0d0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap">
<style>
/* Linh Vực Cầu Sinh — giao diện phủ trên canvas
   Bố cục: canvas toàn màn hình ngang; HUD bốn góc (chỉ số trái-trên, bản đồ giữa-trên, giờ phải-trên, thanh công cụ giữa-dưới);
   cảm ứng: di chuyển trái-dưới, hành động phải-dưới. Chủ đề: mực tàu trên giấy dó, son đỏ, vàng kim. */
:root {
  color-scheme: dark;
  --ink: #0e0d0b;
  --panel: rgba(16, 14, 12, 0.8);
  --panel-solid: #181511;
  --line: rgba(239, 231, 210, 0.16);
  --line-2: rgba(239, 231, 210, 0.32);
  --paper: #efe7d2;
  --paper-dim: #bdb4a0;
  --mute: #8a8474;
  --cinnabar: #c8402f;
  --gold: #d9b15f;
  --gold-2: #f1d38c;
  --jade: #6fc2a0;
  --azure: #5f9fd8;
  --amber: #d98c3a;
  --font-display: 'Playfair Display', 'Noto Serif', Georgia, serif;
  --font-ui: 'Be Vietnam Pro', system-ui, 'Segoe UI', Roboto, sans-serif;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  --gt: max(10px, env(safe-area-inset-top, 0px));
  --gb: max(10px, env(safe-area-inset-bottom, 0px));
  --hs: 44px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ink); color: var(--paper); font-family: var(--font-ui); font-size: 14px; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold-2); outline-offset: 2px; }
[hidden] { display: none !important; }
#game { position: fixed; inset: 0; overflow: hidden; }
#cv { position: absolute; display: block; background: var(--ink); }
#fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 30; }
#fade.on { animation: fade 1.6s ease-in-out; }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
#hud button { pointer-events: auto; }
.hud-tl { position: absolute; left: var(--gl); top: var(--gt); display: flex; flex-direction: column; gap: 8px; width: 230px; }
.stats { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px 9px; display: flex; flex-direction: column; gap: 4px; }
.realm { font-family: var(--font-display); font-weight: 700; font-size: 16px; line-height: 1.1; margin-bottom: 2px; font-variant-numeric: lining-nums; }
.bar { position: relative; height: 14px; border-radius: 2px; background: rgba(0, 0, 0, 0.55); overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; width: 0; transition: width 0.15s linear; }
.bar span { position: relative; display: block; padding: 0 6px; font-size: 10.5px; line-height: 14px; text-align: right; text-shadow: 0 1px 2px #000; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
.bar::before { position: absolute; left: 6px; top: 0; font-size: 10px; line-height: 14px; z-index: 1; color: rgba(255, 255, 255, 0.8); text-shadow: 0 1px 2px #000; }
.bar.hp::before { content: 'Sinh lực'; }
.bar.mp::before { content: 'Linh lực'; }
.bar.food::before { content: 'No bụng'; }
.bar.tv::before { content: 'Tu vi'; }
.bar.hp i { background: linear-gradient(90deg, #6e1a12, var(--cinnabar)); }
.bar.mp i { background: linear-gradient(90deg, #1e3f66, var(--azure)); }
.bar.food i { background: linear-gradient(90deg, #6a3f12, var(--amber)); }
.bar.tv i { background: linear-gradient(90deg, #6e5420, var(--gold)); }
.bar.warn { animation: warn 0.8s infinite; }
.goal { background: var(--panel); border: 1px solid var(--line); border-left: 2px solid var(--gold); border-radius: 0 6px 6px 0; padding: 6px 10px; font-size: 12px; line-height: 1.35; color: var(--paper-dim); }
.goal span { display: block; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); margin-bottom: 1px; }
.hud-tc { position: absolute; left: 50%; top: var(--gt); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; }
#minimap { width: 320px; height: 16px; border-radius: 3px; border: 1px solid var(--line); }
.bossbar { width: min(440px, 46vw); text-align: center; }
.bossbar .bn { font-family: var(--font-display); font-weight: 700; font-size: 17px; text-shadow: 0 2px 6px #000; color: #f3c4b8; }
.bar.boss { height: 10px; border: 1px solid rgba(200, 64, 47, 0.6); }
.bar.boss i { background: linear-gradient(90deg, #8a1f14, #e0543c); }
.hud-tr { position: absolute; right: var(--gr); top: var(--gt); display: flex; gap: 8px; align-items: flex-start; }
.clock { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.clock .ci { margin-right: 6px; }
.clock .where { font-size: 11px; color: var(--paper-dim); margin-top: 1px; }
.hud-btns { display: flex; flex-direction: column; gap: 6px; }
.hbtn { width: 40px; height: 40px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-size: 16px; }
.hbtn:hover { border-color: var(--gold); }
.hud-bc { position: absolute; left: 50%; bottom: var(--gb); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; }
#prompt { background: rgba(239, 231, 210, 0.92); color: var(--ink); padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4); white-space: nowrap; }
.held { font-size: 11px; color: var(--paper-dim); text-shadow: 0 1px 3px #000; min-height: 14px; }
.hotbar { display: flex; gap: 4px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.hs { position: relative; width: var(--hs); height: var(--hs); border-radius: 5px; border: 1px solid var(--line); background: rgba(0, 0, 0, 0.35); cursor: pointer; display: grid; place-items: center; padding: 0; }
.hs.sel { border-color: var(--gold-2); box-shadow: 0 0 0 1px var(--gold-2), 0 0 12px rgba(241, 211, 140, 0.4); background: rgba(217, 177, 95, 0.12); }
.hs em, .slot em { position: absolute; left: 3px; top: 1px; font-style: normal; font-size: 9px; color: var(--mute); }
.hs .ic, .slot .ic { font-size: calc(var(--hs) * 0.48); line-height: 1; font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; }
.hs b, .slot b { position: absolute; right: 3px; bottom: 1px; font-size: 10px; font-weight: 700; text-shadow: 0 1px 2px #000; }
.t1 { border-color: rgba(127, 207, 144, 0.5); }
.t2 { border-color: rgba(110, 174, 239, 0.6); }
.t3 { border-color: rgba(189, 146, 243, 0.7); }
.t4 { border-color: rgba(242, 170, 80, 0.8); box-shadow: inset 0 0 10px rgba(242, 170, 80, 0.25); }
#toasts { position: absolute; left: var(--gl); bottom: calc(var(--gb) + 70px); display: flex; flex-direction: column; gap: 4px; align-items: flex-start; max-width: 340px; }
.toast { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--azure); padding: 5px 10px; border-radius: 4px; font-size: 12.5px; transition: opacity 0.4s, transform 0.4s; animation: tin 0.2s; }
.toast.good { border-left-color: var(--jade); }
.toast.bad { border-left-color: var(--cinnabar); }
.toast.quest { border-left-color: var(--gold); color: var(--gold-2); }
.toast.pickup { border-left-color: var(--paper-dim); }
.toast.out { opacity: 0; transform: translateX(-12px); }
.banner { position: absolute; left: 0; right: 0; top: 24%; text-align: center; pointer-events: none; opacity: 0; transform: translateY(10px); transition: opacity 0.5s, transform 0.5s; }
.banner.show { opacity: 1; transform: none; }
.b-title { display: inline-block; font-family: var(--font-display); font-weight: 900; font-size: clamp(26px, 5vw, 46px); letter-spacing: 0.01em; text-shadow: 0 2px 18px rgba(0, 0, 0, 0.8); padding: 0 24px; background: linear-gradient(90deg, transparent, rgba(14, 13, 11, 0.7), transparent); font-variant-numeric: lining-nums; }
.b-sub { margin-top: 4px; font-size: 14px; color: var(--paper-dim); text-shadow: 0 1px 6px #000; }
.banner.realm .b-title { color: var(--gold-2); }
.banner.blood .b-title { color: #ff8a76; }
.banner.night .b-title { color: #c9d2ff; }
.banner.dungeon .b-title { color: var(--jade); }

/* ---------- Cảm ứng ---------- */
#touch { display: none; }
body.touch #touch { display: block; }
#touch button { pointer-events: auto; position: absolute; border-radius: 50%; border: 1px solid var(--line-2); background: rgba(16, 14, 12, 0.55); color: var(--paper); font-weight: 600; touch-action: none; }
#touch button.on { background: rgba(217, 177, 95, 0.35); border-color: var(--gold-2); }
#touch button.lock { opacity: 0.35; }
.t-left button { width: 72px; height: 72px; bottom: calc(var(--gb) + 14px); font-size: 22px; }
.t-left button[data-touch="left"] { left: var(--gl); }
.t-left button[data-touch="right"] { left: calc(var(--gl) + 84px); }
.t-right button.big { width: 74px; height: 74px; font-size: 14px; }
.t-right button.sm { width: 52px; height: 52px; font-size: 11.5px; }
.t-atk { right: calc(var(--gr) + 88px); bottom: calc(var(--gb) + 12px); }
.t-jump { right: var(--gr); bottom: calc(var(--gb) + 46px); background: rgba(95, 159, 216, 0.25) !important; }
.t-skill { right: calc(var(--gr) + 176px); bottom: calc(var(--gb) + 10px); }
.t-dash { right: calc(var(--gr) + 150px); bottom: calc(var(--gb) + 74px); }
.t-use { right: calc(var(--gr) + 92px); bottom: calc(var(--gb) + 100px); }
.t-act { right: calc(var(--gr) + 30px); bottom: calc(var(--gb) + 132px); background: rgba(239, 231, 210, 0.2) !important; }
.t-med { right: calc(var(--gr) + 150px); bottom: calc(var(--gb) + 136px); }
body.touch .hud-bc { bottom: calc(var(--gb) + 2px); }
body.touch #toasts { bottom: calc(var(--gb) + 100px); }

/* ---------- Túi đồ & chế tạo ---------- */
#panel { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(5, 4, 3, 0.6); padding: var(--gt) var(--gr) var(--gb) var(--gl); }
.panel-card { width: min(980px, 100%); max-height: 100%; display: flex; flex-direction: column; background: var(--panel-solid); border: 1px solid var(--line-2); border-radius: 8px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6); overflow: hidden; }
.panel-head { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.panel-head h2 { margin: 0; font-family: var(--font-display); font-size: 22px; flex: 1; }
.tabs { display: none; gap: 4px; }
.tab { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; cursor: pointer; }
.tab.on { border-color: var(--gold); color: var(--gold-2); }
.panel-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 0; overflow: hidden; min-height: 0; flex: 1; }
.panel-body section { overflow-y: auto; padding: 12px 14px; min-height: 0; }
.col-inv { border-right: 1px solid var(--line); }
.pinfo { font-size: 13px; margin-bottom: 10px; }
.inv-grid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
.slot { position: relative; aspect-ratio: 1; border-radius: 5px; border: 1px solid var(--line); background: rgba(0, 0, 0, 0.35); cursor: pointer; display: grid; place-items: center; padding: 0; --hs: 46px; }
.slot.hot { background: rgba(217, 177, 95, 0.06); }
.slot.sel { border-color: var(--gold-2); box-shadow: 0 0 0 1px var(--gold-2); }
.slot.empty .ic { display: none; }
.armor-row { display: flex; align-items: center; gap: 8px; margin: 10px 0; font-size: 13px; }
.armor-row .armor { flex: 1; }
.muted { color: var(--mute); }
.small { font-size: 12px; }
.detail { border: 1px solid var(--line); border-radius: 6px; padding: 10px; background: rgba(0, 0, 0, 0.25); }
.d-head { display: flex; gap: 10px; align-items: center; }
.ic.big { font-size: 30px; font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; }
.detail p { margin: 8px 0; }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
.near { font-size: 12px; margin-bottom: 4px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--jade); color: var(--jade); font-size: 11px; }
.col-craft h4 { margin: 12px 0 6px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
.col-craft h4.dim { color: var(--mute); }
.recipe { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 5px; border: 1px solid transparent; margin-bottom: 3px; background: rgba(0, 0, 0, 0.2); }
.recipe.can { border-color: rgba(111, 194, 160, 0.35); background: rgba(111, 194, 160, 0.07); }
.recipe .ic { font-size: 22px; width: 28px; text-align: center; font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif; }
.rinfo { flex: 1; min-width: 0; font-size: 13px; }
.need { display: flex; flex-wrap: wrap; gap: 6px; font-size: 11.5px; margin-top: 1px; }
.need .ok { color: var(--paper-dim); }
.need .miss { color: #e48a7a; }

/* ---------- Nút ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 8px 18px; border-radius: 6px; border: 1px solid var(--line-2); background: rgba(239, 231, 210, 0.06); cursor: pointer; font-weight: 600; }
.btn:hover:not(:disabled) { border-color: var(--gold); background: rgba(239, 231, 210, 0.1); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.primary { background: linear-gradient(180deg, #e2bd6c, #b98d3c); border-color: #e9c77e; color: #1d1406; }
.btn.primary:hover:not(:disabled) { background: linear-gradient(180deg, #f0d08a, #c99a46); }
.btn.ghost { background: transparent; }
.btn.sm { min-height: 30px; padding: 4px 10px; font-size: 12.5px; }

/* ---------- Màn hình phủ ---------- */
.screen { position: absolute; inset: 0; z-index: 25; display: grid; place-items: center; overflow-y: auto; padding: var(--gt) var(--gr) var(--gb) var(--gl); background: rgba(8, 7, 6, 0.72); }
.screen.title-screen { background: radial-gradient(ellipse at center, rgba(8, 7, 6, 0.35), rgba(8, 7, 6, 0.85)); }
.screen-card { width: min(720px, 100%); text-align: center; padding: 20px 16px; }
.screen.help .screen-card { width: min(1000px, 100%); text-align: left; }
.title-seal { display: inline-grid; place-items: center; width: 62px; height: 62px; border-radius: 8px; background: var(--cinnabar); color: #fff4e6; font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 36px; font-weight: 700; transform: rotate(-4deg); box-shadow: inset 0 0 0 3px rgba(255, 240, 220, 0.35); }
.title-seal.gold { background: #b98d3c; }
.title { margin: 14px 0 4px; font-family: var(--font-display); font-weight: 900; font-size: clamp(38px, 8vw, 76px); line-height: 1; letter-spacing: 0.01em; color: var(--paper); text-shadow: 0 4px 30px rgba(0, 0, 0, 0.7); text-wrap: balance; }
.subtitle { margin: 10px auto 22px; max-width: 54ch; color: var(--paper-dim); font-size: 15px; line-height: 1.55; text-shadow: 0 1px 8px #000; }
.menu { display: flex; flex-direction: column; gap: 8px; align-items: center; margin-top: 16px; }
.menu .btn { min-width: 260px; }
.fine { margin-top: 18px; font-size: 12px; color: var(--mute); }
.screen h2 { font-family: var(--font-display); font-weight: 900; font-size: clamp(26px, 5vw, 40px); margin: 6px 0 10px; }
.screen h2.bad { color: #ff8a76; }
.story { font-family: var(--font-display); font-style: italic; font-size: 17px; line-height: 1.6; color: var(--paper); max-width: 58ch; margin: 8px auto; }
.lost { font-size: 13px; color: #e48a7a; margin: 8px 0; }
.statline { margin-top: 16px; font-size: 12.5px; color: var(--paper-dim); }
.seed { display: flex; flex-direction: column; gap: 4px; align-items: center; margin: 10px 0; font-size: 12px; color: var(--paper-dim); }
.seed input { width: 220px; min-height: 40px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line-2); background: rgba(0, 0, 0, 0.4); color: var(--paper); font-size: 16px; text-align: center; -webkit-user-select: text; user-select: text; }
.help-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.help h3, .help-grid h3 { margin: 6px 0; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
.keys { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.keys td { padding: 4px 0; border-bottom: 1px dashed var(--line); vertical-align: top; }
.keys td:first-child { white-space: nowrap; padding-right: 10px; }
kbd { display: inline-block; min-width: 20px; padding: 1px 5px; margin-right: 2px; border-radius: 3px; border: 1px solid var(--line-2); background: rgba(0, 0, 0, 0.4); font-family: var(--font-ui); font-size: 11px; text-align: center; }
.tips { margin: 0; padding-left: 16px; font-size: 12.5px; line-height: 1.5; color: var(--paper-dim); }
.tips li { margin-bottom: 4px; }
.screen.help .menu { align-items: center; }

#rotate { display: none; position: absolute; inset: 0; z-index: 50; background: var(--ink); flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 16px; }
.rot-ic { font-size: 56px; animation: rot 2s ease-in-out infinite; }
#rotate p { font-family: var(--font-display); font-size: 22px; margin: 0; }

@keyframes fade { 0% { opacity: 0; } 40% { opacity: 1; } 60% { opacity: 1; } 100% { opacity: 0; } }
@keyframes warn { 50% { filter: brightness(1.6); } }
@keyframes tin { from { opacity: 0; transform: translateX(-12px); } }
@keyframes rot { 50% { transform: rotate(90deg); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }

/* ---------- Màn hình thấp (điện thoại xoay ngang) ---------- */
@media (max-height: 520px) {
  :root { --hs: 36px; }
  .hud-tl { width: 178px; gap: 5px; }
  .stats { padding: 5px 7px 6px; gap: 3px; }
  .realm { font-size: 13px; }
  .bar { height: 11px; }
  .bar span, .bar::before { line-height: 11px; font-size: 9px; }
  .goal { font-size: 10.5px; padding: 4px 8px; }
  .goal span { font-size: 9px; }
  #minimap { width: 220px; height: 12px; }
  .clock { font-size: 11px; padding: 4px 8px; }
  .clock .where { font-size: 10px; }
  .hbtn { width: 34px; height: 34px; font-size: 14px; }
  .held { display: none; }
  #prompt { font-size: 11.5px; padding: 3px 10px; }
  .b-sub { font-size: 12px; }
  .panel-head { padding: 6px 10px; }
  .panel-head h2 { font-size: 17px; }
  .menu .btn { min-width: 220px; min-height: 36px; }
  .title { font-size: 40px; }
  .subtitle { font-size: 13px; margin: 6px auto 10px; }
  .story { font-size: 14px; }
  .help-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .t-left button { width: 60px; height: 60px; }
  .t-left button[data-touch="right"] { left: calc(var(--gl) + 70px); }
  .t-right button.big { width: 62px; height: 62px; }
  .t-right button.sm { width: 46px; height: 46px; font-size: 10.5px; }
  .t-atk { right: calc(var(--gr) + 74px); }
  .t-jump { bottom: calc(var(--gb) + 40px); }
  .t-skill { right: calc(var(--gr) + 146px); }
  .t-dash { right: calc(var(--gr) + 128px); bottom: calc(var(--gb) + 64px); }
  .t-use { right: calc(var(--gr) + 78px); bottom: calc(var(--gb) + 86px); }
  .t-act { right: calc(var(--gr) + 22px); bottom: calc(var(--gb) + 112px); }
  .t-med { right: calc(var(--gr) + 130px); bottom: calc(var(--gb) + 116px); }
  body.touch .hotbar { transform: scale(0.92); transform-origin: bottom center; }
  body.touch #toasts { bottom: calc(var(--gb) + 80px); max-width: 260px; }
}
@media (max-width: 760px) {
  .tabs { display: flex; }
  .panel-body { grid-template-columns: minmax(0, 1fr); }
  .panel-body.tab-craft .col-inv { display: none; }

/* ===== js/util.js ===== */
'use strict';
/* Linh Vực Cầu Sinh — tiện ích toán học, ngẫu nhiên có hạt giống, nhiễu */

const TILE = 16;

const M = {
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  smooth: (t) => t * t * (3 - 2 * t),
  approach(v, target, step) { return v < target ? Math.min(v + step, target) : Math.max(v - step, target); },
  dist: (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by),
  sign: (v) => (v < 0 ? -1 : 1),
  overlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; },
  fmt(n) {
    n = Math.floor(n);
    if (n < 1000) return String(n);
    if (n < 1e6) return (n / 1000).toFixed(n < 1e4 ? 1 : 0).replace(/\.0$/, '') + 'K';
    return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
  },
  esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); },
  hexToRgb(h) {
    const n = parseInt(h.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  },
  mixColor(a, b, t) {
    const A = M.hexToRgb(a), B = M.hexToRgb(b);
    return 'rgb(' + Math.round(M.lerp(A[0], B[0], t)) + ',' + Math.round(M.lerp(A[1], B[1], t)) + ',' + Math.round(M.lerp(A[2], B[2], t)) + ')';
  },
  rgba(h, a) { const c = M.hexToRgb(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; },
};

/* Bộ sinh số ngẫu nhiên có hạt giống (mulberry32) */
class RNG {
  constructor(seed) { this.s = (seed >>> 0) || 1; }
  next() {
    let t = (this.s += 0x6d2b79f5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  range(a, b) { return a + this.next() * (b - a); }
  int(a, b) { return Math.floor(a + this.next() * (b - a + 1)); }
  chance(p) { return this.next() < p; }
  pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }
  weighted(list) {
    let total = 0;
    for (const it of list) total += it.w;
    let r = this.next() * total;
    for (const it of list) { r -= it.w; if (r <= 0) return it; }
    return list[list.length - 1];
  }
}

/* Nhiễu giá trị 1 chiều (dùng cho địa hình và dãy núi nền) */
const Noise = {
  hash(i, seed) {
    let h = (i * 374761393 + seed * 668265263) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  },
  value(x, seed) {
    const i = Math.floor(x), f = x - i;
    const a = Noise.hash(i, seed), b = Noise.hash(i + 1, seed);
    return M.lerp(a, b, M.smooth(f));
  },
  fbm(x, seed, oct = 4) {
    let v = 0, amp = 0.5, f = 1, norm = 0;
    for (let o = 0; o < oct; o++) {
      v += Noise.value(x * f, seed + o * 97) * amp;
      norm += amp;
      amp *= 0.5;
      f *= 2.03;
    }
    return v / norm;
  },
};

/* ===== js/world.js ===== */
'use strict';
/* Bản đồ dạng lưới ô: thế giới bên ngoài (Linh Vực) và bí cảnh sinh ngẫu nhiên */

const T_AIR = 0, T_GROUND = 1, T_ROCK = 2, T_ICE = 3, T_HAZARD = 4, T_GATE = 6, T_WOOD = 10, T_STONE = 11;
const SOLID = new Uint8Array(32);
[T_GROUND, T_ROCK, T_ICE, T_GATE, T_WOOD, T_STONE].forEach((t) => { SOLID[t] = 1; });

class Level {
  constructor(cols, rows, kind) {
    this.cols = cols;
    this.rows = rows;
    this.kind = kind;
    this.tiles = new Uint8Array(cols * rows);
    this.wallHp = new Map();
    this.w = cols * TILE;
    this.h = rows * TILE;
  }
  get(c, r) {
    if (c < 0 || c >= this.cols) return T_ROCK;
    if (r < 0) return T_AIR;
    if (r >= this.rows) return T_ROCK;
    return this.tiles[r * this.cols + c];
  }
  set(c, r, t) {
    if (c < 0 || c >= this.cols || r < 0 || r >= this.rows) return;
    this.tiles[r * this.cols + c] = t;
  }
  solid(c, r) { return SOLID[this.get(c, r)] === 1; }
  hazard(c, r) { return this.get(c, r) === T_HAZARD; }
  /* Hàng đầu tiên là ô rắn tính từ trên xuống (bỏ qua ô nguy hiểm) */
  topSolid(c, from = 0) {
    for (let r = Math.max(0, from); r < this.rows; r++) if (this.solid(c, r)) return r;
    return this.rows;
  }
  /* Kiểm tra hộp va chạm có chạm ô rắn không */
  boxSolid(x, y, w, h) {
    const c0 = Math.floor(x / TILE), c1 = Math.floor((x + w - 0.01) / TILE);
    const r0 = Math.floor(y / TILE), r1 = Math.floor((y + h - 0.01) / TILE);
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (this.solid(c, r)) return true;
    return false;
  }
  boxHazard(x, y, w, h) {
    const c0 = Math.floor(x / TILE), c1 = Math.floor((x + w - 0.01) / TILE);
    const r0 = Math.floor(y / TILE), r1 = Math.floor((y + h + 1) / TILE);
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (this.hazard(c, r)) return true;
    return false;
  }
}

/* ======================= Linh Vực (thế giới bên ngoài) ======================= */
class Overworld extends Level {
  constructor(seed) {
    super(DATA.WORLD_COLS, DATA.WORLD_ROWS, 'overworld');
    this.seed = seed >>> 0;
    this.generate();
  }

  biomeIndexAt(c) {
    for (let i = 0; i < DATA.biomes.length; i++) if (c < DATA.biomes[i].to) return i;
    return DATA.biomes.length - 1;
  }
  biomeAt(c) { return DATA.biomes[this.biomeIndexAt(Math.max(0, Math.min(this.cols - 1, Math.floor(c))))]; }
  biomeAtX(x) { return this.biomeAt(x / TILE); }

  generate() {
    const rng = new RNG(this.seed);
    const cols = this.cols, B = DATA.biomes;
    const h = new Float32Array(cols);
    /* Địa hình: trộn mượt tham số các vùng ở ranh giới */
    for (let c = 0; c < cols; c++) {
      let sw = 0, sh = 0;
      B.forEach((b, i) => {
        const m = M.clamp((c - (b.from - 15)) / 30, 0, 1) * M.clamp(((b.to + 15) - c) / 30, 0, 1);
        if (m <= 0) return;
        const n = Noise.fbm(c * b.freq, this.seed + i * 131);
        let hh = b.base - b.amp * (n - 0.5) * 2.2;
        if (b.id === 'loi_phong') hh -= 8 * Math.max(0, Math.sin(c * 0.04 + this.seed % 7));
        sh += hh * m; sw += m;
      });
      h[c] = sh / sw;
    }
    const H = new Int16Array(cols);
    for (let c = 0; c < cols; c++) H[c] = Math.round(h[c]);
    /* San phẳng khu khởi đầu và cổng bí cảnh */
    const flat = (center, rad) => {
      const t = H[center];
      for (let c = center - rad; c <= center + rad; c++) if (c >= 0 && c < cols) H[c] = t;
    };
    flat(DATA.SPAWN_COL, 16);
    for (const id of DATA.dungeonOrder) flat(DATA.dungeons[id].col, 7);
    /* Hồ băng ở Hàn Đàm */
    const lake0 = 120, lake1 = 152;
    for (let c = lake0; c <= lake1; c++) H[c] = H[lake0] + 2;
    /* Giới hạn độ dốc: vùng núi cho phép bậc 2 ô, còn lại 1 ô */
    const maxStep = (c) => { const id = this.biomeAt(c).id; return id === 'loi_phong' || id === 'xich_thach' ? 2 : 1; };
    for (let pass = 0; pass < 3; pass++) {
      for (let c = 1; c < cols; c++) { const m = maxStep(c); if (H[c] - H[c - 1] > m) H[c] = H[c - 1] + m; if (H[c - 1] - H[c] > m) H[c] = H[c - 1] - m; }
      for (let c = cols - 2; c >= 0; c--) { const m = maxStep(c); if (H[c] - H[c + 1] > m) H[c] = H[c + 1] + m; if (H[c + 1] - H[c] > m) H[c] = H[c + 1] - m; }
    }
    for (let c = 0; c < cols; c++) H[c] = M.clamp(H[c], 30, this.rows - 8);
    this.heights = H;
    /* Lấp ô */
    for (let c = 0; c < cols; c++) {
      const top = H[c];
      const ice = c >= lake0 && c <= lake1;
      for (let r = top; r < this.rows; r++) this.set(c, r, r === top && ice ? T_ICE : r < top + 7 ? T_GROUND : T_ROCK);
    }
    this.lake = [lake0, lake1];
    /* Điểm đặc biệt */
    this.spawnX = DATA.SPAWN_COL * TILE + TILE / 2;
    this.portals = DATA.dungeonOrder.map((id) => {
      const c = DATA.dungeons[id].col;
      return { id, c, x: c * TILE + TILE / 2, y: H[c] * TILE };
    });
    this.array = { x: this.spawnX, y: H[DATA.SPAWN_COL] * TILE };
    /* Tài nguyên */
    const protectedCols = [DATA.SPAWN_COL].concat(DATA.dungeonOrder.map((id) => DATA.dungeons[id].col));
    this.resources = [];
    let c = 6;
    while (c < cols - 6) {
      const b = this.biomeAt(c);
      const near = protectedCols.some((p) => Math.abs(p - c) < (p === DATA.SPAWN_COL ? 10 : 9));
      const slope = Math.abs(H[c - 1] - H[c + 1]);
      const inLake = c >= lake0 - 1 && c <= lake1 + 1;
      if (!near && slope <= 1 && !inLake) {
        const pick = rng.weighted(b.res.map(([t, w]) => ({ t, w })));
        const R = DATA.resources[pick.t];
        this.resources.push({ id: 'r' + c, type: pick.t, c, x: c * TILE + TILE / 2, y: H[c] * TILE, hp: R.hp, alive: true, regrowDay: 0, flip: rng.chance(0.5), size: rng.range(0.85, 1.15), shake: 0 });
      }
      c += R_SPACING(b.id, rng);
    }
    function R_SPACING(id, r) { return id === 'truc_lam' ? r.int(2, 5) : id === 'tan_tich' ? r.int(4, 9) : r.int(3, 7); }
    /* Đạo cụ trang trí (tàn tích, bia đá) */
    this.props = [];
    for (let i = 0; i < 26; i++) {
      const pc = rng.int(430, 670);
      if (Math.abs(pc - DATA.SPAWN_COL) < 18) continue;
      this.props.push({ kind: rng.pick(['pillar', 'pillar', 'gate', 'stele', 'lantern']), x: pc * TILE, y: H[pc] * TILE, s: rng.range(0.8, 1.3) });
    }
    for (let i = 0; i < 14; i++) {
      const pc = rng.int(900, 1090);
      this.props.push({ kind: 'spire', x: pc * TILE, y: H[pc] * TILE, s: rng.range(0.7, 1.4) });
    }
  }

  groundY(x) { const c = M.clamp(Math.floor(x / TILE), 0, this.cols - 1); return this.heights[c] * TILE; }
}

/* ======================= Bí cảnh sinh ngẫu nhiên ======================= */
class Dungeon extends Level {
  constructor(id, seed) {
    const d = DATA.dungeons[id];
    const cols = 26 + d.sections * 40 + 70;
    super(cols, 34, 'dungeon');
    this.id = id;
    this.def = d;
    this.seed = seed >>> 0;
    let ok = false;
    for (let attempt = 0; attempt < 12 && !ok; attempt++) {
      this.tiles.fill(0);
      this.build(new RNG(this.seed + attempt * 7919));
      ok = this.validate();
      this.attempts = attempt + 1;
    }
    this.valid = ok;
  }

  build(rng) {
    const ROWS = this.rows, cols = this.cols;
    const floor = new Int16Array(cols).fill(24);
    const ceil = new Int16Array(cols).fill(12);
    const hazard = new Uint8Array(cols);
    const plats = [];
    this.spawns = [];
    this.chests = [];
    this.shrines = [];
    this.torches = [];
    const d = this.def;
    let c = 0, fl = 24;
    const flatRun = (n, h) => { for (let i = 0; i < n && c < cols; i++, c++) floor[c] = h; };
    /* Lối vào */
    flatRun(26, fl);
    this.entrance = { c: 5, x: 5 * TILE + TILE / 2, y: fl * TILE };
    this.shrines.push({ c: 14, x: 14 * TILE + TILE / 2, y: fl * TILE, lit: true });
    let lastFeature = '';
    const mons = d.mons;
    const ground = mons.filter((m) => !['flyer', 'diver', 'ghost'].includes(DATA.monsters[m].ai) && !DATA.monsters[m].fly);
    const air = mons.filter((m) => ['flyer', 'diver', 'ghost'].includes(DATA.monsters[m].ai) || DATA.monsters[m].fly);
    const addSpawn = (cc, rr, list) => {
      if (!list.length) list = mons;
      this.spawns.push({ type: rng.pick(list), c: cc, r: rr, elite: rng.chance(0.12) });
    };
    for (let s = 0; s < d.sections; s++) {
      const start = c;
      let feat = rng.weighted([{ f: 'hills', w: 3 }, { f: 'pit', w: 3 }, { f: 'platforms', w: lastFeature === 'platforms' ? 0 : 3 }, { f: 'stairs', w: 2 }, { f: 'arena', w: 2 }]).f;
      if (s === 0) feat = 'hills';
      lastFeature = feat;
      if (feat === 'hills') {
        while (c < start + 40) {
          fl = M.clamp(fl + rng.int(-3, 3), 17, 27);
          flatRun(Math.min(rng.int(4, 8), start + 40 - c), fl);
        }
        addSpawn(start + 12, floor[start + 12] - 1, ground);
        addSpawn(start + 30, floor[start + 30] - 1, ground);
      } else if (feat === 'pit') {
        flatRun(12, fl);
        const pw = rng.int(2, 4);
        for (let i = 0; i < pw; i++, c++) { floor[c] = ROWS - 2; hazard[c] = 1; }
        fl = M.clamp(fl + rng.int(-1, 1), 17, 27);
        flatRun(start + 40 - c, fl);
        addSpawn(start + 30, floor[start + 30] - 1, ground);
        addSpawn(start + 12 + Math.floor(pw / 2), fl - 6, air);
      } else if (feat === 'platforms') {
        flatRun(5, fl);
        const end = start + 34;
        let ph = fl - 1;
        let pc = c;
        while (pc < end) {
          const gap = rng.int(2, 3);
          for (let i = 0; i < gap && pc < end; i++, pc++) { floor[pc] = ROWS - 2; hazard[pc] = 1; }
          if (pc >= end) break;
          const pw = rng.int(3, 5);
          ph = M.clamp(ph + rng.int(-2, 2), 15, 24);
          plats.push({ c0: pc, c1: Math.min(end - 1, pc + pw - 1), r: ph });
          for (let i = 0; i < pw && pc < end; i++, pc++) { floor[pc] = ROWS - 2; hazard[pc] = 1; }
        }
        c = end;
        /* bờ đáp: không thấp hơn bệ cuối quá nhiều và không cao hơn 2 ô */
        fl = M.clamp(ph + rng.int(0, 2), 17, 26);
        if (plats.length) {
          const lp = plats[plats.length - 1];
          if (end - lp.c1 > 4) { plats.push({ c0: end - 3, c1: end - 1, r: M.clamp(fl - 1, 15, 24) }); }
        }
        flatRun(start + 40 - c, fl);
        addSpawn(start + 18, ph - 5, air);
        addSpawn(start + 37, floor[start + 37] - 1, ground);
      } else if (feat === 'stairs') {
        const steps = rng.int(3, 4);
        for (let i = 0; i < steps; i++) { fl = M.clamp(fl - 2, 15, 27); flatRun(3, fl); }
        const top = c;
        flatRun(8, fl);
        this.chestSpot(rng, top + 4, fl);
        while (c < start + 40) { fl = M.clamp(fl + 2, 15, 27); flatRun(Math.min(3, start + 40 - c), fl); }
        addSpawn(top + 4, floor[top + 4] - 1, mons.filter((m) => DATA.monsters[m].ai === 'shooter' || DATA.monsters[m].ai === 'turret').concat(ground));
      } else {
        fl = M.clamp(fl + rng.int(-2, 2), 18, 26);
        flatRun(40, fl);
        plats.push({ c0: start + 12, c1: start + 17, r: fl - 4 });
        plats.push({ c0: start + 24, c1: start + 29, r: fl - 5 });
        this.chestSpot(rng, start + 26, fl - 5);
        addSpawn(start + 10, fl - 1, ground);
        addSpawn(start + 20, fl - 1, ground);
        addSpawn(start + 32, fl - 7, air);
      }
      if (s === Math.floor(d.sections / 2)) {
        const sc = start + 3;
        this.shrines.push({ c: sc, x: sc * TILE + TILE / 2, y: floor[sc] * TILE, lit: false });
      }
    }
    /* Đấu trường thủ lĩnh */
    const arena0 = c + 4;
    fl = 24;
    flatRun(cols - c, fl);
    for (let i = arena0 - 4; i < cols; i++) { floor[i] = fl; ceil[i] = 5; }
    plats.push({ c0: arena0 + 12, c1: arena0 + 19, r: 19 });
    plats.push({ c0: arena0 + 42, c1: arena0 + 49, r: 19 });
    this.arena = { c0: arena0, c1: cols - 2, gateC: arena0 - 1, floorR: fl, x0: arena0 * TILE, x1: (cols - 2) * TILE, y: fl * TILE };
    this.bossSpawn = { x: (arena0 + 44) * TILE, y: fl * TILE };
    /* Trần hang */
    for (let i = 0; i < arena0 - 4; i++) {
      let lowest = floor[i];
      if (hazard[i]) lowest = 26;
      for (const p of plats) if (i >= p.c0 - 2 && i <= p.c1 + 2) lowest = Math.min(lowest, p.r);
      const n = Noise.value(i * 0.15, this.seed % 9973);
      ceil[i] = Math.max(2, Math.min(lowest - 9, Math.round(lowest - 11 - n * 4)));
    }
    /* Lấp ô */
    for (let i = 0; i < cols; i++) {
      for (let r = 0; r <= ceil[i]; r++) this.set(i, r, T_ROCK);
      for (let r = floor[i]; r < ROWS; r++) this.set(i, r, T_ROCK);
      if (hazard[i]) { this.set(i, ROWS - 3, T_HAZARD); this.set(i, ROWS - 2, T_ROCK); }
    }
    for (const p of plats) for (let i = p.c0; i <= p.c1; i++) { this.set(i, p.r, T_ROCK); this.set(i, p.r + 1, T_ROCK); }
    /* Tường cuối */
    for (let r = 0; r < ROWS; r++) { this.set(cols - 1, r, T_ROCK); this.set(cols - 2, r, r < fl ? T_AIR : T_ROCK); }
    this.floor = floor;
    this.ceil = ceil;
    this.plats = plats;
    this.hazardCols = hazard;
    /* Đuốc trang trí */
    for (let i = 8; i < cols - 4; i += 11 + (i % 5)) {
      if (hazard[i]) continue;
      this.torches.push({ x: i * TILE + TILE / 2, y: (floor[i] - 4) * TILE });
    }
    /* Dời điểm xuất hiện của quái nếu rơi vào trong đá */
    for (const sp of this.spawns) {
      const isAir = air.includes(sp.type);
      if (!this.solid(sp.c, sp.r) && !this.solid(sp.c, sp.r - 1) && (isAir || this.solid(sp.c, sp.r + 1))) continue;
      let best = -1;
      for (let r = ceil[sp.c] + 2; r < ROWS - 3; r++) {
        if (this.solid(sp.c, r) || this.solid(sp.c, r - 1) || this.hazard(sp.c, r)) continue;
        if (isAir) { if (best < 0 || Math.abs(r - (ceil[sp.c] + 4)) < Math.abs(best - (ceil[sp.c] + 4))) best = r; }
        else if (this.solid(sp.c, r + 1) && !this.hazard(sp.c, r + 1)) { best = r; break; }
      }
      sp.r = best;
    }
    this.spawns = this.spawns.filter((sp) => sp.r > 0);
    /* Rương phụ ở khu bằng phẳng */
    for (let tries = 0; this.chests.length < 3 && tries < 300; tries++) {
      const cc = rng.int(30, arena0 - 10);
      if (!hazard[cc] && Math.abs(floor[cc] - floor[cc + 1]) === 0) this.chestSpot(rng, cc, floor[cc]);
    }
  }

  chestSpot(rng, c, r) {
    if (this.chests.some((ch) => Math.abs(ch.c - c) < 6)) return;
    this.chests.push({ c, x: c * TILE + TILE / 2, y: r * TILE, open: false });
  }

  setGate(closed) {
    const g = this.arena.gateC;
    for (let r = 0; r < this.arena.floorR; r++) if (!this.solid(g, r) || this.get(g, r) === T_GATE) this.set(g, r, closed ? T_GATE : T_AIR);
  }

  /* Kiểm tra có đường đi từ lối vào tới đấu trường thủ lĩnh (mô phỏng khả năng nhảy của nhân vật) */
  standable(c, r) {
    return !this.solid(c, r) && !this.solid(c, r - 1) && this.solid(c, r + 1) && !this.hazard(c, r) && !this.hazard(c, r + 1);
  }
  validate() {
    const start = { c: this.entrance.c, r: this.floor[this.entrance.c] - 1 };
    if (!this.standable(start.c, start.r)) return false;
    const key = (c, r) => r * this.cols + c;
    const seen = new Uint8Array(this.cols * this.rows);
    const q = [start];
    seen[key(start.c, start.r)] = 1;
    while (q.length) {
      const p = q.shift();
      if (p.c >= this.arena.c0) { this.reach = seen; return true; }
      for (let dx = -6; dx <= 6; dx++) {
        for (let dy = -4; dy <= 8; dy++) {
          if (!dx && !dy) continue;
          const lim = dy <= -3 ? 3 : dy <= 0 ? 5 : 6;
          if (Math.abs(dx) > lim) continue;
          const nc = p.c + dx, nr = p.r + dy;
          if (nc < 0 || nc >= this.cols || nr < 1 || nr >= this.rows - 1) continue;
          if (seen[key(nc, nr)] || !this.standable(nc, nr)) continue;
          /* khoảng trống phía trên quỹ đạo */
          const topR = Math.min(p.r, nr) - (dy < 0 ? 2 : 1);
          let clear = true;
          const step = dx > 0 ? 1 : -1;
          for (let i = p.c; dx && i !== nc + step; i += step) {
            if (this.solid(i, topR) || this.solid(i, topR + 1)) { clear = false; break; }
          }
          if (!clear) continue;
          seen[key(nc, nr)] = 1;
          q.push({ c: nc, r: nr });
        }
      }
    }
    return false;
  }
}

/* ===== js/inventory.js ===== */
'use strict';
/* Túi đồ (8 ô đầu là thanh công cụ) và chế tạo */

class Inventory {
  constructor(size = 32) {
    this.slots = new Array(size).fill(null);
    this.armor = null;
    this.sel = 0;
  }
  def(id) { return DATA.items[id]; }
  count(id) {
    let n = 0;
    for (const s of this.slots) if (s && s.id === id) n += s.n;
    if (this.armor === id) n++;
    return n;
  }
  has(id, n = 1) { return this.count(id) >= n; }
  hasAll(need, mult = 1) {
    for (const id in need) if (this.count(id) < need[id] * mult) return false;
    return true;
  }
  /* Thêm vật phẩm, trả về số còn thừa nếu túi đầy */
  add(id, n = 1) {
    const d = this.def(id);
    if (!d) return n;
    const max = d.stack;
    if (max > 1) {
      for (const s of this.slots) {
        if (s && s.id === id && s.n < max) {
          const k = Math.min(n, max - s.n);
          s.n += k; n -= k;
          if (!n) return 0;
        }
      }
    }
    for (let i = 0; i < this.slots.length && n > 0; i++) {
      if (!this.slots[i]) {
        const k = Math.min(n, max);
        this.slots[i] = { id, n: k };
        n -= k;
      }
    }
    return n;
  }
  remove(id, n = 1) {
    if (this.count(id) < n) return false;
    for (let i = this.slots.length - 1; i >= 0 && n > 0; i--) {
      const s = this.slots[i];
      if (s && s.id === id) {
        const k = Math.min(n, s.n);
        s.n -= k; n -= k;
        if (s.n <= 0) this.slots[i] = null;
      }
    }
    return true;
  }
  removeAll(need, mult = 1) {
    if (!this.hasAll(need, mult)) return false;
    for (const id in need) this.remove(id, need[id] * mult);
    return true;
  }
  selected() { return this.slots[this.sel]; }
  selectedDef() { const s = this.selected(); return s ? this.def(s.id) : null; }
  swap(i, j) { const t = this.slots[i]; this.slots[i] = this.slots[j]; this.slots[j] = t; }
  freeSlots() { return this.slots.filter((s) => !s).length; }
  /* Bỏ một nửa nguyên liệu và thức ăn (khi tử vong), trả về danh sách đã bỏ */
  dropFraction(frac) {
    const out = {};
    this.slots.forEach((s, i) => {
      if (!s) return;
      const d = this.def(s.id);
      if (d.cat !== 'mat' && d.cat !== 'food') return;
      const k = Math.floor(s.n * frac);
      if (k <= 0) return;
      s.n -= k;
      out[s.id] = (out[s.id] || 0) + k;
      if (s.n <= 0) this.slots[i] = null;
    });
    return out;
  }
  toJSON() { return { slots: this.slots, armor: this.armor, sel: this.sel }; }
  static from(o) {
    const inv = new Inventory();
    if (o) {
      o.slots.forEach((s, i) => { if (i < inv.slots.length && s && DATA.items[s.id]) inv.slots[i] = { id: s.id, n: s.n }; });
      inv.armor = o.armor && DATA.items[o.armor] ? o.armor : null;
      inv.sel = o.sel || 0;
    }
    return inv;
  }
}

const Craft = {
  /* Các trạm chế tác trong tầm với của người chơi */
  stationsNear(game) {
    const set = new Set();
    if (!game.structures) return set;
    const p = game.player;
    for (const s of game.structures) {
      const def = DATA.structures[s.type];
      if (def.station && Math.abs(s.x - p.cx) < 90 && Math.abs(s.y - p.bottom) < 60) {
        if (s.type === 'lua_trai' && s.fuel <= 0) continue;
        set.add(def.station);
      }
    }
    return set;
  },
  list(game) {
    const near = Craft.stationsNear(game);
    return DATA.recipes.map((r) => ({
      r,
      near: !r.station || near.has(r.station),
      can: (!r.station || near.has(r.station)) && game.inv.hasAll(r.need),
    }));
  },
  maxTimes(game, r) {
    let n = 99;
    for (const id in r.need) n = Math.min(n, Math.floor(game.inv.count(id) / r.need[id]));
    return n;
  },
  make(game, r, times = 1) {
    const near = Craft.stationsNear(game);
    if (r.station && !near.has(r.station)) return { ok: false, msg: 'Cần đứng gần ' + DATA.stationNames[r.station] + '.' };
    times = Math.min(times, Craft.maxTimes(game, r));
    if (times <= 0) return { ok: false, msg: 'Không đủ nguyên liệu.' };
    game.inv.removeAll(r.need, times);
    const n = (r.n || 1) * times;
    const left = game.inv.add(r.out, n);
    if (left > 0) game.spawnDrop(r.out, left, game.player.cx, game.player.y);
    game.stats.crafted += times;
    return { ok: true, msg: 'Chế tạo ' + DATA.items[r.out].name + ' ×' + n };
  },
};

/* ===== js/input.js ===== */
'use strict';
/* Điều khiển: bàn phím, chuột, nút cảm ứng */

const Input = {
  keys: {},
  virt: {},
  _pressed: {},
  _released: {},
  onAction: null,
  usedTouch: false,
  map: {
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    ArrowUp: 'jump', KeyW: 'jump', Space: 'jump',
    KeyJ: 'attack', KeyK: 'skill', KeyL: 'dash', ShiftLeft: 'dash', ShiftRight: 'dash',
    KeyE: 'interact', KeyF: 'use', KeyM: 'meditate', KeyQ: 'prev', KeyR: 'next',
    Tab: 'inv', KeyI: 'inv', KeyC: 'inv', Escape: 'pause', KeyP: 'pause',
    Digit1: 'slot1', Digit2: 'slot2', Digit3: 'slot3', Digit4: 'slot4', Digit5: 'slot5', Digit6: 'slot6', Digit7: 'slot7', Digit8: 'slot8',
  },

  down(a) { return !!(this.keys[a] || this.virt[a]); },
  pressed(a) { return !!this._pressed[a]; },
  released(a) { return !!this._released[a]; },
  endStep() { this._pressed = {}; this._released = {}; },

  setState(store, a, v) {
    const before = this.down(a);
    store[a] = v;
    const after = this.down(a);
    if (!before && after) this._pressed[a] = true;
    if (before && !after) this._released[a] = true;
  },
  key(a, v) { this.setState(this.keys, a, v); },
  touch(a, v) { this.usedTouch = true; this.setState(this.virt, a, v); },
  tap(a) { this._pressed[a] = true; },
  clear() { this.keys = {}; this.virt = {}; },

  init(canvas) {
    const typing = (e) => e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA');
    window.addEventListener('keydown', (e) => {
      if (typing(e)) return;
      const a = this.map[e.code];
      if (!a) return;
      if (a === 'inv' || a === 'pause' || a === 'jump' || e.code.startsWith('Arrow') || e.code === 'Tab') e.preventDefault();
      if (e.repeat) return;
      if ((a === 'inv' || a === 'pause') && this.onAction) { this.onAction(a); return; }
      this.key(a, true);
    });
    window.addEventListener('keyup', (e) => {
      const a = this.map[e.code];
      if (a) this.key(a, false);
    });
    window.addEventListener('blur', () => { for (const k in this.keys) if (this.keys[k]) this.key(k, false); });
    canvas.addEventListener('mousedown', (e) => {
      if (e.button === 0) this.key('attack', true);
      if (e.button === 2) this.key('use', true);
    });
    window.addEventListener('mouseup', (e) => {
      if (e.button === 0) this.key('attack', false);
      if (e.button === 2) this.key('use', false);
    });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    canvas.addEventListener('wheel', (e) => { e.preventDefault(); this.tap(e.deltaY > 0 ? 'next' : 'prev'); }, { passive: false });
  },

  /* Gắn nút cảm ứng: phần tử có data-touch="action" */
  bindTouch(root) {
    const active = new Map();
    const start = (e) => {
      for (const t of e.changedTouches) {
        const el = document.elementFromPoint(t.clientX, t.clientY);
        const btn = el && el.closest('[data-touch]');
        if (!btn) continue;
        e.preventDefault();
        active.set(t.identifier, btn);
        btn.classList.add('on');
        this.touch(btn.dataset.touch, true);
      }
    };
    const move = (e) => {
      for (const t of e.changedTouches) {
        const prev = active.get(t.identifier);
        const el = document.elementFromPoint(t.clientX, t.clientY);
        const btn = el && el.closest('[data-touch]');
        if (btn === prev) continue;
        if (prev && (prev.dataset.touch === 'left' || prev.dataset.touch === 'right') && btn && (btn.dataset.touch === 'left' || btn.dataset.touch === 'right')) {
          prev.classList.remove('on'); this.touch(prev.dataset.touch, false);
          btn.classList.add('on'); this.touch(btn.dataset.touch, true);
          active.set(t.identifier, btn);
        }
      }
    };
    const end = (e) => {
      for (const t of e.changedTouches) {
        const btn = active.get(t.identifier);
        if (!btn) continue;
        btn.classList.remove('on');
        this.touch(btn.dataset.touch, false);
        active.delete(t.identifier);
      }
    };
    root.addEventListener('touchstart', start, { passive: false });
    root.addEventListener('touchmove', move, { passive: false });
    root.addEventListener('touchend', end);
    root.addEventListener('touchcancel', end);
  },
};

/* ===== js/audio.js ===== */
'use strict';
/* Âm thanh tổng hợp bằng WebAudio: hiệu ứng và nhạc nền ngũ cung kiểu đàn tranh */

const Sfx = {
  ctx: null, master: null, musicGain: null, on: true, musicOn: true, last: {},
  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.55; this.master.connect(this.ctx.destination);
      this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = 0.32; this.musicGain.connect(this.master);
    } catch (e) { this.ctx = null; }
  },
  resume() { this.init(); if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); },
  tone(f, d, type, vol, when = 0, slide = 0, dest) {
    const c = this.ctx, t = c.currentTime + when;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(dest || this.master);
    o.start(t); o.stop(t + d + 0.05);
  },
  noise(d, vol, freq, type = 'lowpass', when = 0) {
    const c = this.ctx, len = Math.floor(c.sampleRate * d);
    const buf = c.createBuffer(1, len, c.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    const s = c.createBufferSource(); s.buffer = buf;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = c.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(c.currentTime + when);
  },
  play(name) {
    if (!this.on || !this.ctx || this.ctx.state !== 'running') return;
    const now = performance.now();
    if (now - (this.last[name] || 0) < 45) return;
    this.last[name] = now;
    try {
      switch (name) {
        case 'jump': this.tone(380, 0.12, 'triangle', 0.05, 0, 1.6); break;
        case 'jump2': this.tone(520, 0.16, 'sine', 0.06, 0, 1.8); break;
        case 'dash': this.noise(0.18, 0.12, 2400, 'bandpass'); break;
        case 'swing': this.noise(0.09, 0.08, 3200, 'highpass'); break;
        case 'hit': this.noise(0.07, 0.16, 900); this.tone(140, 0.08, 'square', 0.03); break;
        case 'crit': this.noise(0.12, 0.2, 1600); this.tone(880, 0.1, 'triangle', 0.05); break;
        case 'kill': this.tone(220, 0.25, 'sawtooth', 0.03, 0, 0.4); this.noise(0.2, 0.1, 500); break;
        case 'hurt': this.tone(200, 0.2, 'square', 0.05, 0, 0.6); break;
        case 'chop': this.noise(0.06, 0.18, 700); this.tone(180, 0.06, 'triangle', 0.05); break;
        case 'fall': this.noise(0.5, 0.15, 300); break;
        case 'mine': this.tone(1100, 0.05, 'square', 0.03); this.noise(0.05, 0.14, 2500, 'bandpass'); break;
        case 'clink': this.tone(1600, 0.08, 'triangle', 0.04); break;
        case 'pluck': this.tone(700, 0.08, 'sine', 0.05, 0, 1.3); break;
        case 'pickup': this.tone(880, 0.07, 'triangle', 0.035); this.tone(1320, 0.09, 'triangle', 0.03, 0.05); break;
        case 'place': this.noise(0.1, 0.15, 400); break;
        case 'eat': this.noise(0.08, 0.08, 1200, 'bandpass'); this.noise(0.08, 0.08, 1200, 'bandpass', 0.12); break;
        case 'pill': this.tone(660, 0.2, 'sine', 0.05, 0, 1.5); break;
        case 'equip': this.tone(440, 0.1, 'triangle', 0.05); this.tone(660, 0.12, 'triangle', 0.05, 0.06); break;
        case 'craft': [523, 659, 784].forEach((f, i) => this.tone(f, 0.15, 'triangle', 0.045, i * 0.06)); break;
        case 'fire': this.noise(0.3, 0.12, 900); this.tone(300, 0.25, 'sawtooth', 0.025, 0, 0.5); break;
        case 'wave': this.noise(0.2, 0.12, 4000, 'highpass'); break;
        case 'shoot': this.tone(500, 0.12, 'square', 0.025, 0, 0.6); break;
        case 'ice': this.tone(1500, 0.25, 'sine', 0.04, 0, 0.5); break;
        case 'charge': this.noise(0.4, 0.12, 300); break;
        case 'screech': this.tone(1200, 0.3, 'sawtooth', 0.03, 0, 0.5); break;
        case 'rumble': this.noise(0.6, 0.18, 160); break;
        case 'slam': this.noise(0.4, 0.3, 200); this.tone(60, 0.4, 'sine', 0.12, 0, 0.5); break;
        case 'thunder': this.noise(0.9, 0.3, 700); this.tone(55, 0.7, 'sawtooth', 0.06, 0, 0.6); break;
        case 'roar': this.tone(90, 0.9, 'sawtooth', 0.08, 0, 0.6); this.noise(0.9, 0.15, 400); break;
        case 'realm': [392, 523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.45, 'sine', 0.05, i * 0.08)); break;
        case 'portal': this.tone(220, 0.8, 'sine', 0.06, 0, 2); this.tone(330, 0.8, 'sine', 0.04, 0.1, 2); break;
        case 'chest': [659, 784, 988, 1319].forEach((f, i) => this.tone(f, 0.18, 'triangle', 0.04, i * 0.05)); break;
        case 'night': this.tone(110, 1.6, 'sine', 0.06, 0, 0.8); break;
        case 'death': [330, 262, 196, 131].forEach((f, i) => this.tone(f, 0.5, 'triangle', 0.05, i * 0.2)); break;
        case 'victory': [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0.4, 'triangle', 0.05, i * 0.13)); break;
        case 'ui': this.tone(900, 0.04, 'square', 0.02); break;
      }
    } catch (e) { /* bỏ qua */ }
  },

  /* Nhạc nền: đàn tranh ngũ cung ngẫu hứng, đổi điệu theo ngày/đêm/bí cảnh */
  musicT: 0,
  music(dt, mood) {
    if (!this.musicOn || !this.ctx || this.ctx.state !== 'running') return;
    this.musicT -= dt;
    if (this.musicT > 0) return;
    const scales = {
      day: [293.7, 329.6, 392, 440, 523.3, 587.3, 659.3],
      night: [196, 220, 261.6, 293.7, 329.6, 392],
      dungeon: [146.8, 174.6, 196, 220, 261.6, 293.7],
      boss: [110, 130.8, 146.8, 164.8, 196],
    };
    const sc = scales[mood] || scales.day;
    const n = mood === 'boss' ? 4 : 1 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++) {
      const f = sc[Math.floor(Math.random() * sc.length)];
      const w = i * (mood === 'boss' ? 0.18 : 0.32);
      this.tone(f, mood === 'boss' ? 0.5 : 1.8, 'triangle', 0.05, w, 0, this.musicGain);
      this.tone(f * 2, 0.6, 'sine', 0.012, w, 0, this.musicGain);
    }
    if (mood === 'boss') this.noise(0.25, 0.12, 120, 'lowpass');
    this.musicT = mood === 'boss' ? 0.9 : 2 + Math.random() * 3.5;
  },
};

/* ===== js/game.js ===== */
'use strict';
/* Lõi game: vật lý, nhân vật, yêu thú, chiến đấu, sinh tồn, bí cảnh, lưu trữ */

const GRAV = 1500, MAX_FALL = 720, RUN = 165, JUMP_V = 480, DJUMP_V = 430, DASH_V = 470;

const Phys = {
  move(e, lv, dt, noclip) {
    const sp = Math.max(Math.abs(e.vx), Math.abs(e.vy)) * dt;
    const steps = Math.max(1, Math.ceil(sp / 7));
    const sdt = dt / steps;
    const wasGround = e.onGround;
    e.onGround = false;
    e.hitWall = 0;
    e.hitCeil = false;
    for (let i = 0; i < steps; i++) {
      const nx = e.x + e.vx * sdt;
      if (!noclip && lv.boxSolid(nx, e.y, e.w, e.h)) {
        if (e.canStep && wasGround && e.vy >= 0 && !lv.boxSolid(nx, e.y - TILE, e.w, e.h) && !lv.boxSolid(e.x, e.y - TILE, e.w, e.h)) {
          e.y -= TILE;
          e.x = nx;
          e.stepOffset = (e.stepOffset || 0) + TILE;
        } else {
          if (e.vx > 0) e.x = Math.floor((nx + e.w) / TILE) * TILE - e.w - 0.01;
          else if (e.vx < 0) e.x = Math.floor(nx / TILE) * TILE + TILE + 0.01;
          e.hitWall = Math.sign(e.vx);
          e.vx = 0;
        }
      } else e.x = nx;
      const ny = e.y + e.vy * sdt;
      if (!noclip && lv.boxSolid(e.x, ny, e.w, e.h)) {
        if (e.vy > 0) { e.y = Math.floor((ny + e.h) / TILE) * TILE - e.h - 0.01; e.onGround = true; }
        else { e.y = Math.floor(ny / TILE) * TILE + TILE + 0.01; e.hitCeil = true; }
        e.vy = 0;
      } else e.y = ny;
    }
    if (!noclip && !e.onGround && e.vy >= 0 && lv.boxSolid(e.x, e.y + 1, e.w, e.h)) e.onGround = true;
    e.x = M.clamp(e.x, 0, lv.w - e.w);
    if (e.y > lv.h + 200) e.y = lv.h + 200;
    e.onIce = e.onGround && lv.get(Math.floor((e.x + e.w / 2) / TILE), Math.floor((e.y + e.h + 2) / TILE)) === T_ICE;
  },
};

class Player {
  constructor(x, groundY) {
    this.w = 12; this.h = 28;
    this.x = x - this.w / 2; this.y = groundY - this.h - 0.01;
    this.vx = 0; this.vy = 0; this.face = 1;
    this.onGround = false; this.canStep = true; this.stepOffset = 0;
    this.hp = 100; this.mp = 40; this.hunger = 100; this.tuvi = 0; this.realm = 0;
    this.coyote = 0; this.jumpBuf = 0; this.airJumps = 0;
    this.dashT = 0; this.dashCd = 0; this.invT = 0;
    this.atkT = 0; this.atkElapsed = 0; this.combo = 0; this.comboT = 0; this.hits = new Set(); this.harvested = false; this.queued = false; this.waved = false;
    this.castCd = 0; this.med = null; this.anim = 0; this.lastSafe = { x: this.x, y: this.y };
    this.flying = false; this.hurtT = 0; this.spawn = null;
  }
  get cx() { return this.x + this.w / 2; }
  get cy() { return this.y + this.h / 2; }
  get bottom() { return this.y + this.h; }
}

class Mob {
  constructor(type, x, groundY, o = {}) {
    const def = DATA.monsters[type] || DATA.bosses[type];
    this.type = type; this.def = def; this.boss = !!DATA.bosses[type];
    const sc = o.elite ? 1.25 : 1;
    this.w = Math.round(def.w * sc); this.h = Math.round(def.h * sc);
    this.x = x - this.w / 2; this.y = groundY - this.h - 0.01;
    this.vx = 0; this.vy = 0; this.face = -1; this.onGround = false;
    this.ai = this.boss ? 'boss' : def.ai;
    this.fly = this.boss ? !!def.fly : ['flyer', 'diver', 'ghost'].includes(def.ai) || !!def.fly;
    this.canStep = !this.fly;
    this.maxHp = this.hp = Math.round(def.hp * (o.hpMult || 1) * (o.elite ? 2 : 1));
    this.dmg = def.dmg * (o.dmgMult || 1) * (o.elite ? 1.3 : 1);
    this.elite = !!o.elite;
    this.state = 'idle'; this.t = 0; this.cd = Math.random() * 1.5;
    this.flash = 0; this.stun = 0; this.burn = 0; this.burnDps = 0; this.slow = 0; this.touchCd = 0;
    this.anim = Math.random() * 10; this.alive = true; this.aggro = !def.neutral; this.homeX = x;
    this.phase = 1; this.pattern = 0; this.windup = 0; this.sleep = !!o.sleep;
  }
  get cx() { return this.x + this.w / 2; }
  get cy() { return this.y + this.h / 2; }
  get bottom() { return this.y + this.h; }
}

const hook = (name, ...a) => { if (typeof UI !== 'undefined' && UI[name]) return UI[name](...a); };
const sfx = (name, v) => { if (typeof Sfx !== 'undefined') Sfx.play(name, v); };

const Game = {
  mode: 'title',
  paused: false,

  /* ======================= Khởi tạo ======================= */
  newGame(seed) {
    this.seed = (seed || (Date.now() % 1e9)) >>> 0;
    this.rng = new RNG(this.seed ^ 0x9e3779b9);
    this.world = new Overworld(this.seed);
    this.inv = new Inventory();
    this.structures = [];
    this.bags = [];
    this.time = 0.04;
    this.day = 1;
    this.cleared = {};
    this.placed = [];
    this.won = false;
    this.goal = 0;
    this.stats = { kills: 0, deaths: 0, crafted: 0, eaten: 0, harvested: 0, dungeonsEntered: 0, bossKills: 0, playTime: 0, nights: 0 };
    this.player = new Player(this.world.spawnX - 40, this.world.groundY(this.world.spawnX - 40));
    this.player.spawn = { x: this.world.spawnX - 40, y: this.world.groundY(this.world.spawnX - 40) };
    this.enterOverworld(null);
    this.mode = 'play';
    this.paused = false;
    hook('onStart', true);
  },

  /* Thế giới minh họa phía sau màn hình tiêu đề */
  setupDemo() {
    if (!this.demo) this.demo = new Overworld(20251119);
    this.world = this.demo;
    this.seed = this.demo.seed;
    this.inv = new Inventory();
    this.structures = [{ type: 'lua_trai', x: this.demo.spawnX + 70, y: this.demo.groundY(this.demo.spawnX + 70), fuel: 1e9 }];
    this.bags = []; this.placed = []; this.cleared = {}; this.won = false;
    this.day = 1; this.time = 0.52;
    this.stats = { kills: 0, deaths: 0, crafted: 0, eaten: 0, harvested: 0, dungeonsEntered: 0, bossKills: 0, playTime: 0, nights: 0 };
    this.player = new Player(this.demo.spawnX, this.demo.groundY(this.demo.spawnX));
    this.player.med = { t: 0 };
    this.enterOverworld(null);
    this.cam.x = this.demo.spawnX - 500;
  },
  demoTick(dt) {
    this.time = (this.time + dt / 900) % 1;
    this.cam.x += dt * 22;
    if (this.cam.x > this.world.w - 1200) this.cam.x = 300;
    this.cam.y = this.world.groundY(this.cam.x + 480) - (typeof Renderer !== 'undefined' ? Renderer.vh : 540) * 0.62;
    this.updateParticles(dt);
  },

  resetTransient() {
    this.mobs = []; this.projs = []; this.drops = []; this.zones = []; this.parts = []; this.texts = [];
    this.hitStop = 0; this.spawnT = 0; this.boss = null; this.trib = null; this.prompt = null; this.interactTarget = null;
    this.cam = this.cam || { x: 0, y: 0, shake: 0 };
  },

  enterOverworld(at) {
    this.resetTransient();
    this.level = this.world;
    this.dungeon = null;
    this.inDungeon = null;
    const p = this.player;
    if (at) { p.x = at.x - p.w / 2; p.y = this.topY(at.x) - p.h - 0.01; }
    p.vx = 0; p.vy = 0;
    this.snapCamera();
  },

  /* ======================= Trạng thái ======================= */
  hours() { return (this.time * 24 + 5) % 24; },
  isNight() { const h = this.hours(); return h >= 19.5 || h < 5; },
  bloodMoon() { return this.isNight() && this.day % 4 === 0; },
  realmDef(r) { return DATA.realms[r == null ? this.player.realm : r]; },
  unlocked(key) { const u = DATA.unlocks.find((x) => x.key === key); return !!u && this.player.realm >= u.realm; },
  armorDef() { return this.inv.armor ? DATA.items[this.inv.armor] : null; },
  maxHp() { return this.realmDef().hp; },
  maxMp() { const a = this.armorDef(); return this.realmDef().mp + (a && a.mp ? a.mp : 0); },
  defense() { const a = this.armorDef(); return a ? a.def : 0; },
  heldDef() { return this.inv.selectedDef(); },
  weaponDmg() { const d = this.heldDef(); return d && d.dmg ? d.dmg : 3; },
  lightRadius() { const d = this.heldDef(); return d && d.light ? d.light : 0; },
  hasStructure(type) { return this.structures.some((s) => s.type === type); },
  topY(x) { return this.level.topSolid(M.clamp(Math.floor(x / TILE), 0, this.level.cols - 1)) * TILE; },
  diffMult() {
    const d = Math.min(this.day - 1, 15);
    let hp = 1 + 0.12 * d, dmg = 1 + 0.06 * d;
    if (this.bloodMoon()) { hp *= 1.25; dmg *= 1.25; }
    const b = this.world.biomeAtX(this.player.cx).id;
    const z = b === 'loi_phong' ? 1.8 : b === 'han_dam' ? 1.5 : b === 'xich_thach' ? 1.3 : 1;
    return { hp: hp * z, dmg: dmg * z };
  },

  /* ======================= Vòng cập nhật ======================= */
  update(dt) {
    if (this.mode !== 'play' || this.paused) { this.updateParticles(dt * 0.5); return; }
    this.stats.playTime += dt;
    if (this.hitStop > 0) { this.hitStop -= dt; this.updateParticles(dt); return; }
    const wasNight = this.isNight();
    this.time += dt / DATA.DAY_SEC;
    if (this.time >= 1) { this.time -= 1; this.newDay(); }
    if (!wasNight && this.isNight()) {
      this.stats.nights++;
      hook('banner', this.bloodMoon() ? 'Huyết Nguyệt xuất hiện!' : 'Màn đêm buông xuống', this.bloodMoon() ? 'Yêu ma cuồng bạo, hãy cố thủ bên lửa trại' : 'Yêu ma bắt đầu xuất hiện', this.bloodMoon() ? 'blood' : 'night');
      sfx('night');
    }
    if (wasNight && !this.isNight()) hook('banner', 'Bình minh', 'Ngày ' + this.day, 'day');
    this.updatePlayer(dt);
    for (const m of this.mobs) this.updateMob(m, dt);
    this.mobs = this.mobs.filter((m) => m.alive || m.dying > 0);
    this.updateProjectiles(dt);
    this.updateZones(dt);
    this.updateDrops(dt);
    this.updateParticles(dt);
    this.updateSurvival(dt);
    if (this.level === this.world) { this.updateStructures(dt); this.spawner(dt); }
    else this.updateDungeon(dt);
    if (this.trib) this.updateTrib(dt);
    this.findInteract();
    this.updateCamera(dt);
    this.goalT = (this.goalT || 0) - dt;
    if (this.goalT <= 0) { this.goalT = 0.5; this.checkGoals(); }
    this.saveT = (this.saveT || 0) + dt;
    if (this.saveT > 30 && this.level === this.world) { this.saveT = 0; this.save(); }
  },

  newDay() {
    this.day++;
    for (const r of this.world.resources) if (!r.alive && r.regrowDay <= this.day) { r.alive = true; r.hp = DATA.resources[r.type].hp; }
  },

  /* ======================= Người chơi ======================= */
  updatePlayer(dt) {
    const p = this.player, I = Input;
    p.invT -= dt; p.dashCd -= dt; p.castCd -= dt; p.comboT -= dt; p.hurtT -= dt;
    p.stepOffset = M.approach(p.stepOffset, 0, 150 * dt);
    const move = (I.down('right') ? 1 : 0) - (I.down('left') ? 1 : 0);
    if (p.med) {
      if (move || I.pressed('jump') || I.pressed('attack') || I.pressed('dash')) this.stopMeditate();
      else this.meditateTick(dt);
    }
    if (p.dashT > 0) {
      p.dashT -= dt;
      p.vx = p.face * DASH_V;
      p.vy = 0;
      if (Math.random() < 0.6) this.particle(p.cx, p.cy, -p.face * 40, 0, 0.3, 'ghost', '#e9e2cf', 10);
    } else {
      const target = p.med ? 0 : move * RUN;
      const acc = p.onGround ? (p.onIce ? 380 : 1700) : 1100;
      p.vx = M.approach(p.vx, target, acc * dt);
      if (move && !p.med) p.face = move;
    }
    if (p.onGround) { p.coyote = 0.1; p.airJumps = this.unlocked('doubleJump') ? 1 : 0; } else p.coyote -= dt;
    if (I.pressed('jump')) p.jumpBuf = 0.13; else p.jumpBuf -= dt;
    if (p.jumpBuf > 0 && !p.med && p.dashT <= 0) {
      if (p.coyote > 0) {
        p.vy = -JUMP_V; p.coyote = 0; p.jumpBuf = 0;
        sfx('jump');
        for (let i = 0; i < 5; i++) this.particle(p.cx, p.bottom, M.lerp(-60, 60, Math.random()), -20, 0.35, 'dust', '#cfc6ad', 3);
      } else if (p.airJumps > 0) {
        p.vy = -DJUMP_V; p.airJumps--; p.jumpBuf = 0;
        sfx('jump2');
        this.particle(p.cx, p.bottom, 0, 0, 0.35, 'ring', DATA.realmColor(p.realm), 16);
      }
    }
    if (I.released('jump') && p.vy < -170) p.vy = -170;
    p.flying = false;
    if (this.unlocked('flight') && !p.onGround && I.down('jump') && p.airJumps === 0 && p.vy > -60 && p.mp > 1) {
      p.vy = Math.max(p.vy - 2400 * dt, -170);
      p.mp -= 12 * dt;
      p.flying = true;
    }
    if (p.dashT <= 0) p.vy = Math.min(MAX_FALL, p.vy + GRAV * dt);
    if (I.pressed('dash') && this.unlocked('dash') && p.dashCd <= 0 && p.mp >= 6 && !p.med) {
      p.dashT = 0.18; p.dashCd = 0.7; p.mp -= 6; p.invT = Math.max(p.invT, 0.24);
      sfx('dash');
    }
    Phys.move(p, this.level, dt);
    if (this.level.kind === 'dungeon') {
      if (this.level.boxHazard(p.x, p.y, p.w, p.h) || p.y > this.level.h) this.hazardHit();
      else if (p.onGround && !this.nearHazard(p)) p.lastSafe = { x: p.x, y: p.y };
    }
    if (I.pressed('attack') && !p.med) this.startAttack();
    this.updateAttack(dt);
    if (I.pressed('skill') && !p.med) this.castFireball();
    if (I.pressed('use')) this.useSelected();
    if (I.pressed('interact')) this.interact();
    if (I.pressed('meditate')) { if (p.med) this.stopMeditate(); else this.startMeditate(null); }
    for (let i = 0; i < 8; i++) if (I.pressed('slot' + (i + 1))) this.inv.sel = i;
    if (I.pressed('next')) this.inv.sel = (this.inv.sel + 1) % 8;
    if (I.pressed('prev')) this.inv.sel = (this.inv.sel + 7) % 8;
    p.anim += dt * (Math.abs(p.vx) > 10 ? Math.abs(p.vx) / 28 : 1.2);
  },

  nearHazard(p) {
    const c = Math.floor(p.cx / TILE), r = Math.floor(p.bottom / TILE);
    for (let dc = -1; dc <= 1; dc++) for (let dr = 0; dr <= 4; dr++) if (this.level.hazard(c + dc, r + dr)) return true;
    return false;
  },

  hazardHit() {
    const p = this.player;
    const dmg = Math.round(this.maxHp() * 0.15);
    this.text(p.cx, p.y - 6, '-' + dmg, '#ff7a6a');
    p.hp -= dmg;
    sfx('hurt');
    this.shake(6);
    const col = this.dungeon.def.pal.hazard;
    for (let i = 0; i < 14; i++) this.particle(p.cx, p.bottom, M.lerp(-120, 120, Math.random()), -Math.random() * 260, 0.6, 'spark', col, 4);
    if (p.hp <= 0) { this.die(); return; }
    p.x = p.lastSafe.x; p.y = p.lastSafe.y - 2; p.vx = 0; p.vy = 0; p.invT = 1;
  },

  hurtPlayer(dmg, dir, src) {
    const p = this.player;
    if (p.invT > 0 || this.mode !== 'play') return;
    const real = Math.max(1, Math.round(dmg * 100 / (100 + this.defense())));
    p.hp -= real;
    p.invT = 0.8; p.hurtT = 0.25;
    p.vx = (dir || -p.face) * 230; p.vy = -260; p.dashT = 0;
    if (p.med) this.stopMeditate();
    this.text(p.cx, p.y - 6, '-' + real, '#ff7a6a');
    this.shake(5);
    sfx('hurt');
    for (let i = 0; i < 8; i++) this.particle(p.cx, p.cy, M.lerp(-150, 150, Math.random()), M.lerp(-200, 40, Math.random()), 0.5, 'ink', '#a8261c', 3);
    if (p.hp <= 0) this.die(src);
  },

  /* ---------- Tấn công ---------- */
  startAttack() {
    const p = this.player;
    if (p.atkT > 0) { if (p.atkElapsed > 0.14) p.queued = true; return; }
    p.combo = p.comboT > 0 ? (p.combo % 3) + 1 : 1;
    p.atkT = p.combo === 3 ? 0.36 : 0.3;
    p.atkElapsed = 0; p.hits.clear(); p.harvested = false; p.waved = false; p.comboT = 0.6;
    sfx('swing');
  },
  attackBox() {
    const p = this.player, w = 38;
    return { x: p.face > 0 ? p.cx - 2 : p.cx - w + 2, y: p.y - 6, w, h: p.h + 10 };
  },
  updateAttack(dt) {
    const p = this.player;
    if (p.atkT <= 0) { if (p.queued) { p.queued = false; this.startAttack(); } return; }
    p.atkElapsed += dt; p.atkT -= dt;
    if (p.atkElapsed < 0.05 || p.atkElapsed > 0.17) return;
    const box = this.attackBox();
    const held = this.heldDef();
    const base = this.weaponDmg() * this.realmDef().dmg * (p.combo === 3 ? 1.5 : 1);
    let hitAny = false;
    for (const m of this.mobs) {
      if (!m.alive || p.hits.has(m) || !M.overlap(box, m)) continue;
      p.hits.add(m);
      hitAny = true;
      const crit = Math.random() < 0.08;
      this.damageMob(m, base * (crit ? 1.8 : 1) * M.lerp(0.9, 1.1, Math.random()), p.face, { knock: p.combo === 3 ? 1.6 : 1, el: held && held.el, crit, melee: true });
    }
    if (!hitAny && !p.harvested) {
      p.harvested = this.harvestAt(box) || this.hitWallAt(box);
    }
    if (p.combo === 3 && !p.waved && this.unlocked('swordWave') && p.atkElapsed > 0.08) {
      p.waved = true;
      this.projs.push({ x: p.cx + p.face * 14, y: p.cy - 2, vx: p.face * 520, vy: 0, r: 10, dmg: base * 0.6, owner: 'player', kind: 'wave', life: 0.5, pierce: true, hit: new Set() });
      sfx('wave');
    }
  },
  castFireball() {
    const p = this.player;
    if (!this.unlocked('fireball')) { hook('toast', 'Đạt Luyện Khí Tầng 2 để lĩnh ngộ Hỏa Cầu Thuật', 'info'); return; }
    if (p.castCd > 0) return;
    if (p.mp < 10) { hook('toast', 'Không đủ linh lực', 'bad'); return; }
    p.mp -= 10; p.castCd = 0.45;
    const dmg = 14 * this.realmDef().dmg * (1 + p.realm * 0.04);
    const angles = this.unlocked('fireFan') ? [-0.16, 0, 0.16] : [0];
    /* tự ngắm yêu ma gần nhất phía trước (trong góc ±60°) */
    let base = p.face > 0 ? 0 : Math.PI, best = 1e9;
    for (const m of this.mobs) {
      if (!m.alive || m.ai === 'passive') continue;
      const dx = m.cx - p.cx, dy = m.cy - (p.cy - 4), d = Math.hypot(dx, dy);
      if (d > 460 || Math.sign(dx) !== p.face) continue;
      const a = Math.atan2(dy, dx);
      if (Math.abs(Math.atan2(Math.sin(a - base), Math.cos(a - base))) > 1.05) continue;
      if (d < best) { best = d; this._aim = a; }
    }
    if (best < 1e9) base = this._aim;
    for (const a of angles) {
      this.projs.push({ x: p.cx + p.face * 10, y: p.cy - 4, vx: Math.cos(base + a) * 400, vy: Math.sin(base + a) * 400, r: 6, dmg, owner: 'player', kind: 'fireball', life: 1.4, hit: new Set() });
    }
    sfx('fire');
  },

  damageMob(m, dmg, dir, o = {}) {
    if (!m.alive) return;
    if (m.def.armor) dmg *= 1 - m.def.armor;
    dmg = Math.max(1, Math.round(dmg));
    m.hp -= dmg;
    m.flash = 0.12;
    m.aggro = true;
    if (!m.boss) {
      m.vx = dir * 170 * (o.knock || 1);
      if (!m.fly) m.vy = Math.min(m.vy, -130);
      m.stun = 0.16;
    }
    if (o.el === 'hoa') { m.burn = 3; m.burnDps = dmg * 0.15; }
    if (o.el === 'thuy') m.slow = 2;
    if (o.el === 'moc') this.player.hp = Math.min(this.maxHp(), this.player.hp + 1);
    if (o.el === 'loi' && Math.random() < 0.2) this.zones.push({ x: m.cx - 16, y: m.y - 260, w: 32, h: 260 + m.h, delay: 0.05, dur: 0.25, dmg: dmg * 0.8, kind: 'bolt', owner: 'player', t: 0, hit: new Set() });
    this.text(m.cx, m.y - 4, (o.crit ? '✦' : '') + dmg, o.crit ? '#ffd27a' : '#f4ead2', o.crit);
    for (let i = 0; i < 6; i++) this.particle(m.cx, m.cy, dir * M.lerp(40, 220, Math.random()), M.lerp(-180, 40, Math.random()), 0.45, 'ink', '#15120f', 3);
    if (o.melee) this.hitStop = Math.max(this.hitStop, o.crit ? 0.07 : 0.035);
    sfx(o.crit ? 'crit' : 'hit');
    if (m.hp <= 0) this.killMob(m);
  },

  killMob(m) {
    m.alive = false;
    m.dying = 0.5;
    this.stats.kills++;
    const def = m.def;
    for (let i = 0; i < 16; i++) this.particle(m.cx, m.cy, M.lerp(-220, 220, Math.random()), M.lerp(-260, 60, Math.random()), 0.8, 'ink', i % 3 ? '#15120f' : '#7a1f17', 4);
    const tv = (def.tuvi || 0) * (m.elite ? 2 : 1);
    if (tv) this.gainTuvi(tv);
    if (m.boss) return this.bossDefeated(m);
    for (const [id, a, b, ch] of def.drops || []) if (Math.random() < ch * (m.elite ? 1.5 : 1)) this.spawnDrop(id, a + Math.floor(Math.random() * (b - a + 1)), m.cx, m.cy);
    if (this.dungeon && Math.random() < (m.elite ? 0.12 : 0.03)) this.spawnDrop(this.dungeon.def.core, 1, m.cx, m.cy);
    sfx('kill');
  },

  /* ---------- Khai thác ---------- */
  harvestAt(box) {
    if (this.level !== this.world) return false;
    for (const r of this.world.resources) {
      if (!r.alive) continue;
      const R = DATA.resources[r.type];
      const rb = { x: r.x - R.w / 2, y: r.y - R.h * (R.tool === 'axe' ? 0.5 : 1), w: R.w, h: R.h * (R.tool === 'axe' ? 0.5 : 1) };
      if (!M.overlap(box, rb)) continue;
      const held = this.heldDef() || {};
      let power = 1;
      if (R.tool === 'axe') power = held.axe || 1;
      else if (R.tool === 'pick') {
        const tier = held.pickTier || 0;
        if (tier < (R.tier || 0)) {
          hook('toast', R.name + ' cần ' + (R.tier >= 2 ? 'cuốc sắt' : 'cuốc đá') + ' trở lên', 'bad');
          r.shake = 0.2;
          sfx('clink');
          return true;
        }
        power = held.pick || 1;
      }
      r.hp -= power;
      r.shake = 0.25;
      sfx(R.tool === 'pick' ? 'mine' : R.tool === 'axe' ? 'chop' : 'pluck');
      const col = R.tool === 'pick' ? '#bdb6a5' : R.tool === 'axe' ? '#8a6a44' : '#7fb08a';
      for (let i = 0; i < 5; i++) this.particle(r.x, r.y - 14, M.lerp(-120, 120, Math.random()), M.lerp(-220, -40, Math.random()), 0.5, 'chip', col, 3);
      if (r.hp <= 0) {
        r.alive = false;
        r.regrowDay = this.day + R.regrow;
        this.stats.harvested++;
        for (const [id, a, b, ch] of R.drops) if (Math.random() < ch) this.spawnDrop(id, a + Math.floor(Math.random() * (b - a + 1)), r.x, r.y - 20);
        if (R.tool === 'axe') sfx('fall');
      }
      return true;
    }
    return false;
  },
  hitWallAt(box) {
    const lv = this.level;
    const c0 = Math.floor(box.x / TILE), c1 = Math.floor((box.x + box.w) / TILE);
    const r0 = Math.floor(box.y / TILE), r1 = Math.floor((box.y + box.h) / TILE);
    for (let c = c0; c <= c1; c++) for (let r = r0; r <= r1; r++) {
      const t = lv.get(c, r);
      if (t !== T_WOOD && t !== T_STONE) continue;
      this.damageWall(c, r, 20, true);
      return true;
    }
    return false;
  },
  damageWall(c, r, dmg, byPlayer) {
    const lv = this.level, key = c * 1000 + r;
    const t = lv.get(c, r);
    const hp = (lv.wallHp.has(key) ? lv.wallHp.get(key) : DATA.walls[t].hp) - dmg;
    sfx('chop');
    for (let i = 0; i < 4; i++) this.particle(c * TILE + 8, r * TILE + 8, M.lerp(-100, 100, Math.random()), -Math.random() * 150, 0.5, 'chip', t === T_WOOD ? '#8a6a44' : '#9a958a', 3);
    if (hp > 0) { lv.wallHp.set(key, hp); return; }
    lv.wallHp.delete(key);
    lv.set(c, r, T_AIR);
    if (byPlayer && Math.random() < 0.5) this.spawnDrop(t === T_WOOD ? 'tuong_go' : 'tuong_da', 1, c * TILE + 8, r * TILE);
  },

  /* ---------- Vật phẩm rơi ---------- */
  spawnDrop(id, n, x, y) {
    if (!n || !DATA.items[id]) return;
    this.drops.push({ id, n, x: x - 5, y: y - 5, w: 10, h: 10, vx: M.lerp(-90, 90, Math.random()), vy: -200 - Math.random() * 120, t: 0, onGround: false });
  },
  updateDrops(dt) {
    const p = this.player;
    for (const d of this.drops) {
      d.t += dt;
      const dx = p.cx - (d.x + 5), dy = p.cy - (d.y + 5), dist = Math.hypot(dx, dy);
      if (d.t > 0.35 && dist < 70) {
        d.vx = dx / dist * 260; d.vy = dy / dist * 260;
        d.x += d.vx * dt; d.y += d.vy * dt;
      } else {
        d.vy = Math.min(MAX_FALL, d.vy + GRAV * dt);
        if (d.onGround) d.vx *= 0.85;
        Phys.move(d, this.level, dt);
      }
      if (d.t > 0.3 && dist < 14) {
        const left = this.inv.add(d.id, d.n);
        const got = d.n - left;
        if (got > 0) { hook('pickup', d.id, got); sfx('pickup'); }
        d.n = left;
        if (left > 0 && !d.fullWarned) { d.fullWarned = true; hook('toast', 'Túi đồ đã đầy', 'bad'); }
      }
    }
    this.drops = this.drops.filter((d) => d.n > 0 && d.t < 600);
  },

  /* ======================= Yêu thú ======================= */
  updateMob(m, dt) {
    if (!m.alive) { m.dying -= dt; return; }
    const p = this.player;
    const dx = p.cx - m.cx, dy = p.cy - m.cy, dist = Math.hypot(dx, dy);
    if (m.sleep) { if (dist < 620) m.sleep = false; else return; }
    m.anim += dt;
    m.flash -= dt; m.touchCd -= dt; m.cd -= dt; m.slow -= dt;
    if (m.burn > 0) { m.burn -= dt; m.burnT = (m.burnT || 0) - dt; if (m.burnT <= 0) { m.burnT = 0.5; this.damageMob(m, m.burnDps * 0.5, 0, {}); if (!m.alive) return; this.particle(m.cx, m.y, 0, -60, 0.5, 'ember', '#ff8a3c', 3); } }
    if (m.def.sunburn && this.level === this.world && !this.isNight()) {
      m.sunT = (m.sunT || 0) - dt;
      if (m.sunT <= 0) { m.sunT = 0.5; this.damageMob(m, m.maxHp * 0.12, 0, {}); if (!m.alive) return; this.particle(m.cx, m.y, 0, -80, 0.6, 'smoke', '#e9e2cf', 6); }
    }
    const spd = (m.def.speed || 60) * (m.slow > 0 ? 0.5 : 1);
    if (m.stun > 0) {
      m.stun -= dt;
      if (!m.fly) m.vy = Math.min(MAX_FALL, m.vy + GRAV * dt); else { m.vx *= 0.9; m.vy *= 0.9; }
      Phys.move(m, this.level, dt, m.ai === 'ghost');
      return;
    }
    const face = Math.sign(dx) || 1;
    switch (m.ai) {
      case 'boss': this.bossAI(m, dt, dx, dy, dist); break;
      case 'passive':
        if (dist < 150 || m.flash > -1.5) { m.vx = M.approach(m.vx, -face * spd * 1.2, 900 * dt); m.face = -face; }
        else this.wander(m, dt, spd * 0.4);
        if (m.hitWall && m.onGround) m.vy = -330;
        break;
      case 'walker':
        if (m.aggro && dist < 460) {
          m.face = face;
          const stop = this.ledgeAhead(m) && dy < 20;
          m.vx = M.approach(m.vx, stop ? 0 : face * spd, 900 * dt);
          if (m.hitWall && m.onGround) { if (!this.attackWallAhead(m, dt)) m.vy = -390; }
        } else this.wander(m, dt, spd * 0.35);
        break;
      case 'charger':
        if (!m.aggro) { this.wander(m, dt, spd * 0.4); break; }
        if (m.state === 'idle' || m.state === 'walk') {
          m.face = face;
          m.vx = M.approach(m.vx, face * spd * 0.6, 600 * dt);
          if (dist < 300 && Math.abs(dy) < 60 && m.cd <= 0) { m.state = 'wind'; m.t = 0.55; m.vx = 0; }
          if (m.hitWall && m.onGround) m.vy = -380;
        } else if (m.state === 'wind') {
          m.vx = 0; m.t -= dt; m.windup = 1;
          if (m.t <= 0) { m.state = 'charge'; m.t = 0.85; m.windup = 0; sfx('charge'); }
        } else if (m.state === 'charge') {
          m.vx = m.face * spd * 3.4; m.t -= dt;
          if (m.t <= 0 || m.hitWall || (this.ledgeAhead(m) && this.level.kind === 'dungeon')) { m.state = 'idle'; m.cd = 1.2; m.vx = 0; }
        }
        break;
      case 'hopper':
        if (m.aggro && dist < 520) {
          m.face = face;
