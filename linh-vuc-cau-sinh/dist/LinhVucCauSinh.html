          if (m.onGround) { m.vx *= 0.8; if (m.cd <= 0 && !(this.ledgeAhead(m) && dy < 20)) { m.vy = -360; m.vx = face * spd * 1.3; m.cd = 0.85; } }
          if (m.hitWall && m.onGround) this.attackWallAhead(m, dt);
        } else this.wander(m, dt, spd * 0.2);
        break;
      case 'flyer': {
        const tx = p.cx + Math.sin(m.anim * 2) * 50, ty = p.cy - 34 + Math.cos(m.anim * 3) * 16;
        if (dist < 520) { m.vx = M.approach(m.vx, M.clamp((tx - m.cx) * 2, -spd, spd), 500 * dt); m.vy = M.approach(m.vy, M.clamp((ty - m.cy) * 2, -spd, spd), 500 * dt); }
        else { m.vx *= 0.95; m.vy = Math.sin(m.anim * 2) * 20; }
        m.face = face;
        break;
      }
      case 'diver':
        if (m.state === 'dive') {
          m.t -= dt;
          if (m.t <= 0 || m.onGround || m.hitWall) { m.state = 'rise'; m.t = 0.8; }
        } else if (m.state === 'rise') {
          m.vy = -spd * 0.8; m.vx *= 0.97; m.t -= dt;
          if (m.t <= 0) { m.state = 'hover'; m.cd = 1 + Math.random(); }
        } else {
          const tx = p.cx, ty = p.cy - 150;
          m.vx = M.approach(m.vx, M.clamp((tx - m.cx) * 2, -spd, spd), 400 * dt);
          m.vy = M.approach(m.vy, M.clamp((ty - m.cy) * 2, -spd * 0.7, spd * 0.7), 400 * dt);
          m.face = face;
          if (dist < 420 && Math.abs(dx) < 60 && m.cd <= 0) { m.state = 'dive'; m.t = 0.7; m.vx = face * spd * 0.5; m.vy = spd * 2.6; sfx('screech'); }
        }
        break;
      case 'ghost':
        if (dist < 600) {
          m.vx = M.approach(m.vx, M.clamp(dx, -spd, spd), 200 * dt);
          m.vy = M.approach(m.vy, M.clamp(dy - 6 + Math.sin(m.anim * 2.5) * 30, -spd, spd), 200 * dt);
        } else { m.vx *= 0.97; m.vy *= 0.97; }
        m.face = face;
        break;
      case 'shooter':
      case 'turret': {
        m.face = face;
        if (m.ai === 'shooter') {
          let want = 0;
          if (dist < 170) want = -face; else if (dist > 330) want = face;
          if (m.fly) {
            m.vx = M.approach(m.vx, want * spd, 400 * dt);
            m.vy = M.approach(m.vy, M.clamp((p.cy - 70 - m.cy) * 2, -spd, spd), 400 * dt);
          } else {
            if (want && this.ledgeAhead(m)) want = 0;
            m.vx = M.approach(m.vx, want * spd, 600 * dt);
          }
        }
        if (dist < 480 && m.cd <= 0 && m.windup <= 0) { m.windup = 0.4; }
        if (m.windup > 0) {
          m.windup -= dt;
          if (m.windup <= 0) {
            m.cd = m.ai === 'turret' ? 2.4 : 1.9 + Math.random() * 0.6;
            this.enemyShot(m, m.ai === 'turret' ? [-0.25, 0, 0.25] : [0]);
          }
        }
        break;
      }
    }
    if (!m.fly && m.ai !== 'boss') m.vy = Math.min(MAX_FALL, m.vy + GRAV * dt);
    if (m.ai === 'boss' && !m.fly) m.vy = Math.min(MAX_FALL, m.vy + GRAV * dt);
    Phys.move(m, this.level, dt, m.ai === 'ghost');
    if (this.level.kind === 'dungeon' && !m.fly && this.level.boxHazard(m.x, m.y, m.w, m.h)) { m.alive = false; m.dying = 0.3; return; }
    if (this.level === this.world && !m.boss && Math.abs(dx) > 1700) { m.alive = false; m.dying = 0; return; }
    if (m.ai !== 'passive' && m.aggro && m.touchCd <= 0 && M.overlap(m, p)) {
      m.touchCd = 0.9;
      this.hurtPlayer(m.dmg * (m.state === 'charge' || m.state === 'dive' ? 1.4 : 1), Math.sign(p.cx - m.cx) || 1, m);
    }
  },

  wander(m, dt, spd) {
    m.t -= dt;
    if (m.t <= 0) { m.t = 1.5 + Math.random() * 2.5; m.wdir = Math.random() < 0.4 ? 0 : Math.random() < 0.5 ? -1 : 1; if (Math.abs(m.cx - m.homeX) > 200) m.wdir = Math.sign(m.homeX - m.cx); }
    let want = (m.wdir || 0) * spd;
    if (want && this.ledgeAhead(m)) { want = 0; m.wdir = -m.wdir; }
    if (m.fly) { m.vx = M.approach(m.vx, want, 200 * dt); m.vy = Math.sin(m.anim * 1.7) * 25; }
    else m.vx = M.approach(m.vx, want, 500 * dt);
    if (want) m.face = Math.sign(want);
    if (m.hitWall && m.onGround && !m.fly) m.vy = -340;
  },

  ledgeAhead(m) {
    if (!m.onGround || m.fly) return false;
    const c = Math.floor((m.face > 0 ? m.x + m.w + 4 : m.x - 4) / TILE);
    const r = Math.floor((m.bottom + 2) / TILE);
    for (let i = 0; i < 4; i++) {
      if (this.level.hazard(c, r + i)) return true;
      if (this.level.solid(c, r + i)) return false;
    }
    return true;
  },

  attackWallAhead(m, dt) {
    const c = Math.floor((m.face > 0 ? m.x + m.w + 2 : m.x - 2) / TILE);
    for (let r = Math.floor(m.y / TILE); r <= Math.floor((m.bottom - 1) / TILE); r++) {
      const t = this.level.get(c, r);
      if (t === T_WOOD || t === T_STONE) {
        m.wallT = (m.wallT || 0) - dt;
        if (m.wallT <= 0) { m.wallT = 1; this.damageWall(c, r, m.dmg, false); }
        return true;
      }
    }
    return false;
  },

  enemyShot(m, angles) {
    const p = this.player;
    const kind = m.def.shot || 'fire';
    const ang = Math.atan2(p.cy - m.cy, p.cx - m.cx);
    const speed = kind === 'bolt' ? 360 : kind === 'seed' ? 260 : 240;
    for (const a of angles) {
      const pr = { x: m.cx, y: m.cy - 4, vx: Math.cos(ang + a) * speed, vy: Math.sin(ang + a) * speed, r: 6, dmg: m.dmg, owner: 'enemy', kind, life: 3 };
      if (kind === 'seed') { pr.grav = 600; pr.vy -= 140; }
      this.projs.push(pr);
    }
    sfx('shoot');
  },

  /* ---------- Thủ lĩnh ---------- */
  bossAI(m, dt, dx, dy, dist) {
    const p = this.player, A = this.dungeon.arena;
    const look = m.def.look;
    if (m.phase === 1 && m.hp < m.maxHp * 0.5) {
      m.phase = 2;
      hook('banner', m.def.name + ' nổi giận!', 'Giai đoạn hai', 'blood');
      sfx('roar');
      const add = { treeKing: 'doc_phong', dragon: 'hoa_linh', phoenix: 'thuy_quy', thunderGolem: 'loi_dieu' }[look];
      for (let i = 0; i < 2; i++) this.mobs.push(new Mob(add, A.x0 + 120 + i * (A.x1 - A.x0 - 240), A.y - 120, { hpMult: 1 }));
    }
    const fast = m.phase === 2 ? 0.72 : 1;
    const face = Math.sign(dx) || 1;
    if (look === 'treeKing' || look === 'thunderGolem') {
      if (m.state === 'charge') {
        m.vx = m.face * 380; m.t -= dt;
        if (m.t <= 0 || m.hitWall) { m.state = 'idle'; m.vx = 0; m.cd = 1.2 * fast; }
        return;
      }
      if (m.state === 'wind') { m.vx = 0; m.t -= dt; if (m.t <= 0) { m.state = 'charge'; m.t = 0.8; sfx('charge'); } return; }
      m.face = face;
      m.vx = M.approach(m.vx, Math.abs(dx) > 70 ? face * (look === 'treeKing' ? 40 : 55) : 0, 300 * dt);
      if (m.cd > 0) return;
      const pats = look === 'treeKing' ? ['roots', 'seeds', 'slam'] : ['strikes', 'shock', 'charge'];
      const pat = pats[m.pattern++ % pats.length];
      m.cd = 2.4 * fast;
      if (pat === 'roots') {
        const xs = [p.cx - 70, p.cx, p.cx + 70];
        for (const x of xs) this.zones.push({ x: x - 18, y: A.y - 56, w: 36, h: 56, delay: 0.85 * fast + 0.15, dur: 0.4, dmg: m.dmg, kind: 'root', owner: 'enemy', t: 0 });
        sfx('rumble');
      } else if (pat === 'seeds') {
        for (let i = 0; i < 5; i++) {
          const vx = (p.cx - m.cx) / 1.1 + (i - 2) * 50;
          this.projs.push({ x: m.cx, y: m.y + 20, vx, vy: -420 - i * 20, grav: 700, r: 7, dmg: m.dmg * 0.8, owner: 'enemy', kind: 'seed', life: 3 });
        }
        sfx('shoot');
      } else if (pat === 'slam' || pat === 'shock') {
        for (const s of [-1, 1]) this.projs.push({ x: m.cx, y: A.y - 12, vx: s * 300, vy: 0, r: 10, dmg: m.dmg * 0.9, owner: 'enemy', kind: look === 'thunderGolem' ? 'shock' : 'quake', life: 2.2, ground: true });
        this.shake(10); sfx('slam');
      } else if (pat === 'strikes') {
        const n = m.phase === 2 ? 6 : 4;
        for (let i = 0; i < n; i++) {
          const x = i === 0 ? p.cx : M.lerp(A.x0 + 40, A.x1 - 40, Math.random());
          this.zones.push({ x: x - 22, y: 0, w: 44, h: A.y, delay: 1.0 * fast + i * 0.12, dur: 0.3, dmg: m.dmg, kind: 'bolt', owner: 'enemy', t: 0 });
        }
        sfx('thunder');
      } else if (pat === 'charge') {
        m.state = 'wind'; m.t = 0.6; m.face = face;
      }
      return;
    }
    /* Thủ lĩnh bay: Xích Viêm Long, Băng Phượng */
    if (m.state === 'swoop') {
      m.t -= dt;
      m.vx = m.swoopDir * 520; m.vy = (m.swoopY - m.cy) * 4;
      if (m.t <= 0 || m.cx < A.x0 + 40 || m.cx > A.x1 - 40) { m.state = 'idle'; m.cd = 1.4 * fast; }
      return;
    }
    if (m.state === 'dive') {
      m.t -= dt;
      if (m.t <= 0 || m.bottom > A.y - 6) { m.state = 'rise'; m.t = 1; }
      return;
    }
    if (m.state === 'rise') { m.vy = -220; m.vx *= 0.96; m.t -= dt; if (m.t <= 0 || m.cy < A.y - 170) { m.state = 'idle'; } return; }
    if (m.state === 'tele') {
      m.t -= dt; m.vx *= 0.9; m.vy *= 0.9;
      if (m.t <= 0) {
        if (m.next === 'dive') { m.state = 'dive'; m.t = 0.9; const ang = Math.atan2(m.tgtY - m.cy, m.tgtX - m.cx); m.vx = Math.cos(ang) * 560; m.vy = Math.sin(ang) * 560; sfx('screech'); }
        else { m.state = 'swoop'; m.t = 1.6; sfx('screech'); }
      }
      return;
    }
    const hx = M.clamp(p.cx + Math.sin(m.anim * 0.8) * 160, A.x0 + 60, A.x1 - 60), hy = A.y - 140 + Math.sin(m.anim * 1.6) * 24;
    m.vx = M.approach(m.vx, M.clamp((hx - m.cx) * 1.6, -220, 220), 500 * dt);
    m.vy = M.approach(m.vy, M.clamp((hy - m.cy) * 1.6, -200, 200), 500 * dt);
    m.face = face;
    if (m.cd > 0) return;
    const pats = look === 'dragon' ? ['breath', 'dive', 'embers'] : ['fan', 'swoop', 'frost'];
    const pat = pats[m.pattern++ % pats.length];
    m.cd = 2.6 * fast;
    if (pat === 'breath') {
      const base = Math.atan2(p.cy - m.cy, p.cx - m.cx);
      for (let i = 0; i < 9; i++) this.projs.push({ x: m.cx, y: m.cy, vx: Math.cos(base + (i - 4) * 0.09) * (240 + i * 8), vy: Math.sin(base + (i - 4) * 0.09) * (240 + i * 8), r: 7, dmg: m.dmg * 0.7, owner: 'enemy', kind: 'fire', life: 2.5, delay: i * 0.06 });
      sfx('fire');
    } else if (pat === 'embers') {
      for (let i = 0; i < 8; i++) this.projs.push({ x: M.lerp(A.x0 + 30, A.x1 - 30, Math.random()), y: A.y - 330, vx: 0, vy: 60, grav: 300, r: 8, dmg: m.dmg * 0.7, owner: 'enemy', kind: 'fire', life: 4, delay: i * 0.25 });
    } else if (pat === 'fan') {
      for (let i = 0; i < 12; i++) { const a = (i / 12) * Math.PI * 2; this.projs.push({ x: m.cx, y: m.cy, vx: Math.cos(a) * 230, vy: Math.sin(a) * 230, r: 6, dmg: m.dmg * 0.7, owner: 'enemy', kind: 'ice', life: 3 }); }
      sfx('ice');
    } else if (pat === 'frost') {
      for (const s of [-1, 1]) this.projs.push({ x: m.cx, y: A.y - 12, vx: s * 280, vy: 0, r: 10, dmg: m.dmg * 0.8, owner: 'enemy', kind: 'frost', life: 2.6, ground: true });
      sfx('ice');
    } else if (pat === 'dive') {
      m.state = 'tele'; m.t = 0.75; m.next = 'dive'; m.tgtX = p.cx; m.tgtY = A.y - 20;
      this.zones.push({ x: p.cx - 40, y: A.y - 10, w: 80, h: 10, delay: 0.75, dur: 0.01, dmg: 0, kind: 'mark', owner: 'enemy', t: 0 });
    } else if (pat === 'swoop') {
      m.swoopDir = p.cx > (A.x0 + A.x1) / 2 ? -1 : 1;
      m.x = (m.swoopDir > 0 ? A.x0 + 50 : A.x1 - 50) - m.w / 2;
      m.swoopY = p.cy;
      m.state = 'tele'; m.t = 0.8; m.next = 'swoop';
      this.zones.push({ x: A.x0, y: p.cy - 12, w: A.x1 - A.x0, h: 24, delay: 0.8, dur: 0.01, dmg: 0, kind: 'line', owner: 'enemy', t: 0 });
    }
  },

  /* ======================= Đạn & vùng nguy hiểm ======================= */
  updateProjectiles(dt) {
    const p = this.player;
    for (const pr of this.projs) {
      if (pr.delay > 0) { pr.delay -= dt; continue; }
      pr.life -= dt;
      if (pr.grav) pr.vy += pr.grav * dt;
      pr.x += pr.vx * dt; pr.y += pr.vy * dt;
      if (pr.ground) pr.y = this.groundUnder(pr.x, pr.y) - 12;
      if (Math.random() < 0.5) this.particle(pr.x, pr.y, -pr.vx * 0.1, -pr.vy * 0.1, 0.35, pr.kind === 'ice' || pr.kind === 'frost' ? 'spark' : 'ember', this.projColor(pr.kind), 3);
      const c = Math.floor(pr.x / TILE), r = Math.floor(pr.y / TILE);
      if (!pr.ground && this.level.solid(c, r)) { pr.life = 0; this.burst(pr.x, pr.y, this.projColor(pr.kind), 6); continue; }
      if (pr.ground && (this.level.solid(Math.floor((pr.x + Math.sign(pr.vx) * 8) / TILE), Math.floor((pr.y) / TILE)))) { pr.life = 0; continue; }
      if (pr.owner === 'player') {
        for (const m of this.mobs) {
          if (!m.alive || (pr.hit && pr.hit.has(m))) continue;
          if (Math.abs(m.cx - pr.x) < m.w / 2 + pr.r && Math.abs(m.cy - pr.y) < m.h / 2 + pr.r) {
            pr.hit.add(m);
            this.damageMob(m, pr.dmg, Math.sign(pr.vx) || 1, { knock: 0.6, el: pr.kind === 'fireball' ? 'hoa' : null });
            if (!pr.pierce) { pr.life = 0; this.burst(pr.x, pr.y, this.projColor(pr.kind), 8); break; }
          }
        }
      } else if (Math.abs(p.cx - pr.x) < p.w / 2 + pr.r && Math.abs(p.cy - pr.y) < p.h / 2 + pr.r) {
        this.hurtPlayer(pr.dmg, Math.sign(pr.vx) || 1);
        if (pr.kind === 'ice' || pr.kind === 'frost') p.vx *= 0.3;
        if (!pr.ground) pr.life = 0;
      }
    }
    this.projs = this.projs.filter((pr) => pr.life > 0);
  },
  groundUnder(x, y) {
    const c = Math.floor(x / TILE);
    for (let r = Math.floor(y / TILE); r < this.level.rows; r++) if (this.level.solid(c, r)) return r * TILE;
    return this.level.h;
  },
  projColor(k) { return { fireball: '#ffb347', wave: '#e9f6ff', seed: '#9be36b', fire: '#ff7a2f', ice: '#bfeaff', bolt: '#e1d6ff', frost: '#bfeaff', quake: '#8a6a44', shock: '#c7b8ff' }[k] || '#fff'; },

  updateZones(dt) {
    const p = this.player;
    for (const z of this.zones) {
      z.t += dt;
      if (z.t < z.delay) continue;
      if (!z.fired) {
        z.fired = true;
        if (z.kind === 'bolt') { sfx('thunder'); this.shake(6); this.flash = 0.12; }
        if (z.kind === 'root') sfx('slam');
      }
      if (z.owner === 'enemy' && z.dmg > 0 && !z.hitDone && M.overlap(z, p)) { z.hitDone = true; this.hurtPlayer(z.dmg, Math.sign(p.cx - (z.x + z.w / 2)) || 1); }
      if (z.owner === 'player') for (const m of this.mobs) if (m.alive && !z.hit.has(m) && M.overlap(z, m)) { z.hit.add(m); this.damageMob(m, z.dmg, 0, {}); }
    }
    this.zones = this.zones.filter((z) => z.t < z.delay + z.dur);
  },

  /* ======================= Hạt hiệu ứng ======================= */
  particle(x, y, vx, vy, life, kind, color, size) {
    if (this.parts.length > 700) return;
    this.parts.push({ x, y, vx, vy, life, max: life, kind, color, size });
  },
  burst(x, y, color, n) { for (let i = 0; i < n; i++) this.particle(x, y, M.lerp(-160, 160, Math.random()), M.lerp(-160, 160, Math.random()), 0.4, 'spark', color, 3); },
  text(x, y, s, color, big) { this.texts.push({ x, y, s, color, t: 0, big }); },
  shake(n) { this.cam.shake = Math.max(this.cam.shake, n); },
  updateParticles(dt) {
    for (const q of this.parts) {
      q.life -= dt;
      q.x += q.vx * dt; q.y += q.vy * dt;
      if (q.kind === 'ink' || q.kind === 'chip' || q.kind === 'dust') q.vy += 700 * dt;
      if (q.kind === 'ember' || q.kind === 'smoke') q.vy -= 30 * dt;
      q.vx *= 0.98;
    }
    this.parts = this.parts.filter((q) => q.life > 0);
    for (const t of this.texts) { t.t += dt; t.y -= 40 * dt; }
    this.texts = this.texts.filter((t) => t.t < 0.9);
    if (this.flash > 0) this.flash -= dt;
  },

  /* ======================= Sinh tồn ======================= */
  updateSurvival(dt) {
    const p = this.player;
    const drain = DATA.HUNGER_PER_SEC * (p.med ? 1.6 : 1) * (p.dashT > 0 ? 3 : 1);
    p.hunger = Math.max(0, p.hunger - drain * dt);
    if (p.hunger <= 0) {
      this.starveT = (this.starveT || 0) - dt;
      if (this.starveT <= 0) { this.starveT = 1; p.hp -= 2; this.text(p.cx, p.y, 'Đói!', '#d98c3a'); if (p.hp <= 0) this.die('starve'); }
    } else if (p.hunger > 40 && p.hurtT < -3) p.hp = Math.min(this.maxHp(), p.hp + (0.6 + p.realm * 0.08) * dt);
    p.mp = Math.min(this.maxMp(), p.mp + (2 + p.realm * 0.2) * (p.med ? 3 : 1) * dt);
    p.hp = Math.min(p.hp, this.maxHp());
  },

  /* ---------- Tu luyện ---------- */
  meditateRate() {
    const p = this.player;
    let rate = 1.2;
    if (this.level === this.world) {
      for (const s of this.structures) {
        const d = DATA.structures[s.type];
        if (Math.abs(s.x - p.cx) > 70) continue;
        if (d.meditate) rate = Math.max(rate, 2.5 * d.meditate);
        if (s.type === 'lua_trai' && s.fuel > 0) rate = Math.max(rate, 2.5);
      }
    }
    return rate * (1 + p.realm * 0.04);
  },
  startMeditate(src) {
    const p = this.player;
    if (!p.onGround) return;
    if (this.mobs.some((m) => m.alive && m.ai !== 'passive' && m.aggro && Math.abs(m.cx - p.cx) < 260)) { hook('toast', 'Có yêu ma gần đây, không thể nhập định', 'bad'); return; }
    p.med = { src, t: 0 };
    p.vx = 0;
    hook('toast', 'Nhập định tu luyện · tốc độ ' + this.meditateRate().toFixed(1) + ' tu vi/giây', 'info');
  },
  stopMeditate() { this.player.med = null; },
  meditateTick(dt) {
    const p = this.player;
    p.med.t += dt;
    this.gainTuvi(this.meditateRate() * dt, true);
    if (Math.random() < dt * 8) {
      const a = Math.random() * Math.PI * 2;
      this.particle(p.cx + Math.cos(a) * 60, p.cy + Math.sin(a) * 40, -Math.cos(a) * 70, -Math.sin(a) * 50, 0.8, 'qi', DATA.realmColor(p.realm), 3);
    }
  },
  gainTuvi(n, quiet) {
    const p = this.player;
    const R = this.realmDef();
    if (R.req === Infinity) return;
    p.tuvi += n;
    if (!quiet && n >= 1) this.text(p.cx, p.y - 16, '+' + Math.floor(n) + ' tu vi', '#e6bf5a');
    while (p.tuvi >= this.realmDef().req) {
      const cur = this.realmDef();
      if (cur.pill) {
        p.tuvi = cur.req;
        if (!this.pillWarned) { this.pillWarned = true; hook('toast', 'Tu vi viên mãn! Cần ' + DATA.items[cur.pill].name + ' để đột phá', 'quest'); }
        break;
      }
      p.tuvi -= cur.req;
      this.realmUp();
    }
  },
  realmUp() {
    const p = this.player;
    p.realm++;
    this.pillWarned = false;
    p.hp = this.maxHp(); p.mp = this.maxMp();
    const R = this.realmDef();
    hook('banner', 'Đột phá: ' + R.name, 'Sinh lực ' + R.hp + ' · Sát thương ×' + R.dmg.toFixed(2), 'realm');
    sfx('realm');
    this.shake(4);
    for (let i = 0; i < 40; i++) { const a = (i / 40) * Math.PI * 2; this.particle(p.cx, p.cy, Math.cos(a) * 220, Math.sin(a) * 220, 0.9, 'qi', DATA.realmColor(p.realm), 4); }
    const u = DATA.unlocks.find((x) => x.realm === p.realm);
    if (u) hook('unlock', u);
  },
  /* Đột phá đại cảnh giới bằng đan dược (có thể kèm lôi kiếp) */
  tryBreakthrough(pillId) {
    const p = this.player, R = this.realmDef();
    if (R.pill !== pillId) { hook('toast', 'Đan dược này dùng ở ' + DATA.realms[DATA.items[pillId].breakthrough].name + ' viên mãn', 'bad'); return false; }
    if (p.tuvi < R.req) { hook('toast', 'Tu vi chưa viên mãn (' + Math.floor(p.tuvi) + '/' + R.req + ')', 'bad'); return false; }
    if (this.trib) return false;
    this.inv.remove(pillId, 1);
    if (!R.trib) { p.tuvi = 0; this.realmUp(); return true; }
    if (this.level !== this.world) { hook('toast', 'Hãy độ kiếp ở bên ngoài bí cảnh', 'bad'); this.inv.add(pillId, 1); return false; }
    this.trib = { n: R.trib, i: 0, t: 1.6, end: 0 };
    hook('banner', 'Lôi Kiếp Giáng Lâm', R.trib + ' đạo thiên lôi — hãy né tránh!', 'blood');
    sfx('thunder');
    return true;
  },
  updateTrib(dt) {
    const tr = this.trib, p = this.player;
    tr.t -= dt;
    if (tr.i < tr.n) {
      if (tr.t <= 0) {
        tr.t = 1.25;
        tr.i++;
        const off = tr.i % 2 ? 0 : M.lerp(-50, 50, Math.random());
        this.zones.push({ x: p.cx + off - 26, y: p.y - 420, w: 52, h: 440 + p.h, delay: 0.85, dur: 0.3, dmg: this.maxHp() * 0.3, kind: 'bolt', owner: 'enemy', t: 0, trib: true });
      }
    } else if (tr.t <= -1.2) {
      this.trib = null;
      p.tuvi = 0;
      this.realmUp();
      hook('toast', 'Vượt qua lôi kiếp!', 'good');
    }
  },

  /* ======================= Công trình ======================= */
  updateStructures(dt) {
    for (const s of this.structures) {
      if (s.type === 'lua_trai' && s.fuel > 0) {
        s.fuel -= dt;
        if (Math.random() < dt * 10) this.particle(s.x + M.lerp(-6, 6, Math.random()), s.y - 12, M.lerp(-10, 10, Math.random()), -50, 0.9, 'ember', '#ffb347', 2);
      }
    }
  },
  placement() {
    const d = this.heldDef();
    if (!d || d.cat !== 'place' || this.level !== this.world) return null;
    const p = this.player;
    if (d.wall) {
      const c = Math.floor((p.cx + p.face * 22) / TILE);
      const top = this.level.topSolid(c, Math.floor(p.y / TILE) - 6);
      const r0 = top - DATA.WALL_H;
      let ok = r0 > 0;
      for (let r = r0; r < top && ok; r++) if (this.level.get(c, r) !== T_AIR) ok = false;
      const box = { x: c * TILE, y: r0 * TILE, w: TILE, h: DATA.WALL_H * TILE };
      if (ok && M.overlap(box, p)) ok = false;
      if (ok && this.mobs.some((m) => m.alive && M.overlap(box, m))) ok = false;
      return { wall: d.wall, c, r0, top, x: box.x, y: box.y, w: box.w, h: box.h, ok };
    }
    const S = DATA.structures[d.place];
    const cx = Math.round((p.cx + p.face * (18 + S.w / 2)) / 8) * 8;
    const c0 = Math.floor((cx - S.w / 2) / TILE), c1 = Math.floor((cx + S.w / 2 - 1) / TILE);
    const top = this.level.topSolid(c0, Math.floor(p.y / TILE) - 4);
    let ok = true;
    for (let c = c0; c <= c1; c++) if (this.level.topSolid(c, Math.floor(p.y / TILE) - 4) !== top) ok = false;
    const y = top * TILE;
    if (this.level.boxSolid(cx - S.w / 2, y - S.h, S.w, S.h - 1)) ok = false;
    for (const s of this.structures) if (Math.abs(s.x - cx) < (DATA.structures[s.type].w + S.w) / 2 + 4) ok = false;
    if (Math.abs(cx - this.world.array.x) < 60) ok = false;
    for (const pt of this.world.portals) if (Math.abs(cx - pt.x) < 50) ok = false;
    return { type: d.place, x: cx, y, w: S.w, h: S.h, ok };
  },
  placeSelected() {
    const pl = this.placement();
    if (!pl) return false;
    if (!pl.ok) { hook('toast', 'Không thể đặt ở đây (cần mặt đất bằng phẳng, trống)', 'bad'); return false; }
    const id = this.inv.selected().id;
    this.inv.remove(id, 1);
    if (pl.wall) {
      for (let r = pl.r0; r < pl.top; r++) this.level.set(pl.c, r, pl.wall);
    } else {
      const S = DATA.structures[pl.type];
      this.structures.push({ type: pl.type, x: pl.x, y: pl.y, fuel: S.fuel ? 240 : 0, id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5) });
    }
    sfx('place');
    for (let i = 0; i < 8; i++) this.particle(pl.x + (pl.wall ? 8 : 0), pl.y, M.lerp(-80, 80, Math.random()), -Math.random() * 90, 0.5, 'dust', '#cfc6ad', 3);
    this.save();
    return true;
  },

  /* ======================= Dùng vật phẩm ======================= */
  useSelected() {
    const s = this.inv.selected();
    if (!s) return;
    const d = DATA.items[s.id];
    const p = this.player;
    if (d.cat === 'place') return this.placeSelected();
    if (d.cat === 'food' || d.cat === 'pill') {
      if (d.breakthrough != null) return this.tryBreakthrough(d.id);
      if (d.tuvi && this.realmDef().req === Infinity) return;
      if (d.hunger && p.hunger > 96 && !d.hp && !d.mp) { hook('toast', 'Đã no', 'info'); return; }
      this.inv.remove(d.id, 1);
      if (d.hunger) p.hunger = Math.min(100, p.hunger + d.hunger);
      if (d.hp) { p.hp = M.clamp(p.hp + d.hp, 1, this.maxHp()); if (d.hp < 0) this.text(p.cx, p.y, 'Đau bụng', '#d98c3a'); }
      if (d.mp) p.mp = Math.min(this.maxMp(), p.mp + d.mp);
      if (d.tuvi) this.gainTuvi(d.tuvi);
      if (d.cat === 'food') this.stats.eaten++;
      sfx(d.cat === 'food' ? 'eat' : 'pill');
      this.text(p.cx, p.y - 10, d.icon, '#fff');
      return;
    }
    if (d.cat === 'armor') {
      this.inv.remove(d.id, 1);
      if (this.inv.armor) this.inv.add(this.inv.armor, 1);
      this.inv.armor = d.id;
      hook('toast', 'Đã mặc ' + d.name, 'good');
      sfx('equip');
      return;
    }
    if (d.cat === 'key') return this.interact();
    hook('toast', d.cat === 'weapon' || d.cat === 'tool' ? 'Nhấn J / chuột trái để dùng ' + d.name : d.name + ': ' + d.desc, 'info');
  },

  /* ======================= Tương tác ======================= */
  findInteract() {
    const p = this.player;
    let best = null, bd = 1e9;
    const consider = (o, x, y, range, label) => {
      const d = Math.abs(x - p.cx) + Math.abs(y - p.bottom) * 0.5;
      if (d < range && d < bd) { bd = d; best = { o, label }; }
    };
    if (this.level === this.world) {
      for (const pt of this.world.portals) {
        const D = DATA.dungeons[pt.id];
        consider({ kind: 'portal', id: pt.id }, pt.x, pt.y, 44, (this.player.realm >= D.req ? 'Vào ' : '🔒 ') + D.name + (this.cleared[pt.id] ? ' (đã chinh phục)' : '') + (this.player.realm >= D.req ? '' : ' — cần ' + DATA.realms[D.req].name));
      }
      const A = this.world.array;
      consider({ kind: 'array' }, A.x, A.y, 60, 'Truyền Tống Trận (' + this.placed.length + '/4 mảnh Thiên Bia)');
      for (const s of this.structures) {
        const S = DATA.structures[s.type];
        let label = S.name;
        if (s.type === 'lua_trai') label = this.wantsFuel(s) ? 'Thêm củi vào lửa trại (' + Math.ceil(s.fuel / 60) + ' phút)' : s.fuel > 0 ? 'Ngồi thiền bên lửa trại' : 'Lửa trại đã tắt — cần Gỗ làm củi';
        else if (S.station) label = 'Mở ' + S.name;
        else if (S.bed) label = this.isNight() ? 'Ngủ đến sáng' : 'Đặt điểm hồi sinh';
        else if (S.meditate) label = 'Ngồi thiền (' + S.name + ')';
        else continue;
        consider({ kind: 'struct', s }, s.x, s.y, S.w / 2 + 26, label);
      }
      for (const b of this.bags) consider({ kind: 'bag', b }, b.x, b.y, 40, 'Nhặt lại túi đồ đánh rơi');
    } else {
      const D = this.dungeon;
      consider({ kind: 'exit' }, D.entrance.x, D.entrance.y, 44, 'Rời bí cảnh');
      if (D.exitPortal) consider({ kind: 'exit' }, D.exitPortal.x, D.exitPortal.y, 50, 'Trở về Linh Vực');
      for (const ch of D.chests) if (!ch.open) consider({ kind: 'chest', ch }, ch.x, ch.y, 34, 'Mở rương báu');
      for (const sh of D.shrines) if (!sh.lit) consider({ kind: 'shrine', sh }, sh.x, sh.y, 34, 'Thắp Hồn Đăng (điểm hồi sinh)');
    }
    this.interactTarget = best;
    this.prompt = best ? best.label : null;
  },

  interact() {
    const t = this.interactTarget;
    const p = this.player;
    if (!t) {
      const d = this.heldDef();
      if (d && d.cat === 'key') hook('toast', 'Mang mảnh Thiên Bia tới Truyền Tống Trận ở trung tâm Tàn Tích', 'info');
      return;
    }
    const o = t.o;
    switch (o.kind) {
      case 'portal': return this.enterDungeon(o.id);
      case 'exit': return this.exitDungeon();
      case 'array': return this.useArray();
      case 'bag': {
        for (const id in o.b.items) { const left = this.inv.add(id, o.b.items[id]); if (left) this.spawnDrop(id, left, p.cx, p.y); }
        this.bags = this.bags.filter((x) => x !== o.b);
        hook('toast', 'Đã nhặt lại túi đồ', 'good');
        sfx('pickup');
        return;
      }
      case 'chest': return this.openChest(o.ch);
      case 'shrine':
        o.sh.lit = true;
        this.dungeonSpawn = { x: o.sh.x, y: o.sh.y };
        p.hp = Math.min(this.maxHp(), p.hp + this.maxHp() * 0.3);
        hook('toast', 'Hồn Đăng đã thắp — hồi sinh tại đây khi tử vong', 'good');
        sfx('realm');
        return;
      case 'struct': {
        const s = o.s, S = DATA.structures[s.type];
        if (s.type === 'lua_trai' && this.wantsFuel(s)) {
          this.inv.remove('go', 1); s.fuel = Math.min(480, s.fuel + 90);
          sfx('place'); hook('toast', 'Lửa trại cháy thêm 90 giây', 'info');
          return;
        }
        if (s.type === 'lua_trai') { if (s.fuel <= 0) return hook('toast', 'Lửa đã tắt. Cầm Gỗ và nhấn E để nhóm lại', 'bad'); p.spawn = { x: s.x + 30, y: s.y }; return this.startMeditate(s); }
        if (S.station) return hook('openInventory', 'craft');
        if (S.bed) return this.sleep(s);
        if (S.meditate) return this.startMeditate(s);
      }
    }
  },

  /* Cầm gỗ trên tay, hoặc lửa sắp tắt mà trong túi có gỗ → E sẽ thêm củi */
  wantsFuel(s) {
    if (!this.inv.has('go') || s.fuel >= 470) return false;
    const held = this.heldDef();
    return (held && held.id === 'go') || s.fuel < 60;
  },

  sleep(s) {
    const p = this.player;
    p.spawn = { x: s.x, y: s.y };
    if (!this.isNight()) { hook('toast', 'Đã đặt điểm hồi sinh. Chỉ ngủ được vào ban đêm.', 'info'); return; }
    if (this.mobs.some((m) => m.alive && m.ai !== 'passive' && Math.abs(m.cx - p.cx) < 420)) { hook('toast', 'Yêu ma ở gần, không thể ngủ', 'bad'); return; }
    this.newDay();
    this.time = 0.02;
    p.hunger = Math.max(0, p.hunger - 25);
    p.hp = this.maxHp(); p.mp = this.maxMp();
    this.mobs = this.mobs.filter((m) => !m.def.night);
    hook('sleep');
    hook('banner', 'Bình minh', 'Ngày ' + this.day, 'day');
    this.save();
  },

  useArray() {
    for (const id of DATA.dungeonOrder) {
      const frag = DATA.dungeons[id].fragment;
      if (!this.placed.includes(frag) && this.inv.has(frag)) {
        this.inv.remove(frag, 1);
        this.placed.push(frag);
        hook('toast', 'Đặt ' + DATA.items[frag].name + ' vào trận (' + this.placed.length + '/4)', 'quest');
        sfx('realm');
      }
    }
    if (this.placed.length >= 4 && !this.won) {
      this.won = true;
      this.mode = 'victory';
      this.save();
      sfx('victory');
      hook('victory');
      return;
    }
    if (this.placed.length < 4) hook('toast', 'Truyền Tống Trận cần 4 mảnh Thiên Bia. Hiện có ' + this.placed.length + '/4.', 'info');
  },

  /* ======================= Bí cảnh ======================= */
  enterDungeon(id) {
    const D = DATA.dungeons[id];
    const p = this.player;
    if (p.realm < D.req) { hook('toast', D.name + ' cần ' + DATA.realms[D.req].name, 'bad'); return; }
    this.stopMeditate();
    this.save();
    this.resetTransient();
    this.dungeon = new Dungeon(id, (this.seed + this.stats.dungeonsEntered * 7919 + Math.floor(Math.random() * 1e6)) >>> 0);
    this.level = this.dungeon;
    this.inDungeon = id;
    this.stats.dungeonsEntered++;
    this.lives = 3;
    const E = this.dungeon.entrance;
    this.dungeonSpawn = { x: E.x + 30, y: E.y };
    p.x = E.x + 30 - p.w / 2; p.y = E.y - p.h - 0.01; p.vx = 0; p.vy = 0;
    p.lastSafe = { x: p.x, y: p.y };
    const tier = D.tier;
    for (const sp of this.dungeon.spawns) {
      this.mobs.push(new Mob(sp.type, sp.c * TILE + TILE / 2, (sp.r + 1) * TILE, { elite: sp.elite, sleep: true }));
    }
    this.bossSpawned = false;
    this.snapCamera();
    hook('banner', D.name, (this.cleared[id] ? 'Đã chinh phục · ' : '') + 'Bí cảnh ' + ['', 'nhất', 'nhị', 'tam', 'tứ'][tier] + ' giai · 3 Hồn Đăng', 'dungeon');
    sfx('portal');
    hook('onLevelChange');
  },
  exitDungeon() {
    const id = this.inDungeon;
    const pt = this.world.portals.find((x) => x.id === id);
    this.enterOverworld({ x: pt.x + 40 });
    sfx('portal');
    hook('onLevelChange');
    this.save();
  },
  updateDungeon(dt) {
    const D = this.dungeon, p = this.player, A = D.arena;
    if (!this.bossSpawned && p.x > A.x0 + 3 * TILE) {
      this.bossSpawned = true;
      D.setGate(true);
      const def = DATA.dungeons[D.id];
      const b = new Mob(def.boss, D.bossSpawn.x, D.bossSpawn.y - (DATA.bosses[def.boss].fly ? 150 : 0), {});
      b.cd = 2;
      this.mobs.push(b);
      this.boss = b;
      hook('banner', b.def.name, 'Thủ lĩnh ' + def.name, 'blood');
      sfx('roar');
      this.shake(8);
    }
  },
  bossDefeated(m) {
    const D = this.dungeon, def = DATA.dungeons[D.id];
    this.stats.bossKills++;
    D.setGate(false);
    this.boss = null;
    this.mobs.forEach((x) => { if (x !== m && x.alive) { x.alive = false; x.dying = 0.3; } });
    const first = !this.cleared[D.id];
    this.cleared[D.id] = true;
    if (first) this.spawnDrop(def.fragment, 1, m.cx, m.cy);
    this.spawnDrop(def.core, 2, m.cx, m.cy);
    this.spawnDrop('yeu_dan', 3 + def.tier * 2, m.cx, m.cy);
    this.spawnDrop('linh_thach', 2 + def.tier * 3, m.cx, m.cy);
    this.spawnDrop('hoi_khi_dan', 2, m.cx, m.cy);
    D.exitPortal = { x: (D.arena.x0 + D.arena.x1) / 2, y: D.arena.y };
    hook('banner', 'Chinh phục ' + def.name + '!', first ? 'Nhận ' + DATA.items[def.fragment].name : 'Phần thưởng đã rơi ra', 'realm');
    sfx('victory');
    this.shake(12);
  },
  openChest(ch) {
    ch.open = true;
    const tier = this.dungeon.def.tier;
    const r = Math.random;
    this.spawnDrop('hoi_khi_dan', 1 + Math.floor(r() * 2), ch.x, ch.y - 10);
    this.spawnDrop(r() < 0.5 ? 'thoi_sat' : 'linh_thach', 2 + Math.floor(r() * 2 * tier), ch.x, ch.y - 10);
    this.spawnDrop('yeu_dan', 1 + Math.floor(r() * tier), ch.x, ch.y - 10);
    if (r() < 0.3) this.spawnDrop('tu_khi_dan', 1, ch.x, ch.y - 10);
    if (r() < 0.25) this.spawnDrop('hoi_linh_dan', 2, ch.x, ch.y - 10);
    if (r() < 0.1) this.spawnDrop(this.dungeon.def.core, 1, ch.x, ch.y - 10);
    sfx('chest');
    this.burst(ch.x, ch.y - 8, '#ffd27a', 18);
  },

  /* ======================= Sinh quái ngoài trời ======================= */
  spawner(dt) {
    this.spawnT -= dt;
    if (this.spawnT > 0) return;
    this.spawnT = 1.2;
    const p = this.player, night = this.isNight();
    const near = this.mobs.filter((m) => m.alive && Math.abs(m.cx - p.cx) < 1100);
    const hostile = near.filter((m) => m.ai !== 'passive').length;
    const passive = near.length - hostile;
    const b = this.world.biomeAtX(p.cx);
    const vw = typeof Renderer !== 'undefined' ? Renderer.vw : 960;
    const targetH = night ? (this.bloodMoon() ? 8 : 4 + Math.min(3, Math.floor(this.day / 3))) : (b.id === 'loi_phong' || b.id === 'xich_thach' ? 2 : 1);
    let type = null;
    if (hostile < targetH && (night || Math.random() < 0.5)) {
      const list = (night ? b.night : b.day).filter((t) => DATA.monsters[t].ai !== 'passive');
      if (list.length) type = this.rng.pick(list);
    } else if (!night && passive < 2) {
      const list = b.day.filter((t) => DATA.monsters[t].ai === 'passive' || DATA.monsters[t].neutral);
      if (list.length) type = this.rng.pick(list);
    }
    if (!type) return;
    const side = Math.random() < 0.5 ? -1 : 1;
    const x = M.clamp(p.cx + side * (vw / 2 + 60 + Math.random() * 220), 40, this.world.w - 40);
    if (night) for (const s of this.structures) if (s.type === 'lua_trai' && s.fuel > 0 && Math.abs(s.x - x) < 320) return;
    if (Math.abs(x - this.world.array.x) < 200 && !night) return;
    const def = DATA.monsters[type];
    const gy = this.topY(x);
    const dm = this.diffMult();
    const m = new Mob(type, x, gy - (['flyer', 'diver', 'ghost'].includes(def.ai) ? 110 : 0), { hpMult: dm.hp, dmgMult: dm.dmg, elite: night && Math.random() < 0.06 });
    if (this.level.boxSolid(m.x, m.y, m.w, m.h) && m.ai !== 'ghost') return;
    this.mobs.push(m);
  },

  /* ======================= Tử vong ======================= */
  die(cause) {
    const p = this.player;
    if (this.mode !== 'play') return;
    p.hp = 0;
    this.stats.deaths++;
    this.stopMeditate();
    let lost = null, msg = '';
    if (this.trib) { this.trib = null; p.tuvi = Math.floor(p.tuvi * 0.7); msg = 'Độ kiếp thất bại, tu vi tổn hao 30%. '; }
    if (this.level === this.world) {
      lost = this.inv.dropFraction(0.5);
      if (Object.keys(lost).length) this.bags.push({ x: p.cx, y: this.topY(p.cx), items: lost });
      msg += 'Một nửa nguyên liệu và thức ăn rơi lại tại chỗ — hãy quay lại nhặt.';
    } else {
      this.lives--;
      if (this.lives > 0) msg += 'Hồn Đăng còn ' + this.lives + '. Ngươi sẽ hồi sinh tại Hồn Đăng gần nhất.';
      else { lost = this.inv.dropFraction(0.25); msg += 'Hồn Đăng đã tắt — ngươi bị trục xuất khỏi bí cảnh và mất 1/4 nguyên liệu.'; }
    }
    this.mode = 'dead';
    sfx('death');
    hook('dead', { cause, msg, lost });
  },
  respawn() {
    const p = this.player;
    this.mode = 'play';
    p.hp = Math.round(this.maxHp() * 0.6);
    p.mp = this.maxMp();
    p.hunger = Math.max(p.hunger, 40);
    p.invT = 2; p.vx = 0; p.vy = 0; p.dashT = 0; p.atkT = 0;
    if (this.level !== this.world && this.lives > 0) {
      const sp = this.dungeonSpawn;
      p.x = sp.x - p.w / 2; p.y = sp.y - p.h - 0.01;
      if (this.boss) {
        this.boss.hp = this.boss.maxHp; this.boss.state = 'idle'; this.boss.phase = 1;
        this.mobs = this.mobs.filter((m) => m === this.boss || !m.alive || m.cx < this.dungeon.arena.x0);
        this.boss.alive = false; this.boss.dying = 0; this.boss = null;
        this.bossSpawned = false; this.dungeon.setGate(false);
      }
      this.projs = []; this.zones = [];
      this.snapCamera();
      return;
    }
    if (this.level !== this.world) { this.exitDungeon(); return; }
    const sp = p.spawn || { x: this.world.spawnX, y: 0 };
    this.mobs = this.mobs.filter((m) => Math.abs(m.cx - sp.x) > 500);
    p.x = sp.x - p.w / 2; p.y = this.topY(sp.x) - p.h - 0.01;
    this.projs = []; this.zones = [];
    this.snapCamera();
    this.save();
  },

  /* ======================= Mục tiêu ======================= */
  checkGoals() {
    let guard = 0;
    while (this.goal < DATA.goals.length && DATA.goals[this.goal].check(this) && guard++ < 20) {
      const g = DATA.goals[this.goal];
      this.goal++;
      if (this.goal < DATA.goals.length) hook('toast', '✔ ' + g.text.split(' (')[0], 'quest');
    }
  },

  /* ======================= Máy quay ======================= */
  snapCamera() {
    const vw = typeof Renderer !== 'undefined' ? Renderer.vw : 960, vh = typeof Renderer !== 'undefined' ? Renderer.vh : 540;
    this.cam.x = this.player.cx - vw / 2;
    this.cam.y = this.player.cy - vh * (this.level === this.world ? 0.66 : 0.58);
    this.clampCamera(vw, vh);
  },
  updateCamera(dt) {
    const vw = typeof Renderer !== 'undefined' ? Renderer.vw : 960, vh = typeof Renderer !== 'undefined' ? Renderer.vh : 540;
    const p = this.player;
    let tx = p.cx - vw / 2 + p.face * 50, ty = p.cy - vh * (this.level === this.world ? 0.66 : 0.58);
    if (this.boss && this.boss.alive) {
      const A = this.dungeon.arena;
      tx = M.clamp((p.cx + this.boss.cx) / 2 - vw / 2, A.x0 - 80, A.x1 - vw + 40);
      if (Math.abs(p.cx - this.boss.cx) > vw * 0.8) tx = p.cx - vw / 2 + Math.sign(this.boss.cx - p.cx) * vw * 0.3;
    }
    this.cam.x = M.lerp(this.cam.x, tx, Math.min(1, dt * 4));
    this.cam.y = M.lerp(this.cam.y, ty, Math.min(1, dt * 5));
    this.clampCamera(vw, vh);
    this.cam.shake = Math.max(0, this.cam.shake - dt * 30);
  },
  clampCamera(vw, vh) {
    this.cam.x = M.clamp(this.cam.x, 0, Math.max(0, this.level.w - vw));
    this.cam.y = M.clamp(this.cam.y, this.level === this.world ? -200 : 0, Math.max(0, this.level.h - vh));
  },

  /* ======================= Lưu trữ ======================= */
  KEY: 'linhvuc_caosinh_save_v1',
  serialize() {
    const p = this.player;
    const atPortal = this.level !== this.world ? this.world.portals.find((x) => x.id === this.inDungeon) : null;
    const walls = [];
    const W = this.world;
    for (let i = 0; i < W.tiles.length; i++) {
      const t = W.tiles[i];
      if (t === T_WOOD || t === T_STONE) walls.push([i, t, W.wallHp.get((i % W.cols) * 1000 + Math.floor(i / W.cols)) || 0]);
    }
    return JSON.stringify({
      v: 1, seed: this.seed, day: this.day, time: this.time, goal: this.goal,
      player: { x: atPortal ? atPortal.x + 40 : p.cx, hp: p.hp, mp: p.mp, hunger: p.hunger, tuvi: p.tuvi, realm: p.realm, spawn: p.spawn, face: p.face },
      inv: this.inv.toJSON(), structures: this.structures, bags: this.bags, walls,
      res: W.resources.filter((r) => !r.alive || r.hp < DATA.resources[r.type].hp).map((r) => [r.id, r.alive ? 1 : 0, r.hp, r.regrowDay]),
      cleared: this.cleared, placed: this.placed, won: this.won, stats: this.stats,
    });
  },
  save() {
    if (this.mode === 'title' || !this.world) return false;
    try { localStorage.setItem(this.KEY, this.serialize()); return true; } catch (e) { return false; }
  },
  hasSave() { try { return !!localStorage.getItem(this.KEY); } catch (e) { return false; } },
  load(str) {
    try { str = str || localStorage.getItem(this.KEY); } catch (e) { return false; }
    if (!str) return false;
    let s;
    try { s = JSON.parse(str); } catch (e) { return false; }
    if (!s || !s.seed) return false;
    this.seed = s.seed >>> 0;
    this.rng = new RNG(this.seed ^ 0x9e3779b9);
    this.world = new Overworld(this.seed);
    const W = this.world;
    for (const [i, t, hp] of s.walls || []) { W.tiles[i] = t; if (hp) W.wallHp.set((i % W.cols) * 1000 + Math.floor(i / W.cols), hp); }
    const byId = new Map(W.resources.map((r) => [r.id, r]));
    for (const [id, alive, hp, rd] of s.res || []) { const r = byId.get(id); if (r) { r.alive = !!alive; r.hp = hp; r.regrowDay = rd; } }
    this.inv = Inventory.from(s.inv);
    this.structures = (s.structures || []).filter((x) => DATA.structures[x.type]);
    this.bags = s.bags || [];
    this.day = s.day || 1; this.time = s.time || 0.04; this.goal = s.goal || 0;
    this.cleared = s.cleared || {}; this.placed = s.placed || []; this.won = !!s.won;
    this.stats = Object.assign({ kills: 0, deaths: 0, crafted: 0, eaten: 0, harvested: 0, dungeonsEntered: 0, bossKills: 0, playTime: 0, nights: 0 }, s.stats || {});
    const sp = s.player || {};
    this.player = new Player(sp.x || W.spawnX, W.groundY(sp.x || W.spawnX));
    const p = this.player;
    Object.assign(p, { hp: sp.hp || 100, mp: sp.mp || 40, hunger: sp.hunger == null ? 100 : sp.hunger, tuvi: sp.tuvi || 0, realm: sp.realm || 0, spawn: sp.spawn || null, face: sp.face || 1 });
    this.enterOverworld({ x: sp.x || W.spawnX });
    p.hp = Math.max(1, Math.min(p.hp, this.maxHp()));
    this.mode = 'play';
    this.paused = false;
    hook('onStart', false);
    return true;
  },
  wipe() { try { localStorage.removeItem(this.KEY); } catch (e) { /* bỏ qua */ } },
};

/* ===== js/sprites.js ===== */
'use strict';
/* Hình vẽ thủ tục: nhân vật, yêu thú, tài nguyên, công trình — phong cách bóng mực thủy mặc */

const INK = '#15130f';
const PAPER = '#efe7d2';

const Spr = {
  /* Tiện ích vẽ */
  circle(c, x, y, r, fill) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fillStyle = fill; c.fill(); },
  ellipse(c, x, y, rx, ry, fill, rot = 0) { c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); c.fillStyle = fill; c.fill(); },
  poly(c, pts, fill, stroke, lw) {
    c.beginPath();
    c.moveTo(pts[0], pts[1]);
    for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]);
    c.closePath();
    if (fill) { c.fillStyle = fill; c.fill(); }
    if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw || 1; c.stroke(); }
  },
  line(c, x1, y1, x2, y2, col, w) { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round'; c.stroke(); },
  glow(c, x, y, r, col, a = 0.5) {
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, M.rgba(col, a)); g.addColorStop(1, M.rgba(col, 0));
    c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
  },

  /* ======================= Nhân vật ======================= */
  scarf: null,
  player(c, p, G, t) {
    const x = p.cx, by = p.bottom + (p.stepOffset || 0);
    const blink = p.invT > 0 && Math.floor(t * 20) % 2 === 0;
    if (blink) c.globalAlpha = 0.45;
    const body = p.hurtT > 0 ? '#7a1f17' : INK;
    const rc = DATA.realmColor(p.realm);
    const run = p.onGround && Math.abs(p.vx) > 20;
    const sw = run ? Math.sin(p.anim * 1.1) : 0;
    const air = !p.onGround;
    c.save();
    c.translate(x, by);
    if (p.flying) {
      Spr.line(c, -16, 2, 18, 0, '#d9e6f0', 3);
      Spr.glow(c, 0, 0, 24, '#bfe4ff', 0.4);
    }
    if (p.med) {
      /* tư thế tọa thiền */
      Spr.glow(c, 0, -12, 34 + Math.sin(t * 3) * 4, rc, 0.35);
      Spr.ellipse(c, 0, -3, 11, 4, body);
      Spr.poly(c, [-7, -4, 7, -4, 5, -17, -5, -17], body);
      Spr.circle(c, 0, -21, 4.5, body);
      Spr.circle(c, 0, -27, 2.2, body);
      Spr.circle(c, 0, -10, 2.2, rc);
      c.restore();
      c.globalAlpha = 1;
      return;
    }
    c.scale(p.face, 1);
    /* khăn choàng (màu theo cảnh giới) */
    const wind = -Math.max(30, Math.abs(p.vx)) / 60;
    c.beginPath();
    c.moveTo(-1, -21);
    for (let i = 1; i <= 5; i++) {
      const k = i / 5;
      c.lineTo(wind * 14 * k * 1.6 - 2 * k, -21 + k * 4 + Math.sin(t * 9 - i * 0.9) * 2.4 * k);
    }
    c.strokeStyle = rc; c.lineWidth = 2.4; c.lineCap = 'round'; c.stroke();
    /* chân */
    if (air) {
      Spr.line(c, -2, -10, -5, -3, body, 3.4);
      Spr.line(c, 2, -10, 4, -2, body, 3.4);
    } else {
      Spr.line(c, -1, -10, -1 + sw * 5, 0, body, 3.4);
      Spr.line(c, 1, -10, 1 - sw * 5, 0, body, 3.4);
    }
    /* đạo bào */
    const flare = run ? 2 + Math.abs(sw) * 2 : air ? 4 : 1;
    Spr.poly(c, [-4, -22, 4, -22, 6 + flare * 0.4, -8, -6 - flare, -7], body);
    Spr.line(c, -3.5, -14, 4.5, -14, rc, 1.6);
    /* đầu & tóc */
    Spr.circle(c, 0.5, -25.5, 4.4, body);
    Spr.circle(c, -1.5, -30.5, 2.2, body);
    c.beginPath(); c.moveTo(-3, -27); c.quadraticCurveTo(-8 + wind * 3, -22, -7 + wind * 4, -16); c.strokeStyle = body; c.lineWidth = 1.8; c.stroke();
    Spr.circle(c, 2.6, -26, 0.9, PAPER);
    /* vũ khí & đòn chém */
    Spr.held(c, p, G, t, body);
    c.restore();
    c.globalAlpha = 1;
  },

  held(c, p, G, t, body) {
    const d = G.heldDef();
    const atk = p.atkT > 0;
    const prog = atk ? M.clamp(p.atkElapsed / 0.18, 0, 1) : 0;
    let ang;
    if (atk) ang = p.combo === 2 ? M.lerp(1.2, -1.6, prog) : M.lerp(-1.9, 1.1, prog);
    else ang = 0.9 + Math.sin(t * 2) * 0.05;
    const sx = 2, sy = -17;
    c.save();
    c.translate(sx, sy);
    Spr.line(c, 0, 0, Math.cos(ang) * 6, Math.sin(ang) * 6, body, 2.6);
    c.translate(Math.cos(ang) * 6, Math.sin(ang) * 6);
    c.rotate(ang);
    if (d && (d.cat === 'weapon')) {
      const col = { moc: '#9be36b', hoa: '#ff9a4c', thuy: '#bfeaff', loi: '#d9ccff' }[d.el] || (d.tier >= 1 ? '#d8dde2' : '#b48a5a');
      Spr.line(c, -2, 0, 20, 0, col, 2.2);
      Spr.line(c, 0, -3, 0, 3, '#c9a24f', 2);
      if (d.el) Spr.glow(c, 12, 0, 12, col, 0.35);
    } else if (d && d.cat === 'tool') {
      Spr.line(c, -2, 0, 14, 0, '#7a5a3a', 2);
      if (d.axe) Spr.poly(c, [11, -1, 16, -5, 17, 2, 12, 2], d.tier ? '#b8bec4' : '#8f8a80');
      else Spr.poly(c, [14, -6, 16, -6, 15, 6, 13, 6], d.tier ? '#b8bec4' : '#8f8a80');
    } else if (d && d.cat === 'light') {
      Spr.line(c, -2, 0, 10, 0, '#6a4a2a', 2.4);
      c.rotate(-ang);
      const f = 1 + Math.sin(t * 20) * 0.15;
      Spr.glow(c, 10, -4, 16 * f, '#ffb347', 0.6);
      Spr.ellipse(c, 10, -5, 2.6, 4.5 * f, '#ffd27a');
    } else if (d) {
      c.rotate(-ang);
      c.font = '10px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
      c.textAlign = 'center';
      c.fillText(d.icon, 3, 4);
    }
    c.restore();
    if (atk && prog > 0.05 && prog < 1) {
      /* vệt chém mực trắng */
      const a0 = p.combo === 2 ? 1.2 : -1.9, a1 = M.lerp(a0, p.combo === 2 ? -1.6 : 1.1, prog);
      c.save();
      c.translate(sx, sy);
      c.beginPath();
      c.arc(0, 0, p.combo === 3 ? 30 : 24, Math.min(a0, a1), Math.max(a0, a1));
      c.strokeStyle = p.combo === 3 ? 'rgba(255,236,190,0.75)' : 'rgba(244,236,214,0.6)';
      c.lineWidth = p.combo === 3 ? 7 : 5;
      c.lineCap = 'round';
      c.stroke();
      c.restore();
    }
  },

  /* ======================= Yêu thú ======================= */
  mob(c, m, t) {
    const def = m.def;
    const flash = m.flash > 0;
    const col = flash ? '#f4ead2' : M.mixColor(def.color, INK, m.boss ? 0.45 : 0.55);
    const acc = def.color;
    const a = m.anim;
    c.save();
    if (!m.alive) { c.globalAlpha = Math.max(0, m.dying / 0.5); }
    c.translate(m.cx, m.bottom);
    if (m.elite) Spr.glow(c, 0, -m.h / 2, Math.max(m.w, m.h), '#ffcf6b', 0.25);
    if (m.windup > 0 || m.state === 'wind' || m.state === 'tele') Spr.glow(c, 0, -m.h / 2, Math.max(m.w, m.h) * 0.9, '#ff3b2f', 0.35 + Math.sin(t * 30) * 0.15);
    c.scale(m.face >= 0 ? 1 : -1, 1);
    if (m.elite) c.scale(1, 1);
    const fn = Spr.looks[def.look] || Spr.looks.blob;
    fn(c, m, col, acc, a, t);
    c.restore();
    if (!m.boss && m.alive && m.hp < m.maxHp) {
      const w = Math.max(20, m.w);
      c.fillStyle = 'rgba(0,0,0,0.55)'; c.fillRect(m.cx - w / 2, m.y - 8, w, 3);
      c.fillStyle = m.elite ? '#ffcf6b' : '#c8402f'; c.fillRect(m.cx - w / 2, m.y - 8, w * Math.max(0, m.hp / m.maxHp), 3);
    }
  },
  eye(c, x, y, col = '#ff4b3a', r = 1.5) { Spr.glow(c, x, y, r * 4, col, 0.6); Spr.circle(c, x, y, r, col); },

  looks: {
    blob(c, m, col) { Spr.ellipse(c, 0, -m.h / 2, m.w / 2, m.h / 2, col); },
    rabbit(c, m, col, acc, a) {
      const hop = m.onGround ? 0 : -2;
      Spr.ellipse(c, -1, -6 + hop, 8, 6, col);
      Spr.circle(c, 6, -10 + hop, 4, col);
      Spr.ellipse(c, 6, -17 + hop, 1.6, 5, col, 0.2);
      Spr.ellipse(c, 4, -17 + hop, 1.6, 5, col, -0.2);
      Spr.circle(c, -8, -7 + hop, 2.4, '#efe7d2');
      Spr.circle(c, 7.5, -10.5 + hop, 0.9, '#2a1a12');
    },
    boar(c, m, col, acc, a) {
      const s = Math.sin(a * 10) * (Math.abs(m.vx) > 10 ? 3 : 0);
      for (const lx of [-10, -4, 6, 11]) Spr.line(c, lx, -8, lx + (lx % 2 ? s : -s), 0, col, 3);
      Spr.ellipse(c, 0, -12, 15, 8, col);
      Spr.poly(c, [10, -16, 19, -11, 18, -6, 10, -6], col);
      Spr.poly(c, [-12, -19, -4, -21, 6, -19, 0, -17], col);
      Spr.line(c, 17, -8, 21, -12, '#efe7d2', 1.5);
      Spr.eye(c, 14, -13, '#ffb04a', 1.1);
    },
    wolf(c, m, col, acc, a) {
      const s = Math.sin(a * 12) * (Math.abs(m.vx) > 10 ? 4 : 0);
      const sc = m.w / 28;
      c.scale(sc, sc);
      for (const lx of [-9, -5, 6, 10]) Spr.line(c, lx, -8, lx + (lx < 0 ? s : -s), 0, col, 2.6);
      Spr.ellipse(c, 0, -11, 12, 5.5, col);
      Spr.poly(c, [8, -16, 18, -12, 20, -9, 9, -7], col);
      Spr.poly(c, [9, -15, 11, -21, 13, -15], col);
      c.beginPath(); c.moveTo(-11, -12); c.quadraticCurveTo(-20, -18, -22, -10); c.strokeStyle = col; c.lineWidth = 3; c.stroke();
      Spr.eye(c, 15, -13, m.def.color === '#cfd6dc' || m.def.color === '#bfe4f2' ? '#7fd8ff' : '#ffcf4a', 1.1);
    },
    zombie(c, m, col, acc, a) {
      Spr.line(c, -2, -12, -2, 0, col, 3.2);
      Spr.line(c, 2, -12, 2, 0, col, 3.2);
      Spr.poly(c, [-6, -26, 6, -26, 7, -10, -7, -10], '#3b2a4a');
      Spr.line(c, 4, -23, 14, -23, col, 3);
      Spr.line(c, 4, -19, 14, -19, col, 3);
      Spr.circle(c, 1, -29, 4.6, col);
      Spr.poly(c, [-4, -33, 6, -33, 5, -36, -3, -36], '#2a2030');
      /* bùa trấn trên trán */
      Spr.poly(c, [2, -33, 6, -33, 6, -24, 2, -24], '#e8d27a');
      Spr.line(c, 4, -31, 4, -26, '#a8261c', 0.8);
      Spr.eye(c, 3, -29, '#9cff8a', 0.8);
    },
    ghost(c, m, col, acc, a, t) {
      c.globalAlpha *= 0.75;
      Spr.glow(c, 0, -m.h / 2, m.h, acc, 0.25);
      c.beginPath();
      c.moveTo(-m.w / 2, -m.h * 0.45);
      c.quadraticCurveTo(-m.w / 2, -m.h, 0, -m.h);
      c.quadraticCurveTo(m.w / 2, -m.h, m.w / 2, -m.h * 0.45);
      for (let i = 0; i <= 4; i++) c.lineTo(m.w / 2 - (i / 4) * m.w, -Math.sin(t * 6 + i) * 3 - (i % 2 ? 0 : 4));
      c.closePath();
      c.fillStyle = M.mixColor(acc, '#0a0c12', 0.35); c.fill();
      Spr.circle(c, 3, -m.h * 0.7, 1.6, '#0a0c12');
      Spr.circle(c, -3, -m.h * 0.7, 1.6, '#0a0c12');
    },
    bat(c, m, col, acc, a) {
      const f = Math.sin(a * 22) * 6;
      Spr.poly(c, [0, -8, -12, -10 - f, -8, -4, 0, -6, 8, -4, 12, -10 - f], col);
      Spr.ellipse(c, 0, -7, 3.5, 4, col);
      Spr.eye(c, 1.5, -8, '#ff3b2f', 0.8);
    },
    bird(c, m, col, acc, a) {
      const f = m.state === 'dive' ? -6 : Math.sin(a * 14) * 7;
      Spr.ellipse(c, 0, -8, 10, 4, col);
      Spr.poly(c, [-2, -9, -14, -14 - f, -10, -8], col);
      Spr.poly(c, [2, -9, 8, -16 - f, 10, -8], col);
      Spr.poly(c, [9, -10, 15, -8, 9, -6], '#d9b25f');
      Spr.poly(c, [-9, -8, -16, -11, -15, -5], col);
      Spr.glow(c, 0, -8, 14, acc, 0.25);
      Spr.eye(c, 7, -9, '#e1d6ff', 0.9);
    },
    treant(c, m, col, acc, a) {
      const s = Math.sin(a * 6) * 2;
      Spr.line(c, -3, -10, -4 + s, 0, col, 4);
      Spr.line(c, 3, -10, 4 - s, 0, col, 4);
      Spr.poly(c, [-7, -28, 7, -28, 6, -9, -6, -9], col);
      Spr.line(c, -5, -24, -13, -30 + s, col, 2.5);
      Spr.line(c, 5, -24, 13, -32 - s, col, 2.5);
      Spr.ellipse(c, 0, -32, 11, 7, M.mixColor(acc, INK, 0.45));
      Spr.eye(c, 3, -24, '#c9ff6b', 1.1);
    },
    wasp(c, m, col, acc, a) {
      const f = Math.sin(a * 40) * 4;
      Spr.ellipse(c, -2, -7, 4, 6 + f * 0.2, 'rgba(230,240,220,0.35)', -0.5);
      Spr.ellipse(c, 0, -6, 6, 3.5, col);
      Spr.ellipse(c, -6, -5, 4, 3, acc);
      Spr.line(c, -10, -4, -13, -3, INK, 1.5);
      Spr.eye(c, 5, -7, '#ff3b2f', 0.8);
    },
    snake(c, m, col, acc, a) {
      c.beginPath();
      for (let i = 0; i <= 10; i++) { const x = -13 + i * 2.4, y = -3 - Math.sin(a * 6 + i * 0.8) * 2; i ? c.lineTo(x, y) : c.moveTo(x, y); }
      c.strokeStyle = col; c.lineWidth = 5; c.lineCap = 'round'; c.stroke();
      Spr.ellipse(c, 12, -6, 5, 3.5, col);
      if (m.windup > 0) Spr.glow(c, 15, -6, 10, '#9be36b', 0.6);
      Spr.eye(c, 13, -7, '#c9ff6b', 0.9);
    },
    wisp(c, m, col, acc, a, t) {
      const f = 1 + Math.sin(t * 12) * 0.08;
      Spr.glow(c, 0, -m.h / 2, m.h * 1.4, acc, 0.45);
      c.beginPath();
      c.moveTo(0, -m.h * 1.15 * f);
      c.quadraticCurveTo(m.w * 0.6, -m.h * 0.5, 0, 0);
      c.quadraticCurveTo(-m.w * 0.6, -m.h * 0.5, 0, -m.h * 1.15 * f);
      c.fillStyle = M.mixColor(acc, '#fff4d8', 0.35); c.fill();
      Spr.circle(c, 0, -m.h * 0.42, m.w * 0.28, '#fff4d8');
      Spr.circle(c, 2, -m.h * 0.48, 1.2, INK);
      Spr.circle(c, -2, -m.h * 0.48, 1.2, INK);
    },
    worm(c, m, col, acc, a) {
      for (let i = 0; i < 5; i++) {
        const x = 12 - i * 6, y = -6 - Math.abs(Math.sin(a * 5 + i)) * 3;
        Spr.circle(c, x, y, 6 - i * 0.5, i % 2 ? col : M.mixColor(acc, INK, 0.3));
      }
      Spr.glow(c, 14, -6, 10, '#ff6a1f', 0.4);
      Spr.eye(c, 15, -8, '#ffd27a', 1.2);
    },
    monkey(c, m, col, acc, a) {
      Spr.line(c, -2, -9, -4, 0, col, 3);
      Spr.line(c, 2, -9, 4, 0, col, 3);
      Spr.ellipse(c, 0, -13, 6, 6, col);
      Spr.circle(c, 3, -20, 4.5, col);
      Spr.line(c, 4, -14, 11, -18, col, 2.5);
      c.beginPath(); c.moveTo(-5, -12); c.quadraticCurveTo(-14, -16, -12, -24); c.strokeStyle = acc; c.lineWidth = 2; c.stroke();
      Spr.glow(c, -12, -24, 8, '#ff8a3c', 0.5);
      Spr.eye(c, 5, -21, '#ffd27a', 1);
    },
    crystal(c, m, col, acc, a, t) {
      Spr.glow(c, 0, -13, 26, acc, 0.35 + (m.windup > 0 ? 0.3 : 0));
      Spr.poly(c, [0, -28, 8, -12, 4, 0, -4, 0, -8, -12], M.mixColor(acc, '#0b1a26', 0.4), 'rgba(220,245,255,0.7)', 1);
      Spr.poly(c, [-9, -16, -13, -8, -9, -2, -6, -9], M.mixColor(acc, '#0b1a26', 0.55));
      Spr.poly(c, [9, -14, 13, -7, 9, -2, 6, -8], M.mixColor(acc, '#0b1a26', 0.55));
      Spr.circle(c, 0, -14, 2.4, '#e9fbff');
    },
    golem(c, m, col, acc, a, t) {
      const s = Math.sin(a * 6) * 2.5;
      const sc = m.h / 34;
      c.scale(sc, sc);
      Spr.poly(c, [-6, -12, -2, -12, -2, 0, -7, 0], col);
      Spr.poly(c, [2, -12, 6, -12, 7, 0, 2, 0], col);
      Spr.poly(c, [-10, -30, 10, -30, 8, -11, -8, -11], col);
      Spr.poly(c, [10, -28, 15, -18 + s, 12, -10 + s, 8, -20], col);
      Spr.poly(c, [-6, -36, 6, -36, 6, -30, -6, -30], col);
      Spr.line(c, -6, -22, 6, -18, acc, 1.2);
      Spr.line(c, 0, -26, -3, -14, acc, 1.2);
      Spr.glow(c, 0, -22, 10, acc, 0.4);
      Spr.eye(c, 2, -33, '#e1d6ff', 1.3);
    },
    /* ---------- Thủ lĩnh ---------- */
    treeKing(c, m, col, acc, a, t) {
      const s = Math.sin(a * 2) * 3;
      Spr.poly(c, [-20, 0, -14, -20, -26, 0], col);
      Spr.poly(c, [20, 0, 14, -20, 26, 0], col);
      Spr.poly(c, [-18, -70, 18, -70, 16, -10, -16, -10], col);
      Spr.line(c, -14, -60, -40, -86 + s, col, 7);
      Spr.line(c, -30, -78 + s, -44, -70 + s, col, 4);
      Spr.line(c, 14, -60, 40, -90 - s, col, 7);
      Spr.line(c, 32, -84 - s, 46, -96 - s, col, 4);
      Spr.ellipse(c, 0, -88, 38, 22, M.mixColor(acc, INK, 0.5));
      Spr.ellipse(c, -22, -82, 18, 12, M.mixColor(acc, INK, 0.6));
      Spr.ellipse(c, 24, -84, 18, 12, M.mixColor(acc, INK, 0.6));
      Spr.poly(c, [-8, -44, 8, -44, 4, -34, -4, -34], '#0b0907');
      Spr.eye(c, -6, -54, '#c9ff6b', 2.4);
      Spr.eye(c, 7, -54, '#c9ff6b', 2.4);
    },
    dragon(c, m, col, acc, a, t) {
      /* thân rồng uốn khúc */
      for (let i = 9; i >= 0; i--) {
        const x = -i * 9, y = -20 + Math.sin(t * 4 - i * 0.6) * 9;
        Spr.circle(c, x, y, 11 - i * 0.7, i % 2 ? col : M.mixColor(acc, INK, 0.35));
        if (i % 3 === 0) Spr.poly(c, [x - 3, y - 10 + i * 0.5, x, y - 18 + i * 0.6, x + 3, y - 10 + i * 0.5], acc);
      }
      Spr.poly(c, [6, -30, 30, -24, 34, -16, 8, -10], col);
      Spr.poly(c, [10, -30, 6, -42, 16, -32], acc);
      Spr.poly(c, [20, -28, 22, -40, 26, -28], acc);
      Spr.line(c, 30, -18, 44, -14 + Math.sin(t * 6) * 3, '#ffd27a', 1.4);
      Spr.glow(c, 26, -20, 26, '#ff6a1f', 0.45);
      Spr.eye(c, 22, -24, '#ffe08a', 2);
    },
    phoenix(c, m, col, acc, a, t) {
      const f = Math.sin(t * 7) * 14;
      Spr.glow(c, 0, -22, 60, acc, 0.35);
      c.beginPath(); c.moveTo(-8, -20);
      for (let i = 0; i < 3; i++) c.quadraticCurveTo(-40 - i * 8, -10 + i * 10 + f * 0.3, -60 - i * 6, 4 + i * 8);
      c.strokeStyle = M.rgba(acc, 0.8); c.lineWidth = 3; c.stroke();
      Spr.poly(c, [-4, -24, -40, -58 - f, -30, -26, -46, -30 - f * 0.6, -12, -16], M.mixColor(acc, INK, 0.3));
      Spr.poly(c, [4, -24, 30, -62 - f, 26, -28, 40, -34 - f * 0.6, 10, -16], M.mixColor(acc, INK, 0.2));
      Spr.ellipse(c, 0, -20, 14, 9, col);
      Spr.circle(c, 14, -30, 6, col);
      Spr.poly(c, [18, -32, 26, -29, 18, -27], '#e9f6ff');
      Spr.poly(c, [12, -36, 8, -46, 16, -38], acc);
      Spr.eye(c, 16, -31, '#ffffff', 1.4);
    },
    thunderGolem(c, m, col, acc, a, t) {
      const s = Math.sin(a * 3) * 3;
      Spr.poly(c, [-22, 0, -14, -34, -2, -34, -8, 0], col);
      Spr.poly(c, [8, 0, 2, -34, 14, -34, 22, 0], col);
      Spr.poly(c, [-30, -90, 30, -90, 24, -34, -24, -34], col);
      Spr.poly(c, [30, -86, 46, -60 + s, 40, -30 + s, 26, -56], col);
      Spr.poly(c, [-30, -86, -46, -60 - s, -40, -30 - s, -26, -56], col);
      Spr.poly(c, [-14, -110, 14, -110, 16, -90, -16, -90], col);
      Spr.poly(c, [-18, -112, -8, -126, -6, -110], acc);
      Spr.poly(c, [18, -112, 8, -126, 6, -110], acc);
      for (let i = 0; i < 4; i++) Spr.line(c, -20 + i * 12, -80, -14 + i * 12 + Math.sin(t * 20 + i) * 3, -44, M.rgba('#e1d6ff', 0.7), 1.4);
      Spr.glow(c, 0, -64, 40, acc, 0.35);
      Spr.eye(c, -6, -100, '#e1d6ff', 2.4);
      Spr.eye(c, 6, -100, '#e1d6ff', 2.4);
    },
  },

  /* ======================= Tài nguyên ======================= */
  resource(c, r, biome, t) {
    const R = DATA.resources[r.type];
    const sh = r.shake > 0 ? Math.sin(t * 60) * 2 : 0;
    c.save();
    c.translate(r.x + sh, r.y);
    c.scale((r.flip ? -1 : 1) * r.size, r.size);
    const dark = M.mixColor(biome.dark, INK, 0.4);
    if (!r.alive) {
      if (R.tool === 'axe') Spr.poly(c, [-5, 0, -4, -6, 4, -6, 5, 0], dark);
      else if (R.tool === 'pick') Spr.ellipse(c, 0, -2, 7, 3, dark);
      c.restore();
      return;
    }
    switch (r.type) {
      case 'tung': case 'tuyet_tung': {
        Spr.poly(c, [-3, 0, -2, -34, 2, -34, 3, 0], dark);
        const lay = [[-22, -30, 22, -30, 0, -60], [-18, -50, 18, -50, 0, -78], [-13, -68, 13, -68, 0, -96]];
        const leaf = r.type === 'tuyet_tung' ? '#5d6e74' : M.mixColor(biome.ground, INK, 0.45);
        for (const l of lay) Spr.poly(c, l, leaf);
        if (r.type === 'tuyet_tung') for (const l of lay) Spr.poly(c, [l[0] * 0.7, l[1] - 3, l[2] * 0.7, l[3] - 3, 0, l[5] + 4], '#eef4f6');
        break;
      }
      case 'phong': {
        Spr.poly(c, [-3, 0, -2, -40, 2, -40, 3, 0], dark);
        Spr.line(c, 0, -30, -14, -48, dark, 2.5);
        Spr.line(c, 0, -36, 12, -54, dark, 2.5);
        for (const [x, y, rr] of [[-14, -56, 16], [10, -62, 18], [-2, -74, 17], [16, -48, 11], [-20, -44, 10]]) Spr.circle(c, x, y, rr, M.mixColor('#b0442c', INK, 0.25));
        break;
      }
      case 'truc': {
        for (const [x, h, lean] of [[-6, 104, -4], [0, 112, 2], [6, 96, 6], [11, 84, 9]]) {
          const sway = Math.sin(t * 1.5 + x) * 2;
          Spr.line(c, x, 0, x + lean + sway, -h, M.mixColor('#4f7a4c', INK, 0.35), 2.6);
          for (let k = 1; k < 5; k++) Spr.line(c, x + (lean + sway) * k / 5 - 1.5, -h * k / 5, x + (lean + sway) * k / 5 + 1.5, -h * k / 5, INK, 1.2);
          for (let k = 0; k < 3; k++) Spr.ellipse(c, x + lean + sway + (k - 1) * 6, -h + 6 + k * 8, 7, 1.8, M.mixColor('#7fb08a', INK, 0.35), k % 2 ? 0.5 : -0.5);
        }
        break;
      }
      case 'da':
        Spr.poly(c, [-14, 0, -11, -14, -2, -20, 9, -16, 14, -6, 13, 0], M.mixColor(biome.ground, '#6e6a62', 0.5));
        Spr.line(c, -6, -12, 2, -16, 'rgba(255,255,255,0.18)', 2);
        break;
      case 'quang_sat': case 'linh_thach': case 'loi_van': {
        Spr.poly(c, [-15, 0, -12, -16, -2, -22, 10, -18, 15, -6, 14, 0], M.mixColor(biome.ground, '#4a4640', 0.6));
        const gem = r.type === 'quang_sat' ? '#a8754a' : r.type === 'linh_thach' ? '#7fe0d0' : '#b9a8ff';
        for (const [x, y] of [[-6, -10], [4, -14], [7, -6], [-1, -5]]) Spr.poly(c, [x, y - 3, x + 2, y, x, y + 3, x - 2, y], gem);
        if (r.type !== 'quang_sat') Spr.glow(c, 0, -10, 20, gem, 0.3 + Math.sin(t * 3) * 0.1);
        break;
      }
      case 'bui_qua':
        Spr.ellipse(c, 0, -8, 13, 9, M.mixColor('#3c5a45', INK, 0.4));
        for (const [x, y] of [[-6, -10], [3, -13], [7, -6], [-2, -5]]) Spr.circle(c, x, y, 2, '#c8402f');
        break;
      case 'linh_thao':
        for (let k = -2; k <= 2; k++) Spr.line(c, 0, 0, k * 4, -10 - Math.abs(k) * -2, '#5fae8f', 1.6);
        Spr.glow(c, 0, -10, 10, '#9be3b0', 0.4 + Math.sin(t * 2 + r.c) * 0.15);
        break;
      case 'hoa_linh_chi':
        Spr.line(c, 0, 0, 0, -6, '#d9c3a0', 2);
        Spr.ellipse(c, 0, -7, 7, 3.5, '#c2381e');
        Spr.glow(c, 0, -7, 12, '#ff8a3c', 0.35);
        break;
      case 'tuyet_lien':
        for (let k = 0; k < 6; k++) Spr.ellipse(c, Math.cos(k) * 3, -6 + Math.sin(k) * 2, 4, 1.6, '#f4fbff', k);
        Spr.glow(c, 0, -6, 12, '#bfeaff', 0.45);
        break;
    }
    c.restore();
  },

  /* ======================= Công trình ======================= */
  structure(c, s, t, G) {
    const S = DATA.structures[s.type];
    c.save();
    c.translate(s.x, s.y);
    switch (s.type) {
      case 'lua_trai': {
        Spr.line(c, -10, 0, 10, -5, '#5a3e26', 4);
        Spr.line(c, -10, -5, 10, 0, '#4a321e', 4);
        for (let i = -2; i <= 2; i++) Spr.circle(c, i * 5, 1, 3, '#57524a');
        if (s.fuel > 0) {
          const f = 1 + Math.sin(t * 14) * 0.12 + Math.sin(t * 23) * 0.06;
          Spr.glow(c, 0, -10, 46, '#ff9a3c', 0.45);
          c.beginPath(); c.moveTo(-8, -3); c.quadraticCurveTo(-6, -18 * f, 0, -26 * f); c.quadraticCurveTo(6, -18 * f, 8, -3); c.fillStyle = '#ff7a2f'; c.fill();
          c.beginPath(); c.moveTo(-4, -3); c.quadraticCurveTo(-2, -12 * f, 0, -17 * f); c.quadraticCurveTo(3, -12 * f, 4, -3); c.fillStyle = '#ffd27a'; c.fill();
        }
        break;
      }
      case 'ban_che_tac':
        Spr.poly(c, [-17, -18, 17, -18, 17, -14, -17, -14], '#5a3e26');
        Spr.line(c, -13, -14, -13, 0, '#4a321e', 3);
        Spr.line(c, 13, -14, 13, 0, '#4a321e', 3);
        Spr.line(c, -6, -22, 4, -19, '#b8bec4', 2);
        Spr.poly(c, [6, -24, 12, -24, 12, -18, 6, -18], '#8a6a44');
        break;
      case 'lo_luyen': {
        Spr.poly(c, [-15, 0, -13, -26, -6, -34, 6, -34, 13, -26, 15, 0], '#3e3a36');
        Spr.poly(c, [-6, -4, -6, -14, 6, -14, 6, -4], '#1a1410');
        Spr.glow(c, 0, -9, 22, '#ff7a2f', 0.45 + Math.sin(t * 6) * 0.1);
        Spr.poly(c, [-5, -5, -5, -12, 5, -12, 5, -5], '#ff8a3c');
        Spr.line(c, 4, -34, 4, -42, '#3e3a36', 4);
        break;
      }
      case 'dan_lo': {
        Spr.line(c, -9, 0, -7, -8, '#4a3a2a', 2.5);
        Spr.line(c, 9, 0, 7, -8, '#4a3a2a', 2.5);
        Spr.ellipse(c, 0, -14, 12, 9, '#6b5a3a');
        Spr.poly(c, [-8, -22, 8, -22, 6, -27, -6, -27], '#6b5a3a');
        Spr.circle(c, 0, -29, 2.5, '#c9a24f');
        Spr.glow(c, 0, -14, 20, '#9be3b0', 0.25 + Math.sin(t * 3) * 0.1);
        if (Math.random() < 0.1) G.particle(s.x + M.lerp(-3, 3, Math.random()), s.y - 30, 0, -20, 1.2, 'smoke', '#cfc6ad', 5);
        break;
      }
      case 'thao_tich':
        Spr.poly(c, [-17, 0, -17, -5, 17, -5, 17, 0], '#b89a5a');
        for (let i = -15; i < 16; i += 4) Spr.line(c, i, -5, i + 2, 0, '#8a7040', 1);
        Spr.ellipse(c, -12, -6, 5, 2.5, '#d8cfb4');
        break;
      case 'bo_doan':
        Spr.ellipse(c, 0, -3, 10, 4, '#a8853f');
        Spr.ellipse(c, 0, -4, 7, 2.4, '#c9a24f');
        break;
      case 'den_long': {
        Spr.line(c, 0, 0, 0, -30, '#3a2a1a', 2.5);
        Spr.line(c, 0, -30, 6, -32, '#3a2a1a', 2);
        Spr.glow(c, 6, -26, 30, '#ff8a4c', 0.45);
        Spr.ellipse(c, 6, -26, 5, 7, '#c8402f');
        Spr.line(c, 3, -26, 9, -26, '#ffd27a', 1);
        break;
      }
      case 'tu_linh_tran': {
        c.globalAlpha = 0.85;
        c.beginPath(); c.ellipse(0, -2, 30, 5, 0, 0, Math.PI * 2); c.strokeStyle = '#7fe0d0'; c.lineWidth = 1.5; c.stroke();
        c.beginPath(); c.ellipse(0, -2, 20, 3.3, 0, 0, Math.PI * 2); c.stroke();
        for (let i = 0; i < 8; i++) { const a = t * 0.6 + i * Math.PI / 4; Spr.circle(c, Math.cos(a) * 30, -2 + Math.sin(a) * 5, 1.5, '#bff7ec'); }
        c.globalAlpha = 1;
        Spr.glow(c, 0, -8, 34, '#7fe0d0', 0.2);
        break;
      }
    }
    c.restore();
  },

  /* Cổng bí cảnh */
  portal(c, x, y, id, open, t, cleared) {
    const pal = DATA.dungeons[id].pal;
    c.save();
    c.translate(x, y);
    Spr.poly(c, [-26, 0, -22, -64, -16, -64, -18, 0], '#26221c');
    Spr.poly(c, [26, 0, 22, -64, 16, -64, 18, 0], '#26221c');
    Spr.poly(c, [-34, -64, 34, -64, 30, -72, -30, -72], '#26221c');
    Spr.poly(c, [-28, -74, 28, -74, 24, -79, -24, -79], '#26221c');
    if (open) {
      Spr.glow(c, 0, -34, 60, pal.glow, 0.35);
      for (let i = 0; i < 5; i++) {
        c.beginPath();
        c.ellipse(0, -32, 15 - i * 2.4, 28 - i * 4.5, 0, t * (1 + i * 0.4) + i, t * (1 + i * 0.4) + i + 4.2);
        c.strokeStyle = M.rgba(i % 2 ? pal.glow : pal.accent, 0.8 - i * 0.12);
        c.lineWidth = 2.2;
        c.stroke();
      }
    } else {
      c.fillStyle = 'rgba(20,18,15,0.6)'; c.fillRect(-16, -62, 32, 62);
      Spr.line(c, -16, -50, 16, -20, '#5a5248', 2);
      Spr.line(c, 16, -50, -16, -20, '#5a5248', 2);
    }
    c.fillStyle = cleared ? '#ffd27a' : pal.accent;
    c.font = 'bold 10px "Noto Serif SC","Songti SC",serif';
    c.textAlign = 'center';
    c.fillText({ moc: '木', hoa: '火', thuy: '水', loi: '雷' }[id], 0, -66);
    c.restore();
  },

  /* Truyền Tống Trận */
  array(c, x, y, placed, t, won) {
    c.save();
    c.translate(x, y);
    const els = DATA.dungeonOrder;
    c.beginPath(); c.ellipse(0, -3, 44, 8, 0, 0, Math.PI * 2); c.strokeStyle = won ? '#ffd27a' : '#8f8a78'; c.lineWidth = 2; c.stroke();
    c.beginPath(); c.ellipse(0, -3, 30, 5.5, 0, 0, Math.PI * 2); c.lineWidth = 1; c.stroke();
    els.forEach((id, i) => {
      const a = i * Math.PI / 2 + Math.PI / 4;
      const px = Math.cos(a) * 40, py = -3 + Math.sin(a) * 7;
      const lit = placed.includes(DATA.dungeons[id].fragment);
      Spr.poly(c, [px - 4, py, px - 3, py - 16, px + 3, py - 16, px + 4, py], '#3a352c');
      if (lit) { Spr.glow(c, px, py - 18, 18, DATA.dungeons[id].pal.glow, 0.7); Spr.circle(c, px, py - 18, 3, DATA.dungeons[id].pal.glow); }
    });
    if (won || placed.length === 4) {
      Spr.glow(c, 0, -40, 80, '#ffe9a8', 0.4);
      Spr.line(c, 0, 0, 0, -220, 'rgba(255,240,200,0.35)', 18);
    }
    c.restore();
  },
};

/* ===== js/render.js ===== */
'use strict';
/* Kết xuất: bầu trời, núi xa nhiều lớp, địa hình, thực thể, ánh sáng đêm, thời tiết */

const Renderer = {
  canvas: null, ctx: null, vw: 960, vh: 540, dpr: 1, k: 1,
  light: null, lctx: null,
  weather: [],
  stars: [],

  init(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.light = document.createElement('canvas');
    this.lctx = this.light.getContext('2d');
    for (let i = 0; i < 90; i++) this.stars.push({ x: Math.random(), y: Math.random() * 0.6, r: Math.random() * 1.2 + 0.3, p: Math.random() * 6 });
    for (let i = 0; i < 90; i++) this.weather.push({ x: Math.random(), y: Math.random(), s: Math.random(), r: Math.random() * 6 });
    this.resize();
    window.addEventListener('resize', () => this.resize());
  },

  resize() {
    const W = window.innerWidth, H = window.innerHeight;
    this.dpr = Math.min(2, window.devicePixelRatio || 1);
    this.vh = H < 520 ? 405 : H < 760 ? 470 : 540;
    const aspect = M.clamp(W / H, 1.25, 2.4);
    this.vw = Math.round(this.vh * aspect);
    this.k = Math.min(W / this.vw, H / this.vh);
    const cw = Math.round(this.vw * this.k), ch = Math.round(this.vh * this.k);
    this.canvas.style.width = cw + 'px';
    this.canvas.style.height = ch + 'px';
    this.canvas.style.left = Math.round((W - cw) / 2) + 'px';
    this.canvas.style.top = Math.round((H - ch) / 2) + 'px';
    this.canvas.width = Math.round(cw * this.dpr);
    this.canvas.height = Math.round(ch * this.dpr);
    this.light.width = Math.ceil(this.vw / 2);
    this.light.height = Math.ceil(this.vh / 2);
    if (typeof Game !== 'undefined' && Game.player) Game.snapCamera();
  },

  /* ---------- Bảng màu bầu trời theo giờ ---------- */
  skyKeys: [
    [0, '#0b1020', '#1b2238'], [4.5, '#141a33', '#2a2f4d'], [5.5, '#3a3f63', '#e8a77a'], [7.5, '#8fb3c6', '#efe2c8'],
    [12, '#a9c9d4', '#f2ead6'], [16.5, '#b4c2c8', '#efdfc2'], [18.6, '#4f4a72', '#f0a06a'], [19.8, '#1a1f3d', '#3a3554'], [24, '#0b1020', '#1b2238'],
  ],
  skyAt(h) {
    const K = this.skyKeys;
    for (let i = 0; i < K.length - 1; i++) {
      if (h >= K[i][0] && h <= K[i + 1][0]) {
        const t = (h - K[i][0]) / (K[i + 1][0] - K[i][0]);
        return [M.mixColor(K[i][1], K[i + 1][1], t), M.mixColor(K[i][2], K[i + 1][2], t)];
      }
    }
    return [K[0][1], K[0][2]];
  },
  darkness(G) {
    if (G.level !== G.world) return 0.52;
    const h = G.hours();
    if (h >= 7 && h <= 17.5) return 0;
    if (h > 17.5 && h < 20.5) return M.smooth((h - 17.5) / 3) * 0.82;
    if (h >= 20.5 || h < 4) return 0.82;
    return (1 - M.smooth((h - 4) / 3)) * 0.82;
  },

  /* ======================= Vẽ khung hình ======================= */
  draw(G, t, dt) {
    const c = this.ctx;
    const s = this.k * this.dpr;
    c.setTransform(s, 0, 0, s, 0, 0);
    c.imageSmoothingEnabled = true;
    const vw = this.vw, vh = this.vh;
    if (!G.level) { c.fillStyle = '#0f1416'; c.fillRect(0, 0, vw, vh); return; }
    const cam = G.cam;
    const shx = cam.shake ? (Math.random() - 0.5) * cam.shake : 0, shy = cam.shake ? (Math.random() - 0.5) * cam.shake : 0;
    const cx = Math.round(cam.x + shx), cy = Math.round(cam.y + shy);
    const dungeon = G.level !== G.world;
    let skyTop, skyBot, biome = null;
    if (dungeon) { skyTop = G.dungeon.def.pal.sky1; skyBot = G.dungeon.def.pal.sky2; }
    else {
      biome = G.world.biomeAtX(G.player.cx);
      [skyTop, skyBot] = this.skyAt(G.hours());
      skyBot = M.mixColor(this.toHex(skyBot), biome.tint, 0.18);
      if (G.bloodMoon()) { skyTop = M.mixColor(this.toHex(skyTop), '#3a0508', 0.6); skyBot = M.mixColor(this.toHex(skyBot), '#7a1410', 0.5); }
    }
    const g = c.createLinearGradient(0, 0, 0, vh);
    g.addColorStop(0, skyTop); g.addColorStop(1, skyBot);
    c.fillStyle = g; c.fillRect(0, 0, vw, vh);
    if (dungeon) this.dungeonBack(c, G, cx, cy, t);
    else {
      const gsy = G.world.groundY(cx + vw / 2) - cy;
      this.anchor = this.anchor == null || Math.abs(this.anchor - gsy) > vh ? gsy : M.lerp(this.anchor, gsy, Math.min(1, dt * 2.5));
      this.overworldBack(c, G, cx, cy, t, skyBot, biome);
    }
    /* --------- Không gian thế giới --------- */
    c.save();
    c.translate(-cx, -cy);
    if (dungeon) this.dungeonTiles(c, G, cx, cy, t);
    else this.terrain(c, G, cx, cy, t);
    this.objects(c, G, cx, cy, t, dt);
    for (const m of G.mobs) if (m.x + m.w > cx - 60 && m.x < cx + vw + 60) Spr.mob(c, m, t);
    if (G.mode !== 'dead' || true) Spr.player(c, G.player, G, t);
    this.zones(c, G, t, false);
    this.particles(c, G, false);
    this.ghost(c, G, t);
    c.restore();
    /* --------- Ánh sáng & lớp phủ --------- */
    this.lighting(c, G, cx, cy, t);
    /* vật phát sáng & chữ vẽ sau lớp tối để luôn nổi bật */
    c.save();
    c.translate(-cx, -cy);
    this.projectiles(c, G, t);
    this.zones(c, G, t, true);
    this.particles(c, G, true);
    this.marker(c, G, t);
    this.texts(c, G);
    c.restore();
    if (!dungeon) this.weatherFx(c, G, biome, t, dt);
    if (G.flash > 0) { c.fillStyle = 'rgba(235,230,255,' + (G.flash * 4) + ')'; c.fillRect(0, 0, vw, vh); }
    const p = G.player;
    const low = p.hp / G.maxHp();
    const vg = c.createRadialGradient(vw / 2, vh / 2, vh * 0.35, vw / 2, vh / 2, vh * 0.95);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, low < 0.3 && G.mode === 'play' ? 'rgba(120,10,6,' + (0.55 + Math.sin(t * 6) * 0.1) + ')' : 'rgba(0,0,0,0.45)');
    c.fillStyle = vg; c.fillRect(0, 0, vw, vh);
  },

  toHex(rgb) {
    if (rgb[0] === '#') return rgb;
    const m = rgb.match(/\d+/g);
    return '#' + m.slice(0, 3).map((v) => (+v).toString(16).padStart(2, '0')).join('');
  },

  /* ---------- Nền thế giới: mặt trời/trăng, núi xa, rừng ---------- */
  overworldBack(c, G, cx, cy, t, skyBot, biome) {
    const vw = this.vw, vh = this.vh;
    const h = G.hours();
    const night = this.darkness(G);
    /* sao */
    if (night > 0.2) {
      for (const st of this.stars) {
        c.globalAlpha = night * (0.5 + Math.sin(t * 2 + st.p) * 0.3);
        c.fillStyle = '#f4f0e0';
        c.fillRect(st.x * vw, st.y * vh, st.r, st.r);
      }
      c.globalAlpha = 1;
    }
    /* mặt trời / mặt trăng */
    const dayT = (h - 5) / 15;
    if (dayT > 0 && dayT < 1) {
      const sx = vw * (0.1 + dayT * 0.8), sy = vh * (0.62 - Math.sin(dayT * Math.PI) * 0.5);
      Spr.glow(c, sx, sy, 70, '#ffe2a8', 0.5);
      Spr.circle(c, sx, sy, 16, '#f6dfb0');
    } else {
      const nt = ((h + 24 - 19.5) % 24) / 9.5;
      const mx = vw * (0.1 + nt * 0.8), my = vh * (0.6 - Math.sin(M.clamp(nt, 0, 1) * Math.PI) * 0.45);
      const blood = G.bloodMoon();
      Spr.glow(c, mx, my, 60, blood ? '#ff3b2f' : '#dfe6ff', 0.35);
      Spr.circle(c, mx, my, 13, blood ? '#c8402f' : '#e9ecf2');
      Spr.circle(c, mx + 4, my - 3, 10, M.rgba(blood ? '#7a1410' : '#c9cfdc', 0.4));
    }
    const ink = '#1b1a1e';
    const sb = this.toHex(skyBot);
    /* lớp núi xa */
    const A = this.anchor;
    this.ridge(c, cx * 0.08, 0, A - 120, 70, 0.0021, M.mixColor(sb, ink, 0.18), 11, 'peak');
    this.mist(c, A - 95, sb, 0.5);
    this.ridge(c, cx * 0.2, 0, A - 45, 60, 0.0042, M.mixColor(sb, ink, 0.36), 23, biome.id === 'loi_phong' ? 'spike' : 'peak');
    this.mist(c, A - 30, sb, 0.45);
    /* rừng gần theo vùng */
    this.forest(c, G, cx * 0.45, 0, A - 14, M.mixColor(sb, ink, 0.55), biome, t);
    this.mist(c, A + 4, sb, 0.3);
  },
  ridge(c, ox, oy, base, amp, freq, color, seed, style) {
    const vw = this.vw;
    c.beginPath();
    c.moveTo(0, this.vh);
    for (let x = 0; x <= vw + 8; x += 8) {
      const u = (x + ox) * freq;
      let y = Noise.fbm(u, seed, 4);
      if (style === 'spike') y = Math.pow(y, 2.2) * 1.7;
      else y = y * y * 1.4;
      c.lineTo(x, base - oy - y * amp * 2.2);
    }
    c.lineTo(vw, this.vh);
    c.closePath();
    c.fillStyle = color;
    c.fill();
  },
  mist(c, y, col, a) {
    const g = c.createLinearGradient(0, y - 40, 0, y + 30);
    g.addColorStop(0, M.rgba(col, 0));
    g.addColorStop(0.6, M.rgba(col, a));
    g.addColorStop(1, M.rgba(col, 0));
    c.fillStyle = g;
    c.fillRect(0, y - 40, this.vw, 70);
  },
  forest(c, G, ox, oy, base, color, biome, t) {
    const vw = this.vw, vh = this.vh;
    c.fillStyle = color;
    c.fillRect(0, base - oy + 20, vw, vh);
    const step = 26;
    const start = Math.floor(ox / step) - 1;
    for (let i = start; i < start + vw / step + 3; i++) {
      const x = i * step - ox;
      const hsh = Noise.hash(i, 77);
      const wx = (i * step) / 0.45;
      const b = G.world.biomeAtX(wx).id;
      const y = base - oy + 20 - Noise.fbm(i * 0.08, 5) * 30;
      c.beginPath();
      if (b === 'truc_lam') {
        for (let k = 0; k < 3; k++) { const bx = x + k * 7; c.moveTo(bx, y); c.lineTo(bx + 2 + Math.sin(t + i) * 2, y - 70 - hsh * 50); c.lineTo(bx + 3.5, y); }
      } else if (b === 'loi_phong' || b === 'xich_thach') {
        c.moveTo(x - 10, y); c.lineTo(x + hsh * 6, y - 30 - hsh * 50); c.lineTo(x + 14, y);
      } else if (b === 'tan_tich' && hsh > 0.7) {
        c.rect(x - 3, y - 50, 6, 50); c.rect(x - 9, y - 54, 18, 5);
      } else {
        const hh = 40 + hsh * 40;
        c.moveTo(x - 12, y); c.lineTo(x, y - hh); c.lineTo(x + 12, y);
        c.moveTo(x - 9, y - hh * 0.45); c.lineTo(x, y - hh * 1.15); c.lineTo(x + 9, y - hh * 0.45);
      }
      c.fill();
    }
  },

  /* ---------- Nền bí cảnh ---------- */
  dungeonBack(c, G, cx, cy, t) {
    const pal = G.dungeon.def.pal, vw = this.vw, vh = this.vh;
    for (let layer = 0; layer < 2; layer++) {
      const par = layer ? 0.45 : 0.2;
      const col = M.mixColor(pal.sky2, '#000000', layer ? 0.35 : 0.15);
      c.fillStyle = col;
      const step = layer ? 70 : 110;
      const start = Math.floor(cx * par / step) - 1;
      for (let i = start; i < start + vw / step + 3; i++) {
        const x = i * step - cx * par;
        const hsh = Noise.hash(i, 31 + layer);
        const w = 20 + hsh * 30;
        c.beginPath();
        c.moveTo(x - w, 0); c.lineTo(x + w, 0); c.lineTo(x + w * 0.2, vh * (0.25 + hsh * 0.25)); c.closePath(); c.fill();
        c.beginPath();
        c.moveTo(x - w * 1.2, vh); c.lineTo(x + w * 1.2, vh); c.lineTo(x + w * 0.1, vh * (0.55 - hsh * 0.2)); c.closePath(); c.fill();
        if (hsh > 0.6) Spr.glow(c, x, vh * (0.5 + hsh * 0.2), 30, pal.glow, 0.12 + Math.sin(t + i) * 0.05);
      }
    }
  },

  /* ---------- Địa hình thế giới ---------- */
  terrain(c, G, cx, cy, t) {
    const W = G.world, H = W.heights;
    const c0 = Math.max(0, Math.floor(cx / TILE) - 2), c1 = Math.min(W.cols - 1, Math.ceil((cx + this.vw) / TILE) + 2);
    const bottom = cy + this.vh + 20;
    /* thân đất */
    c.beginPath();
    c.moveTo(c0 * TILE, bottom);
    c.lineTo(c0 * TILE, H[c0] * TILE);
    for (let i = c0; i < c1; i++) {
      const mx = (i + 1) * TILE, my = ((H[i] + H[i + 1]) / 2) * TILE;
      c.quadraticCurveTo(i * TILE + TILE / 2, H[i] * TILE, mx, my);
    }
    c.lineTo(c1 * TILE + TILE, H[c1] * TILE);
    c.lineTo(c1 * TILE + TILE, bottom);
    c.closePath();
    const b = W.biomeAt((c0 + c1) / 2);
    const gr = c.createLinearGradient(0, cy + this.vh * 0.4, 0, bottom);
    gr.addColorStop(0, M.mixColor(b.ground, INK, 0.35));
    gr.addColorStop(1, M.mixColor(b.dark, INK, 0.6));
    c.fillStyle = gr;
    c.fill();
    /* viền mặt đất theo vùng */
    let i = c0;
    while (i < c1) {
      const bb = W.biomeAt(i);
      let j = i;
      while (j < c1 && W.biomeAt(j) === bb) j++;
      c.beginPath();
      c.moveTo(i * TILE, H[i] * TILE);
      for (let k = i; k < j; k++) c.quadraticCurveTo(k * TILE + TILE / 2, H[k] * TILE, (k + 1) * TILE, ((H[k] + H[Math.min(W.cols - 1, k + 1)]) / 2) * TILE);
      c.strokeStyle = bb.top; c.lineWidth = bb.id === 'han_dam' ? 6 : 3.5; c.lineCap = 'round';
      c.stroke();
      i = j;
    }
    /* cỏ */
    for (let k = c0; k < c1; k++) {
      const bb = W.biomeAt(k);
      if (bb.id !== 'truc_lam' && bb.id !== 'tan_tich') continue;
