  trigger(m) {
    const ev = U.weighted(Events.list);
    const gs = Explore.monsterGs(m);
    const ctx = { tier: m.tier, gs, s: D.statScale(gs), m };
    if (ev.prep) ev.prep(ctx);
    Stats.add('events');
    if (Explore.auto && G.settings.autoEvents) {
      let idx = ev.auto(ctx);
      const ch = ev.choices[idx];
      if (ch.can && ch.can(ctx) !== true) idx = ev.choices.length - 1;
      Events.choose(ev, ctx, idx, true);
      return;
    }
    UI.eventModal(ev, ctx);
  },

  /** Thực hiện lựa chọn. Trả về kết quả cho UI */
  choose(ev, ctx, idx, auto) {
    const ch = ev.choices[idx];
    if (ch.can) {
      const ok = ch.can(ctx);
      if (ok !== true) return { text: ok, blocked: true };
    }
    const res = ch.run(ctx) || { text: '' };
    Log.add(ev.icon + ' ' + ev.title + ': ' + res.text, 'event');
    Quests.check();
    Ach.check();
    if (auto) {
      if (res.fight) Events.fight(res.fight, ctx);
      else { UI.setExploreStatus && UI.setExploreStatus(ev.icon + ' ' + ev.title + ': ' + res.text); Explore.scheduleAuto(); }
    }
    return res;
  },

  fight(f, ctx) {
    const en = Combat.makeEnemy(f.mon, Math.min(D.MAX_GS + 5, f.gs), { elite: f.elite, tier: ctx.tier });
    Combat.start(en, {
      kind: 'explore', title: 'Kỳ ngộ',
      onWin: () => {
        Stats.add('kills');
        return Loot.give(f.reward ? f.reward() : {});
      },
      onEnd: (b) => {
        if (b.result === 'lose') Explore.setAuto(false);
        if (Explore.auto) Explore.scheduleAuto(1200);
      },
    });
  },
};

/* ===== js/systems/dungeon.js ===== */
'use strict';
/* Bí cảnh, Thông Thiên Tháp, Thiên kiếp */

const Dungeon = {
  resetDaily() {
    const t = U.todayKey();
    if (G.dungeon.date !== t) { G.dungeon.date = t; G.dungeon.used = 0; }
  },
  maxDaily() { return D.DUNGEON_DAILY + Reinc.lv('bi_canh'); },
  left() { Dungeon.resetDaily(); return Math.max(0, Dungeon.maxDaily() - G.dungeon.used) + G.dungeon.bonus; },
  run() { return G.dungeon.run; },
  /** Đang trong bí cảnh (chưa kết thúc) */
  busy() { const r = G.dungeon.run; return !!r && (r.status === 'fight' || r.status === 'rest'); },

  canEnter(d) {
    if (Player.gs() < d.req) return 'Cần đạt ' + D.gsName(d.req);
    if (Dungeon.left() <= 0) return 'Hết lượt hôm nay';
    if (Combat.active() || Explore.busy) return 'Đang bận';
    if (G.dungeon.run) return 'Đang ở trong bí cảnh';
    return true;
  },

  enter(id) {
    const d = D.dungeonById[id];
    if (!d || Dungeon.canEnter(d) !== true) return false;
    Explore.setAuto(false);
    Dungeon.resetDaily();
    if (G.dungeon.used < Dungeon.maxDaily()) G.dungeon.used++;
    else G.dungeon.bonus--;
    G.dungeon.run = { id, stage: 0, loot: [], status: 'fight' };
    Log.add('Tiến vào ' + d.name + '.', 'event');
    Dungeon.next();
    return true;
  },

  next() {
    const run = G.dungeon.run;
    if (!run) return;
    const d = D.dungeonById[run.id];
    const last = run.stage >= d.stages - 1;
    const gs = d.lv + Math.floor(run.stage / 2) + (last ? 1 : 0);
    const mon = last ? d.boss : U.pick(d.pool);
    const en = Combat.makeEnemy(mon, gs, { boss: last, elite: !last && run.stage % 2 === 1, tier: d.tier });
    run.status = 'fight';
    Combat.start(en, {
      kind: 'dungeon',
      title: d.name + ' — Ải ' + (run.stage + 1) + '/' + d.stages,
      onWin: (b) => {
        Stats.add('kills');
        if (last) Stats.add('bossKills');
        const r = { stones: 6 * D.statScale(gs) * (last ? 3 : 1), items: {} };
        if (Math.random() < 0.5) r.items['yeu_dan_' + d.tier] = 1;
        if (!Player.canBreak()) r.tuvi = Math.floor(Player.cultRate() * 15);
        return Loot.give(r);
      },
      onEnd: (b) => {
        if (b.result === 'win') {
          if (last) Dungeon.complete();
          else {
            run.stage++;
            run.status = 'rest';
            const st = Player.stats();
            G.player.mp = Math.min(st.mp, G.player.mp + st.mp * 0.3);
            G.player.hp = Math.min(st.hp, G.player.hp + st.hp * 0.25);
            if (G.settings.autoBattle) {
              clearTimeout(Dungeon.timer);
              Dungeon.timer = setTimeout(() => { if (G.dungeon.run && G.dungeon.run.status === 'rest' && !Combat.active()) { Combat.clear(); Dungeon.next(); } }, 2200);
            }
          }
        } else {
          Log.add('Thất bại tại ' + d.name + ' (ải ' + (run.stage + 1) + ').', 'bad');
          run.status = 'failed';
        }
        UI.renderIf && UI.renderIf('dungeon', true);
      },
    });
  },

  proceed() {
    const run = G.dungeon.run;
    if (!run || run.status !== 'rest' || Combat.active()) return;
    clearTimeout(Dungeon.timer);
    Combat.clear();
    Dungeon.next();
  },

  leave() {
    clearTimeout(Dungeon.timer);
    if (Combat.active()) return;
    G.dungeon.run = null;
    Combat.clear();
  },

  complete() {
    const run = G.dungeon.run;
    const d = D.dungeonById[run.id];
    Stats.add('dungeons');
    const st = Player.stats();
    const r = { stones: 40 * D.statScale(d.lv), items: {}, gear: [] };
    r.gear.push({ tier: d.tier, q: Gear.rollQuality(st.drop + 80, 2) });
    if (Math.random() < 0.4) r.gear.push({ tier: d.tier, q: Gear.rollQuality(st.drop + 40, 1) });
    r.items[U.pick(D.herbsByTier[d.tier])] = U.randInt(3, 5);
    r.items['yeu_dan_' + d.tier] = U.randInt(2, 4);
    if (Math.random() < 0.35) {
      const books = Object.keys(D.skills).filter((id) => !D.skills[id].sect && D.skills[id].tier >= d.tier && D.skills[id].tier <= d.tier + 1);
      if (books.length) r.items['book_s_' + U.pick(books)] = 1;
    }
    if (Math.random() < 0.15) {
      const techs = Object.keys(D.techniques).filter((id) => !D.techniques[id].sect && D.techniques[id].grade >= 1 && D.techBookTier[D.techniques[id].grade] <= d.tier + 2);
      if (techs.length) r.items['book_t_' + U.pick(techs)] = 1;
    }
    if (Math.random() < 0.25) r.items[d.tier >= 7 ? 'trung_tien_thu' : d.tier >= 4 ? 'trung_than_thu' : 'trung_yeu_thu'] = 1;
    const txt = Loot.give(r);
    run.status = 'done';
    run.loot = txt;
    Log.add('Chinh phục ' + d.name + '! Nhận: ' + txt.join(', '), 'loot');
    UI.toast('Chinh phục ' + d.name + '!', 'good');
    Quests.check();
    Ach.check();
  },
};

const Tower = {
  auto: false,
  floorGs(f) { return Math.min(D.MAX_GS, Math.floor((f - 1) / 2)); },
  floorMult(f) { return f > 91 ? Math.pow(1.06, f - 91) : 1; },
  enemy(f) {
    const gs = Tower.floorGs(f);
    const m = D.mapForGs(gs);
    const boss = f % 10 === 0;
    const mon = boss ? m.boss : m.mons[(f * 7) % m.mons.length];
    return Combat.makeEnemy(mon, gs, { boss, elite: !boss && f % 5 === 0, tier: m.tier, mult: Tower.floorMult(f) });
  },
  reward(f) {
    const gs = Tower.floorGs(f);
    const m = D.mapForGs(gs);
    const r = { stones: 10 * D.statScale(gs) * Tower.floorMult(f) * (f % 10 === 0 ? 5 : 1), items: {} };
    if (f % 5 === 0) { r.items[U.pick(D.herbsByTier[m.tier])] = 3; r.items['yeu_dan_' + m.tier] = 2; }
    if (f % 10 === 0) {
      r.gear = [{ tier: m.tier, q: Gear.rollQuality(Player.stats().drop + 60, 2) }];
      if (Math.random() < 0.5) {
        const books = Object.keys(D.skills).filter((id) => !D.skills[id].sect && Math.abs(D.skills[id].tier - m.tier) <= 1);
        r.items['book_s_' + U.pick(books)] = 1;
      }
      if (f % 30 === 0) r.items[m.tier >= 6 ? 'trung_than_thu' : 'trung_yeu_thu'] = 1;
      if (f % 50 === 0) r.items.tay_linh_dich = 1;
    }
    return r;
  },
  challenge() {
    if (Combat.active() || Explore.busy || Dungeon.busy()) return false;
    Explore.setAuto(false);
    const f = G.tower.best + 1;
    Combat.start(Tower.enemy(f), {
      kind: 'tower', title: 'Thông Thiên Tháp — Tầng ' + f, sim: true,
      onWin: () => {
        G.tower.best = f;
        Stats.add('towerClears');
        Ach.check();
        Quests.check();
        return Loot.give(Tower.reward(f));
      },
      onEnd: (b) => {
        if (b.result !== 'win') Tower.auto = false;
        UI.renderIf && UI.renderIf('tower', true);
        if (Tower.auto) {
          clearTimeout(Tower.timer);
          Tower.timer = setTimeout(() => {
            if (Tower.auto && !Combat.active() && G.ui.tab === 'tower') { Combat.clear(); Tower.challenge(); }
            else Tower.auto = false;
          }, 1500);
        }
      },
    });
    return true;
  },
};

/* Thiên kiếp */
const Trib = {
  s: null,
  timer: null,
  expected(gs) { return D.expected(gs); },

  preview() {
    const p = G.player, next = D.realms[p.realm + 1];
    const E = Trib.expected(Player.gs());
    const st = Player.stats();
    const defF = U.clamp(2 * E.def / (E.def + st.def), 0.4, 1.6);
    const n = next.strikes;
    const total = 1.15 * E.hp * defF * Math.max(0.75, 1 - 0.05 * p.breakFails);
    return { n, total, defF, hp: st.hp };
  },

  start(usePill) {
    const p = G.player, next = D.realms[p.realm + 1];
    if (!next || next.type !== 'trib' || !Player.canBreak() || Combat.active()) return false;
    Explore.setAuto(false);
    const pv = Trib.preview();
    let mult = 1;
    const used = [];
    if (usePill && next.pill && Inv.has(next.pill)) { Inv.remove(next.pill, 1); mult *= 0.75; used.push(D.items[next.pill].name); }
    if (Inv.has('ti_loi_phu')) { Inv.remove('ti_loi_phu', 1); mult *= 0.7; used.push('Tị Lôi Phù'); }
    const n = pv.n;
    const base = pv.total / n * mult;
    const dmgs = [];
    for (let i = 0; i < n; i++) dmgs.push(base * (0.8 + 0.4 * (n > 1 ? i / (n - 1) : 0)));
    const st = Player.stats();
    Trib.s = { i: 0, n, dmgs, hp: st.hp, maxHp: st.hp, log: [], done: false, ok: null, heals: 0, target: p.realm + 1, used };
    Trib.s.log.push('Trước khi độ kiếp, ngươi điều tức đến trạng thái đỉnh phong.' + (used.length ? ' Kích hoạt: ' + used.join(', ') + '.' : ''));
    Trib.s.log.push('Kiếp vân tụ lại, ' + n + ' đạo lôi kiếp sắp giáng xuống!');
    UI.tribOpen && UI.tribOpen(Trib.s);
    clearTimeout(Trib.timer);
    Trib.timer = setTimeout(Trib.strike, 1800);
    Sfx.play('thunder');
    return true;
  },

  heal() {
    const s = Trib.s;
    if (!s || s.done) return false;
    const id = Combat.bestHealItem(false);
    if (!id) return false;
    const e = D.items[id].effect;
    Inv.remove(id, 1);
    s.hp = Math.min(s.maxHp, s.hp + s.maxHp * e.pct);
    s.heals++;
    s.log.push('Nuốt ' + D.items[id].name + ', hồi phục sinh lực.');
    UI.tribUpdate && UI.tribUpdate(s);
    return true;
  },

  strike() {
    const s = Trib.s;
    if (!s || s.done) return;
    const dmg = s.dmgs[s.i];
    if (G.settings.autoHeal && dmg < s.maxHp * 0.95 && s.hp - dmg <= s.maxHp * 0.05 && s.heals < 10) {
      let guard = 0;
      while (s.hp - dmg <= s.maxHp * 0.05 && guard++ < 3 && Trib.heal());
    }
    s.hp -= dmg;
    s.log.push('⚡ Đạo lôi kiếp thứ ' + (s.i + 1) + ' giáng xuống: -' + U.fmt(dmg) + ' sinh lực.');
    s.flash = true;
    Sfx.play('thunder');
    s.i++;
    if (s.hp <= 0) return Trib.end(false);
    if (s.i >= s.n) return Trib.end(true);
    UI.tribUpdate && UI.tribUpdate(s);
    Trib.timer = setTimeout(Trib.strike, 1600);
  },

  end(ok) {
    const s = Trib.s, p = G.player;
    s.done = true; s.ok = ok;
    if (ok) {
      Stats.add('tribs');
      p.tribBonus += 2;
      s.log.push('Lôi kiếp tan biến, thiên địa giáng xuống cam lộ tẩy lễ thân thể! Toàn chỉ số vĩnh viễn +2%.');
      Player.enterRealm(s.target);
    } else {
      const loss = Math.floor(p.tuVi * 0.4);
      p.tuVi -= loss;
      p.hp = 1;
      p.breakFails++;
      p.injuredUntil = Date.now() + 10 * 60 * 1000;
      s.log.push('Thân thể không chịu nổi lôi kiếp! Độ kiếp thất bại, tu vi tổn hao ' + U.fmt(loss) + ', trọng thương 10 phút.');
      Log.add('Độ kiếp thất bại.', 'bad');
      Sfx.play('fail');
    }
    UI.tribUpdate && UI.tribUpdate(s);
    Quests.check();
    Ach.check();
  },
};

/* ===== js/systems/crafting.js ===== */
'use strict';
/* Nghề phụ: luyện đan, luyện khí; động phủ & dược viên */

const Prof = {
  names: { alch: 'Luyện đan', forge: 'Luyện khí' },
  titles: ['Học Đồ', 'Nhất Phẩm', 'Nhị Phẩm', 'Tam Phẩm', 'Tứ Phẩm', 'Ngũ Phẩm', 'Lục Phẩm', 'Thất Phẩm', 'Bát Phẩm', 'Cửu Phẩm', 'Tông Sư'],
  title(lv) { return Prof.titles[Math.min(10, Math.floor(lv / 2))]; },
  addExp(kind, n) {
    const p = G.prof[kind];
    const max = kind === 'alch' ? D.ALCH_MAX : D.FORGE_MAX;
    if (p.lv >= max) { p.exp = 0; return; }
    p.exp += n;
    while (p.lv < max && p.exp >= D.profExp(p.lv)) {
      p.exp -= D.profExp(p.lv);
      p.lv++;
      Log.add(Prof.names[kind] + ' thăng lên cấp ' + p.lv + '!', 'good');
      UI.toast(Prof.names[kind] + ' đạt cấp ' + p.lv, 'good');
    }
    if (p.lv >= max) p.exp = 0;
    Ach.check();
  },
};

const Alchemy = {
  recipe(id) { return D.recipes.find((r) => r.id === id); },
  cost(r) { return Math.floor(5 * D.tierPrice(D.items[r.id].tier)); },
  chance(r) {
    const b = Player.bonuses(), a = Player.attrs();
    const c = r.chance + (G.prof.alch.lv - r.lv) * 0.03 + a.khiVan * 0.005 + (b.alch || 0) / 100;
    return U.clamp(c, 0.05, 0.98);
  },
  maxTimes(r) {
    let n = Infinity;
    for (const id in r.herbs) n = Math.min(n, Math.floor(Inv.count(id) / r.herbs[id]));
    const c = Alchemy.cost(r);
    if (c > 0) n = Math.min(n, Math.floor(G.player.stones / c));
    return Math.max(0, n === Infinity ? 0 : n);
  },
  craft(id, times = 1) {
    const r = Alchemy.recipe(id);
    if (!r) return { ok: false, msg: 'Không có đan phương.' };
    if (G.prof.alch.lv < r.lv) return { ok: false, msg: 'Cần luyện đan cấp ' + r.lv + '.' };
    times = Math.min(times, Alchemy.maxTimes(r));
    if (times <= 0) return { ok: false, msg: 'Không đủ nguyên liệu hoặc linh thạch.' };
    let made = 0, fails = 0;
    for (let i = 0; i < times; i++) {
      Inv.removeAll(r.herbs);
      Player.spendStones(Alchemy.cost(r));
      const exp = Math.floor(8 * Math.pow(r.lv, 1.2));
      if (Math.random() < Alchemy.chance(r)) {
        const n = r.out + (Math.random() < 0.15 ? 1 : 0);
        Inv.add(r.id, n);
        made += n;
        Stats.add('pillsMade');
        Prof.addExp('alch', exp);
      } else {
        fails++;
        Prof.addExp('alch', Math.floor(exp * 0.4));
      }
    }
    Quests.check();
    Ach.check();
    Sfx.play(made ? 'up' : 'fail');
    const it = D.items[r.id];
    const msg = made ? 'Luyện thành ' + made + ' ' + it.name + (fails ? ' (' + fails + ' lò thất bại)' : '') + '.' : 'Tất cả ' + fails + ' lò đều thất bại, đan dược hóa thành tro.';
    if (made) Log.add('Luyện đan: ' + msg, 'good');
    return { ok: true, made, fails, msg };
  },
};

const Forge = {
  maxTier() {
    return Math.max(1, Math.min(10, Math.max(1, G.player.realm), 1 + Math.floor(G.prof.forge.lv / 2)));
  },
  cost(tier) {
    return { ore: D.oreByTier[tier], oreN: 3, core: 'yeu_dan_' + tier, coreN: 1, stones: Math.floor(30 * D.tierPrice(tier)) };
  },
  qBonus() {
    const b = Player.bonuses(), a = Player.attrs();
    return G.prof.forge.lv * 3 + (b.forge || 0) + a.khiVan * 1.5;
  },
  can(tier) {
    const c = Forge.cost(tier);
    if (tier > Forge.maxTier()) return 'Chưa đủ cảnh giới hoặc cấp luyện khí.';
    if (!Inv.has(c.ore, c.oreN)) return 'Thiếu ' + D.items[c.ore].name + '.';
    if (!Inv.has(c.core, c.coreN)) return 'Thiếu ' + D.items[c.core].name + '.';
    if (G.player.stones < c.stones) return 'Không đủ linh thạch.';
    if (G.gear.length >= Gear.MAX) return 'Túi trang bị đã đầy.';
    return true;
  },
  craft(slot, tier) {
    const ok = Forge.can(tier);
    if (ok !== true) return { ok: false, msg: ok };
    const c = Forge.cost(tier);
    Inv.remove(c.ore, c.oreN);
    Inv.remove(c.core, c.coreN);
    Player.spendStones(c.stones);
    if (slot === 'random') slot = Gear.randomSlot();
    const q = Gear.rollQuality(Forge.qBonus());
    const g = Gear.create(slot, tier, q);
    Stats.add('forged');
    Prof.addExp('forge', Math.floor(10 * Math.pow(tier, 1.3) * (1 + q * 0.3)));
    Quests.check();
    Sfx.play(q >= 3 ? 'realm' : 'up');
    Log.add('Luyện khí: ' + Gear.name(g) + ' (' + D.qualities[q].name + ').', q >= 3 ? 'good' : '');
    return { ok: true, g };
  },
};

const Cave = {
  MAX: 10,
  mult() { return 1 + 0.15 * (G.cave.lv - 1); },
  slots(lv) { return Math.min(7, 2 + Math.floor((lv - 1) / 2)); },
  growMult() { return 1 - 0.05 * (G.cave.lv - 1); },
  names: ['Thảo Lư', 'Thạch Động', 'Linh Động', 'Tiểu Động Phủ', 'Động Phủ', 'Linh Sơn Động Phủ', 'Tụ Linh Động Phủ', 'Động Thiên', 'Tiểu Động Thiên', 'Động Thiên Phúc Địa'],
  name() { return Cave.names[G.cave.lv - 1]; },
  upgradeCost() {
    const lv = G.cave.lv;
    return { stones: Math.floor(150 * Math.pow(3.2, lv - 1)), realm: lv };
  },
  canUpgrade() {
    if (G.cave.lv >= Cave.MAX) return 'Đã đạt cấp tối đa.';
    const c = Cave.upgradeCost();
    if (G.player.realm < c.realm) return 'Cần đạt ' + D.realms[c.realm].name + '.';
    if (G.player.stones < c.stones) return 'Không đủ linh thạch.';
    return true;
  },
  upgrade() {
    const ok = Cave.canUpgrade();
    if (ok !== true) return { ok: false, msg: ok };
    Player.spendStones(Cave.upgradeCost().stones);
    G.cave.lv++;
    while (G.cave.garden.length < Cave.slots(G.cave.lv)) G.cave.garden.push(null);
    Log.add('Động phủ nâng cấp thành ' + Cave.name() + ' (cấp ' + G.cave.lv + ').', 'good');
    Quests.check();
    Sfx.play('up');
    return { ok: true, msg: 'Động phủ đạt cấp ' + G.cave.lv + '.' };
  },
  plant(i, herb) {
    if (G.cave.garden[i] || !Inv.has(herb)) return false;
    const it = D.items[herb];
    Inv.remove(herb, 1);
    const now = Date.now();
    G.cave.garden[i] = { herb, at: now, ready: now + it.grow * 1000 * Cave.growMult() };
    return true;
  },
  ready(i) { const g = G.cave.garden[i]; return g && g.ready <= Date.now(); },
  harvest(i) {
    const g = G.cave.garden[i];
    if (!g || g.ready > Date.now()) return 0;
    const n = U.randInt(2, 4) + Math.floor(G.cave.lv / 3);
    Inv.add(g.herb, n);
    G.cave.garden[i] = null;
    Stats.add('harvests');
    return n;
  },
  harvestAll(replant) {
    let total = 0;
    const out = [];
    G.cave.garden.forEach((g, i) => {
      if (g && g.ready <= Date.now()) {
        const herb = g.herb;
        const n = Cave.harvest(i);
        total += n;
        out.push(D.items[herb].name + ' ×' + n);
        if (replant && Inv.has(herb)) Cave.plant(i, herb);
      }
    });
    return { total, out };
  },
};

/* ===== js/systems/social.js ===== */
'use strict';
/* Linh thú, tông môn, phường thị */

const Pets = {
  def(pet) { return D.petById[pet.id]; },
  active() { return G.pets.find((p) => p.uid === G.activePet) || null; },
  cap() { return Math.min(D.MAX_GS, Player.gs() + 3); },
  passive(pet) {
    const d = Pets.def(pet), out = {};
    for (const k in d.passive) out[k] = d.passive[k] * (pet.lv + 5);
    return out;
  },
  atk(pet) {
    const d = Pets.def(pet);
    return Math.floor(12 * D.statScale(pet.lv) * 1.4 * D.petRarityMult[d.rarity]);
  },
  fighter(pet) {
    const d = Pets.def(pet);
    return { name: d.name, icon: d.icon, el: d.el, atk: Pets.atk(pet), turn: 0 };
  },
  addExp(pet, n) {
    pet.exp += n;
    let ups = 0;
    while (pet.lv < Pets.cap() && pet.exp >= D.petExpReq(pet.lv)) {
      pet.exp -= D.petExpReq(pet.lv);
      pet.lv++;
      ups++;
    }
    if (pet.lv >= Pets.cap()) pet.exp = Math.min(pet.exp, D.petExpReq(pet.lv) - 1);
    if (ups) Log.add(Pets.def(pet).name + ' thăng lên cấp ' + pet.lv + '.', 'good');
    return ups;
  },
  feed(uid, coreId, n = 1) {
    const pet = G.pets.find((p) => p.uid === uid);
    if (!pet) return { ok: false, msg: 'Không tìm thấy linh thú.' };
    if (pet.lv >= Pets.cap()) return { ok: false, msg: 'Linh thú đã đạt giới hạn cấp (cảnh giới chủ nhân +3).' };
    n = Math.min(n, Inv.count(coreId));
    if (n <= 0) return { ok: false, msg: 'Không có yêu đan.' };
    const t = D.items[coreId].tier;
    Inv.remove(coreId, n);
    const ups = Pets.addExp(pet, D.coreExp(t) * n);
    Stats.add('petFeeds', n);
    Quests.check();
    return { ok: true, msg: Pets.def(pet).name + ' nuốt ' + n + ' ' + D.items[coreId].name + (ups ? ', lên ' + ups + ' cấp!' : '.') };
  },
  gainBattleExp(enemyGs) {
    const pet = Pets.active();
    if (!pet || enemyGs < pet.lv - 3) return;
    Pets.addExp(pet, Math.ceil(D.petExpReq(pet.lv) * 0.05));
  },
  placeEgg(eggId) {
    const i = G.nests.findIndex((n) => !n);
    if (i < 0) return { ok: false, msg: 'Ổ ấp đã đầy.' };
    if (!Inv.has(eggId)) return { ok: false, msg: 'Không có trứng.' };
    const it = D.items[eggId];
    Inv.remove(eggId, 1);
    const now = Date.now();
    G.nests[i] = { egg: eggId, at: now, ready: now + it.hatch * 1000 };
    return { ok: true, msg: 'Đã đặt ' + it.name + ' vào ổ ấp. Nở sau ' + U.time(it.hatch) + '.' };
  },
  hatch(i) {
    const n = G.nests[i];
    if (!n || n.ready > Date.now()) return null;
    if (G.pets.length >= D.PET_MAX) return { err: 'Linh thú viên đã đầy (' + D.PET_MAX + ').' };
    const it = D.items[n.egg];
    const [lo, hi] = it.rarity;
    const opts = [];
    for (let r = lo; r <= hi; r++) opts.push({ r, w: Math.pow(0.35, r - lo) * (1 + Player.attrs().khiVan * 0.02 * (r - lo)) });
    const rar = U.weighted(opts).r;
    const sp = U.pick(D.pets.filter((p) => p.rarity === rar));
    const pet = { uid: U.uid(), id: sp.id, lv: 1, exp: 0 };
    G.pets.push(pet);
    G.nests[i] = null;
    if (!G.activePet) G.activePet = pet.uid;
    Stats.add('pets');
    Log.add('Trứng nở ra ' + sp.name + ' (' + '★'.repeat(sp.rarity) + ')!', 'good');
    Quests.check();
    Ach.check();
    Sfx.play('realm');
    return pet;
  },
  release(uid) {
    const pet = G.pets.find((p) => p.uid === uid);
    if (!pet) return null;
    G.pets = G.pets.filter((p) => p.uid !== uid);
    if (G.activePet === uid) G.activePet = G.pets[0] ? G.pets[0].uid : null;
    const t = Math.max(1, Math.min(10, D.gsToRS(pet.lv).r));
    const n = 1 + Math.floor(pet.lv / 4) + Pets.def(pet).rarity;
    Inv.add('yeu_dan_' + t, n);
    return { t, n };
  },
};

const Sect = {
  data() { return G.sect ? D.sectById[G.sect.id] : null; },
  rank() { return D.sectRanks[G.sect.rank]; },
  canJoin(s) {
    if (G.sect) return 'Đã có tông môn.';
    if (Player.gs() < D.SECT_JOIN_GS) return 'Cần đạt ' + D.gsName(D.SECT_JOIN_GS) + '.';
    const k = G.player.karma;
    if (s.align === 'chinh' && k < -30) return 'Thiện duyên quá thấp, chính đạo không thu nhận.';
    if (s.align === 'ma' && k > 30) return 'Ngươi quá "chính nghĩa", ma đạo không tin tưởng.';
    return true;
  },
  join(id) {
    const s = D.sectById[id];
    if (!s || Sect.canJoin(s) !== true) return false;
    G.sect = { id, contrib: 0, total: 0, rank: 0, missions: [], salary: '', spar: { date: '', n: 0 } };
    for (let i = 0; i < 3; i++) G.sect.missions.push(Sect.genMission());
    Log.add('Bái nhập ' + s.name + ', trở thành Ngoại Môn Đệ Tử.', 'good');
    Quests.check();
    Ach.check();
    return true;
  },
  leave() {
    if (!G.sect) return;
    Log.add('Rời khỏi ' + Sect.data().name + '.', 'bad');
    G.sect = null;
  },
  missionContrib() { return Math.floor(25 * Math.pow(1.6, G.player.realm)); },
  addContrib(n) {
    if (!G.sect) return;
    G.sect.contrib += n;
    G.sect.total += n;
    Sect.checkRank();
  },
  canPromote() {
    const s = G.sect;
    if (!s || s.rank >= D.sectRanks.length - 1) return false;
    const nx = D.sectRanks[s.rank + 1];
    return s.total >= nx.total && Player.gs() >= nx.gs;
  },
  checkRank() {
    while (Sect.canPromote()) {
      G.sect.rank++;
      Log.add('Thăng cấp ' + Sect.rank().name + ' của ' + Sect.data().name + '!', 'good');
      UI.toast('Thăng cấp tông môn: ' + Sect.rank().name, 'good');
      Ach.check();
    }
  },
  genMission() {
    const r = Math.max(1, G.player.realm);
    const tier = Math.min(10, r);
    const types = [
      { t: 'kill', w: 3 }, { t: 'explore', w: 2 }, { t: 'herb', w: 2 }, { t: 'core', w: 2 },
      { t: 'donate', w: 1 }, { t: 'alch', w: 1 }, { t: 'boss', w: 1 },
    ];
    const t = U.weighted(types).t;
    const c = Sect.missionContrib();
    const m = { t, reward: { contrib: c, stones: Math.floor(8 * D.statScale(Player.gs())) } };
    switch (t) {
      case 'kill': m.k = 'kills'; m.n = U.randInt(8, 16); m.name = 'Tiêu diệt ' + m.n + ' yêu thú'; break;
      case 'explore': m.k = 'explores'; m.n = U.randInt(12, 25); m.name = 'Tuần tra (thám hiểm ' + m.n + ' lần)'; break;
      case 'alch': m.k = 'pillsMade'; m.n = U.randInt(1, 3); m.name = 'Luyện thành ' + m.n + ' lò đan'; m.reward.contrib = Math.floor(c * 1.2); break;
      case 'boss': m.k = 'bossKills'; m.n = 1; m.name = 'Trảm 1 thủ lĩnh yêu thú'; m.reward.contrib = Math.floor(c * 1.6); break;
      case 'herb': m.item = U.pick(D.herbsByTier[tier]); m.n = U.randInt(3, 6); m.name = 'Nộp ' + m.n + ' ' + D.items[m.item].name; break;
      case 'core': m.item = 'yeu_dan_' + tier; m.n = U.randInt(2, 4); m.name = 'Nộp ' + m.n + ' ' + D.items[m.item].name; m.reward.contrib = Math.floor(c * 1.2); break;
      case 'donate': m.cost = Math.floor(25 * D.statScale(Player.gs())); m.n = 1; m.name = 'Quyên góp ' + U.fmt(m.cost) + ' linh thạch'; m.reward.stones = 0; m.reward.contrib = Math.floor(c * 0.9); break;
    }
    if (m.k) m.base = Stats.get(m.k);
    return m;
  },
  progress(m) {
    if (m.k) return Math.min(m.n, Stats.get(m.k) - m.base);
    if (m.item) return Math.min(m.n, Inv.count(m.item));
    if (m.t === 'donate') return G.player.stones >= m.cost ? 1 : 0;
    return 0;
  },
  claim(i) {
    const m = G.sect && G.sect.missions[i];
    if (!m || Sect.progress(m) < m.n) return null;
    if (m.item) Inv.remove(m.item, m.n);
    if (m.t === 'donate' && !Player.spendStones(m.cost)) return null;
    const txt = Loot.give(m.reward);
    Stats.add('sectMissions');
    G.sect.missions[i] = Sect.genMission();
    Quests.check();
    return txt;
  },
  rerollCost() { return Math.floor(4 * D.statScale(Player.gs())); },
  reroll(i) {
    if (!G.sect || !Player.spendStones(Sect.rerollCost())) return false;
    G.sect.missions[i] = Sect.genMission();
    return true;
  },
  salaryReady() { return G.sect && G.sect.salary !== U.todayKey(); },
  claimSalary() {
    if (!Sect.salaryReady()) return null;
    G.sect.salary = U.todayKey();
    const r = Sect.rank();
    return Loot.give({ stones: r.salary * D.statScale(Player.gs()), contrib: Math.floor(Sect.missionContrib() * 0.3) });
  },
  sparLeft() {
    const sp = G.sect.spar, t = U.todayKey();
    if (sp.date !== t) { sp.date = t; sp.n = 0; }
    return D.SPAR_DAILY - sp.n;
  },
  spar() {
    if (!G.sect || Sect.sparLeft() <= 0 || Combat.active() || Explore.busy || Dungeon.busy()) return false;
    Explore.setAuto(false);
    G.sect.spar.n++;
    const gs = Math.min(D.MAX_GS, Player.gs() + (G.sect.spar.n >= 4 ? 1 : 0));
    const en = Combat.makeEnemy('dong_mon', gs, { tier: Math.max(1, G.player.realm) });
    en.name = U.pick(['Lý', 'Trương', 'Vương', 'Triệu', 'Lâm', 'Hàn', 'Tô', 'Diệp']) + ' ' + U.pick(['Sư Huynh', 'Sư Tỷ', 'Sư Đệ', 'Sư Muội']);
    Combat.start(en, {
      kind: 'sect', title: 'Luận Võ Đài — ' + Sect.data().name, sim: true,
      onWin: () => Loot.give({ contrib: Math.floor(Sect.missionContrib() * 0.6), stones: 6 * D.statScale(gs) }),
      onEnd: () => UI.renderIf && UI.renderIf('sect', true),
    });
    return true;
  },
  shopItems() {
    const s = Sect.data();
    return D.sectShop.map((e) => {
      let id = e.item;
      if (id === '@tech') id = 'book_t_' + s.tech;
      if (id === '@skill') id = 'book_s_' + s.skill;
      return { id, cost: e.cost, rank: e.rank };
    });
  },
  buy(idx) {
    const e = Sect.shopItems()[idx];
    if (!e || !G.sect) return { ok: false, msg: 'Không có vật phẩm.' };
    if (G.sect.rank < e.rank) return { ok: false, msg: 'Cần cấp bậc ' + D.sectRanks[e.rank].name + '.' };
    if (G.sect.contrib < e.cost) return { ok: false, msg: 'Không đủ cống hiến.' };
    G.sect.contrib -= e.cost;
    Inv.add(e.id, 1);
    return { ok: true, msg: 'Đổi được ' + D.items[e.id].name + '.' };
  },
  onKill() { /* tiến độ nhiệm vụ tính theo thống kê */ },
};

const Market = {
  REFRESH_MS: 20 * 60 * 1000,
  fixedList() {
    const r = Math.max(1, G.player.realm);
    const list = ['hoi_khi_dan', 'hoi_linh_dan', 'tri_thuong_dan', 'tu_khi_dan'];
    if (r >= 1) list.push('boi_nguyen_dan', 'giai_doc_dan', 'cuong_bao_dan', 'kim_cang_dan', 'bi_canh_lenh');
    if (r >= 2) list.push('dai_hoan_dan', 'ngung_nguyen_dan');
    if (r >= 3) list.push('ti_loi_phu', 'tho_nguyen_dan');
    if (r >= 4) list.push('thai_hu_dan');
    if (r >= 5) list.push('cuu_chuyen_dan');
    if (r >= 6) list.push('hon_nguyen_dan');
    if (r >= 8) list.push('tien_linh_dan');
    if (r >= 10) list.push('hong_mong_dan');
    for (let t = 1; t <= Math.min(10, r); t++) {
      list.push(...D.herbsByTier[t], D.oreByTier[t], 'yeu_dan_' + t);
    }
    list.push('trung_linh_thu');
    for (const id in D.techniques) if (D.techniques[id].grade === 1) list.push('book_t_' + id);
    for (const id in D.skills) if (!D.skills[id].sect && D.skills[id].tier <= Math.min(3, r)) list.push('book_s_' + id);
    return list.filter((id) => D.items[id]);
  },
  refresh(force) {
    const m = G.market;
    if (!force && m.refreshAt > Date.now()) return false;
    const r = Math.max(1, G.player.realm);
    const tier = Math.min(10, r);
    const stock = [];
    for (let i = 0; i < 6; i++) {
      const roll = Math.random();
      if (roll < 0.35) {
        const q = Gear.rollQuality(80, 2);
        const g = { uid: U.uid(), slot: Gear.randomSlot(), tier, q, enh: 0, affixes: Gear.rollAffixes(q), lock: false };
        stock.push({ kind: 'gear', g, price: Math.floor(Gear.value(g) * 3), sold: false });
      } else if (roll < 0.6) {
        const books = Object.keys(D.skills).filter((id) => !D.skills[id].sect && D.skills[id].tier >= Math.max(1, tier - 1) && D.skills[id].tier <= tier + 1);
        const id = 'book_s_' + U.pick(books);
        stock.push({ kind: 'item', id, n: 1, price: Math.floor(Inv.buyPrice(id) * 1.5), sold: false });
      } else if (roll < 0.72) {
        const techs = Object.keys(D.techniques).filter((id) => !D.techniques[id].sect && D.techniques[id].grade >= 1 && D.techBookTier[D.techniques[id].grade] <= tier + 2);
        const id = 'book_t_' + U.pick(techs);
        stock.push({ kind: 'item', id, n: 1, price: Math.floor(Inv.buyPrice(id) * 1.5), sold: false });
      } else {
        const pool = ['tay_tuy_dan', 'khai_tri_dan', 'duong_hon_dan', 'tho_nguyen_dan', 'ngo_dao_dan', 'trung_yeu_thu', 'tui_linh_thach'];
        if (tier >= 4) pool.push('trung_than_thu', 'tao_hoa_dan');
        if (tier >= 6) pool.push('tay_linh_dich');
        if (tier >= 8) pool.push('trung_tien_thu');
        const id = U.pick(pool);
        const scale = Math.max(1, D.tierPrice(tier) / D.tierPrice(D.items[id].tier));
        stock.push({ kind: 'item', id, n: 1, price: Math.floor(Inv.buyPrice(id) * 2 * Math.sqrt(scale)), sold: false });
      }
    }
    m.stock = stock;
    m.refreshAt = Date.now() + Market.REFRESH_MS;
    return true;
  },
  refreshCost() { return Math.floor(30 * D.tierPrice(Math.max(1, G.player.realm))); },
  manualRefresh() {
    if (!Player.spendStones(Market.refreshCost())) return false;
    Market.refresh(true);
    return true;
  },
  buy(id, n = 1) {
    const price = Inv.buyPrice(id) * n;
    if (!Player.spendStones(price)) return { ok: false, msg: 'Không đủ linh thạch.' };
    Inv.add(id, n);
    Sfx.play('coin');
    return { ok: true, msg: 'Mua ' + n + ' ' + D.items[id].name + '.' };
  },
  buyStock(i) {
    const e = G.market.stock[i];
    if (!e || e.sold) return { ok: false, msg: 'Hàng đã bán.' };
    if (e.kind === 'gear' && G.gear.length >= Gear.MAX) return { ok: false, msg: 'Túi trang bị đã đầy.' };
    if (!Player.spendStones(e.price)) return { ok: false, msg: 'Không đủ linh thạch.' };
    e.sold = true;
    if (e.kind === 'gear') G.gear.push(e.g);
    else Inv.add(e.id, e.n);
    Sfx.play('coin');
    return { ok: true, msg: 'Mua thành công.' };
  },
};

/* ===== js/systems/progress.js ===== */
'use strict';
/* Nhiệm vụ, thành tựu, luân hồi */

const Quests = {
  initMain() { G.quests.main = 0; G.quests.notified = -1; Quests.activateMain(); },
  cur() { return D.mainQuests[G.quests.main] || null; },
  activateMain() {
    const q = Quests.cur();
    if (q && q.t === 'stat') G.quests.mainBase = Stats.get(q.k);
  },
  progress(q, base) {
    switch (q.t) {
      case 'gs': return [Player.gs(), q.v];
      case 'stat': return [Math.max(0, Stats.get(q.k) - (base || 0)), q.v];
      case 'sect': return [G.sect ? 1 : 0, 1];
      case 'cave': return [G.cave.lv, q.v];
      case 'pets': return [G.pets.length, q.v];
      case 'tower': return [G.tower.best, q.v];
      case 'techLv': return [G.player.techs[G.player.tech] || 1, q.v];
      case 'skillEq': return [G.player.eq.length, q.v];
    }
    return [0, 1];
  },
  mainDone() {
    const q = Quests.cur();
    if (!q) return false;
    const [c, t] = Quests.progress(q, G.quests.mainBase);
    return c >= t;
  },
  claimMain() {
    const q = Quests.cur();
    if (!q || !Quests.mainDone()) return null;
    const txt = Loot.give(q.reward);
    Log.add('Hoàn thành nhiệm vụ: ' + q.name + '.', 'good');
    G.quests.main++;
    Quests.activateMain();
    Sfx.play('coin');
    if (!Quests.cur()) Log.add('Ngươi đã đi hết tiên đồ chính tuyến. Đạo vô cùng tận!', 'realm');
    return txt;
  },

  ensureDaily() {
    const t = U.todayKey();
    const d = G.quests.daily;
    if (d && d.date === t) return d;
    const picks = U.shuffle(D.dailyPool).slice(0, D.DAILY_COUNT);
    const base = {};
    for (const p of picks) base[p.k] = Stats.get(p.k);
    G.quests.daily = { date: t, list: picks.map((p) => ({ k: p.k, v: p.v, name: p.name, claimed: false })), base, points: 0, chests: [] };
    return G.quests.daily;
  },
  dailyProgress(task) {
    const d = Quests.ensureDaily();
    return Math.min(task.v, Stats.get(task.k) - (d.base[task.k] || 0));
  },
  claimDaily(i) {
    const d = Quests.ensureDaily();
    const task = d.list[i];
    if (!task || task.claimed || Quests.dailyProgress(task) < task.v) return null;
    task.claimed = true;
    d.points += 20;
    return Loot.give({ stones: 15 * D.statScale(Player.gs()), insight: Math.floor(10 * (1 + G.player.realm)) });
  },
  claimChest(j) {
    const d = Quests.ensureDaily();
    if (d.chests.includes(j) || d.points < D.dailyChests[j]) return null;
    d.chests.push(j);
    const s = D.statScale(Player.gs());
    const r = [
      { stones: 50 * s, items: { hoi_khi_dan: 3, hoi_linh_dan: 2 } },
      { insight: Math.floor(50 * (1 + G.player.realm)), items: { boi_nguyen_dan: 1, tui_linh_thach: 1 } },
      { stones: 80 * s, items: { bi_canh_lenh: 1, tui_linh_thach: 2, [Math.random() < 0.3 ? 'trung_yeu_thu' : 'trung_linh_thu']: 1 } },
    ][j];
    return Loot.give(r);
  },

  /* Điểm danh 7 ngày */
  loginState() {
    const L = G.quests.login, t = U.todayKey();
    if (L.last !== t) {
      const y = new Date(Date.now() - 86400000);
      const yk = y.getFullYear() + '-' + String(y.getMonth() + 1).padStart(2, '0') + '-' + String(y.getDate()).padStart(2, '0');
      L.streak = L.last === yk ? (L.streak % 7) + 1 : 1;
      L.last = t;
    }
    return L;
  },
  loginReady() { const L = Quests.loginState(); return L.claimed !== L.last; },
  claimLogin() {
    const L = Quests.loginState();
    if (L.claimed === L.last) return null;
    L.claimed = L.last;
    const day = D.loginRewards[(L.streak - 1) % 7];
    const s = D.statScale(Player.gs());
    const r = { items: Object.assign({}, day.items || {}) };
    if (day.stones) r.stones = day.stones * s;
    if (day.insight) r.insight = Math.floor(day.insight * (1 + G.player.realm));
    if (day.gear) r.gear = [{ tier: Math.max(1, G.player.realm), q: day.gear }];
    return Loot.give(r);
  },

  check() {
    if (!G || !G.player) return;
    if (Quests.mainDone() && G.quests.notified !== G.quests.main) {
      G.quests.notified = G.quests.main;
      UI.toast('Nhiệm vụ hoàn thành: ' + Quests.cur().name + ' — vào Nhiệm Vụ nhận thưởng', 'quest');
    }
  },
  onStat() { /* tiến độ được tính lại khi hiển thị */ },
  badge() {
    let n = 0;
    if (Quests.mainDone()) n++;
    const d = Quests.ensureDaily();
    d.list.forEach((t) => { if (!t.claimed && Quests.dailyProgress(t) >= t.v) n++; });
    D.dailyChests.forEach((p, j) => { if (d.points >= p && !d.chests.includes(j)) n++; });
    if (Quests.loginReady()) n++;
    return n;
  },
};

const Ach = {
  test(a) {
    const c = a.c;
    switch (c[0]) {
      case 'stat': return Stats.get(c[1]) >= c[2];
      case 'realm': return G.player.realm >= c[1];
      case 'alchLv': return G.prof.alch.lv >= c[1];
      case 'enh': return G.gear.some((g) => g.enh >= c[1]);
      case 'tower': return G.tower.best >= c[1];
      case 'pets': return G.pets.length >= c[1];
      case 'petRarity': return G.pets.some((p) => D.petById[p.id].rarity >= c[1]);
      case 'sect': return !!G.sect && G.sect.rank >= c[1];
      case 'reinc': return G.reinc.count >= c[1];
      case 'karma': return c[1] > 0 ? G.player.karma >= c[1] : G.player.karma <= c[1];
      case 'root': return Player.rootType().grade >= c[1];
      case 'techLv': return Object.values(G.player.techs).some((lv) => lv >= c[1]);
    }
    return false;
  },
  check() {
    if (!G || !G.player) return;
    for (const a of D.achievements) {
      if (G.ach[a.id]) continue;
      if (Ach.test(a)) {
        G.ach[a.id] = Date.now();
        Log.add('🏆 Đạt thành tựu: ' + a.name + ' (' + Object.keys(a.b).map((k) => D.fmtBonus(k, a.b[k])).join(', ') + ')', 'ach');
        UI.toast('🏆 Thành tựu: ' + a.name, 'ach');
      }
    }
  },
  count() { return Object.keys(G.ach).length; },
};

const Reinc = {
  lv(id) { return (G && G.reinc && G.reinc.talents[id]) || 0; },
  pointsFor() {
    const gs = Player.gs();
    let pts = Math.floor(Math.pow(gs, 1.6) / 6) + Math.floor(Ach.count() / 3);
    if (G.player.realm >= 10) pts += 30;
    return Math.max(1, pts);
  },
  canVoluntary() { return Player.gs() >= 10; },
  upgrade(id) {
    const t = D.reincTalents.find((x) => x.id === id);
    const lv = Reinc.lv(id);
    if (!t || lv >= t.max) return false;
    const cost = D.reincCost(lv);
    if (G.reinc.points < cost) return false;
    G.reinc.points -= cost;
    G.reinc.talents[id] = lv + 1;
    return true;
  },
  /** reason: 'death' | 'voluntary' */
  perform(reason) {
    const pts = Reinc.pointsFor();
    const reinc = U.clone(G.reinc);
    reinc.count++;
    reinc.points += pts;
    reinc.totalPoints = (reinc.totalPoints || 0) + pts;
    G.stats.reincs = (G.stats.reincs || 0) + 1;
    const keep = { ach: G.ach, stats: G.stats, reinc, settings: G.settings, lastName: G.player.name, reason, pts };
    Combat.abort();
    Explore.setAuto(false);
    clearTimeout(Explore.timer);
    Explore.busy = false;
    Tower.auto = false;
    /* Lưu trạng thái chờ chuyển thế để tải lại trang không mất điểm */
    const s = Save.blank();
    s.ach = keep.ach; s.stats = keep.stats; s.reinc = keep.reinc; s.settings = keep.settings;
    s.pending = { lastName: keep.lastName, reason, pts };
    G = s;
    Save.save();
    UI.showCreation(keep);
  },
};

'use strict';
/* Âm thanh tổng hợp bằng WebAudio (không cần tệp âm thanh) */

const Sfx = {
  ctx: null,
  last: {},
  init() {
    if (Sfx.ctx) return Sfx.ctx;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) Sfx.ctx = new AC();
    } catch (e) { Sfx.ctx = null; }
    return Sfx.ctx;
  },
  tone(freq, dur, type = 'sine', vol = 0.06, when = 0, slide = 0) {
    const c = Sfx.ctx;
    const t = c.currentTime + when;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol = 0.08, freq = 800) {
    const c = Sfx.ctx;
    const len = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = c.createBufferSource();
    src.buffer = buf;
    const f = c.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = freq;
    const g = c.createGain();
    g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(c.destination);
    src.start();
  },
  play(name) {
    if (!G || !G.settings || !G.settings.sound) return;
    if (!Sfx.ctx || Sfx.ctx.state !== 'running') return;
    const now = performance.now();
    if (now - (Sfx.last[name] || 0) < 70) return;
    Sfx.last[name] = now;
    try {
      switch (name) {
        case 'hit': Sfx.noise(0.08, 0.05, 1400); break;
        case 'crit': Sfx.noise(0.12, 0.08, 2400); Sfx.tone(880, 0.1, 'square', 0.025); break;
        case 'coin': Sfx.tone(988, 0.08, 'triangle', 0.05); Sfx.tone(1319, 0.12, 'triangle', 0.05, 0.07); break;
        case 'up': [523, 659, 784].forEach((f, i) => Sfx.tone(f, 0.18, 'triangle', 0.05, i * 0.07)); break;
        case 'realm': [392, 523, 659, 784, 1047].forEach((f, i) => Sfx.tone(f, 0.35, 'sine', 0.06, i * 0.09)); break;
        case 'win': [659, 784, 988].forEach((f, i) => Sfx.tone(f, 0.16, 'triangle', 0.04, i * 0.06)); break;
        case 'fail': Sfx.tone(330, 0.35, 'sawtooth', 0.035, 0, 0.5); break;
        case 'thunder': Sfx.noise(0.9, 0.18, 500); Sfx.tone(60, 0.6, 'sawtooth', 0.05, 0, 0.6); break;
        case 'click': Sfx.tone(660, 0.04, 'square', 0.02); break;
      }
    } catch (e) { /* bỏ qua lỗi âm thanh */ }
  },
  unlock() {
    const c = Sfx.init();
    if (c && c.state === 'suspended') c.resume().catch(() => {});
  },
};

'use strict';
/* Khung giao diện: điều hướng, thanh bên, hộp thoại, thông báo */

const A = {}; /* Bảng hành động: data-act="ten" data-arg="..." */

  tabs: {},
  groups: [
    { name: 'Tu Hành', tabs: ['cultivate', 'character', 'technique', 'inventory'] },
    { name: 'Thế Giới', tabs: ['explore', 'dungeon', 'tower'] },
    { name: 'Nghề Tu', tabs: ['alchemy', 'forge', 'cave', 'pets'] },
    { name: 'Giang Hồ', tabs: ['sect', 'market', 'quests', 'achievements'] },
    { name: 'Khác', tabs: ['reinc', 'settings'] },
  ],

  init() {
    document.addEventListener('click', UI.onClick);
    document.addEventListener('change', (e) => {
      const el = e.target.closest('[data-change]');

  onClick(e) {
    Sfx.unlock();

    const fn = A[el.dataset.act];
    if (!fn) return;
    if (el.tagName !== 'INPUT' && el.tagName !== 'LABEL') e.preventDefault();
    try { fn(el.dataset.arg, el, e); } catch (err) { console.error(err); UI.toast('Lỗi: ' + err.message, 'bad'); }
  },

  /* ---------- Khung chính ---------- */
  mount() {
    document.getElementById('app').innerHTML =

        '<div class="brand"><span class="seal">道</span><span class="brand-name">' + D.GAME_NAME + '</span></div>' +
        '<div class="top-res" id="top-res"></div>' +
        '<div class="top-actions">' +
          '<button class="icon-btn" id="battle-ind" data-act="gotoBattle" hidden title="Đang chiến đấu">⚔️</button>' +

      '</header>' +

        '<main class="main" id="main" tabindex="-1"></main>' +
        '<section class="logpanel" id="logpanel"><div class="lp-head"><span>Nhật Ký Tu Hành</span><button class="icon-btn sm" data-act="toggleLog">✕</button></div><div class="lp-body" id="lp-body"></div></section>' +

    if (!G || !G.player) return;
    if (!document.getElementById('main')) UI.mount();
    UI.renderSide();
    UI.renderNav();
    UI.renderMain();

  renderMain(keepScroll) {
    const main = document.getElementById('main');
    if (!main) return;
    const tab = UI.tabs[G.ui.tab] || UI.tabs.cultivate;
    const y = main.scrollTop;
    const lock = tab.locked && tab.locked();
    main.innerHTML = '<div class="tab tab-' + G.ui.tab + '">' + (lock ? UI.lockedHTML(tab, lock) : tab.render()) + '</div>';
    if (keepScroll) main.scrollTop = y;
    if (!lock && tab.mounted) tab.mounted();

  renderIf(tab, keepScroll) {
    if (G && G.ui.tab === tab && document.getElementById('main') && !UI.modalOpen()) UI.renderMain(keepScroll);

  lockedHTML(tab, msg) {
    return '<div class="locked"><div class="locked-icon">🔒</div><h2>' + tab.name + '</h2><p>' + msg + '</p></div>';
  },

  go(tab) {
    if (!UI.tabs[tab]) return;
    if (UI.tabs[G.ui.tab] && UI.tabs[G.ui.tab].unmounted) UI.tabs[G.ui.tab].unmounted();
    const b = Combat.b;
    if (b && b.waiting && UI.battleTab[b.kind] !== tab) {
      /* Rời khỏi trận đang chờ thao tác: tự động đánh tiếp */
      b.waiting = false;
      Combat.playerAuto(b);
      Combat.afterAction(b, b.player);
    }
    G.ui.tab = tab;
    UI.renderNav();
    UI.renderMain();

  renderNav() {
    const side = document.getElementById('side-nav');

    let html = '', bhtml = '';
    for (const g of UI.groups) {
      html += '<div class="nav-group"><div class="nav-group-name">' + g.name + '</div>';
      for (const id of g.tabs) {
        const t = UI.tabs[id];

        bhtml += '<button class="bn-btn' + act + '" data-act="tab" data-arg="' + id + '"><span class="nav-ic">' + t.icon + '</span><span class="bn-lbl">' + t.short + '</span>' + badge + '</button>';
      }
      html += '</div>';
    }
    side.innerHTML = html;
    bottom.innerHTML = bhtml;
    const ab = bottom.querySelector('.active');
    if (ab && ab.scrollIntoView) ab.scrollIntoView({ block: 'nearest', inline: 'center' });

  renderSide() {
    const el = document.getElementById('side-card');
    if (!el) return;
    const p = G.player;
    el.innerHTML =
      '<div class="sc-top">' +
        '<div class="avatar" id="sc-avatar">' + (p.gender === 'nu' ? '🧘‍♀️' : '🧘‍♂️') + '</div>' +
        '<div class="sc-id"><div class="sc-name">' + U.esc(p.name) + '</div><div class="sc-realm" id="sc-realm"></div></div>' +
      '</div>' +
      UI.bar('sc-tuvi', 'xp', 'Tu vi') + UI.bar('sc-hp', 'hp', 'Sinh lực') + UI.bar('sc-mp', 'mp', 'Linh lực') +
      '<div class="sc-meta" id="sc-meta"></div>';
  },

  bar(id, cls, label) {
    return '<div class="bar ' + cls + '" id="' + id + '"><div class="bar-fill"></div><div class="bar-txt"><span class="bar-lbl">' + label + '</span><span class="bar-val"></span></div></div>';
  },
  setBar(id, cur, max, text) {
    const el = typeof id === 'string' ? document.getElementById(id) : id;
    if (!el) return;
    const pct = max > 0 ? U.clamp(cur / max, 0, 1) * 100 : 0;
    el.firstChild.style.width = pct.toFixed(2) + '%';
    const v = el.querySelector('.bar-val');
    if (v) v.textContent = text != null ? text : U.fmt(cur) + ' / ' + U.fmt(max);
  },

  /** Cập nhật số liệu động (gọi ~4 lần/giây) */
  refresh() {
    if (!G || !G.player || !document.getElementById('main')) return;
    const p = G.player, st = Player.stats();
    const realmEl = document.getElementById('sc-realm');
    if (realmEl) {
      realmEl.textContent = D.stageName(p.realm, p.stage);
      realmEl.style.color = Player.realm().color;
    }
    UI.setBar('sc-tuvi', p.tuVi, Player.req(), Player.isMax() ? 'Viên mãn' : U.fmt(p.tuVi) + ' / ' + U.fmt(Player.req()));
    UI.setBar('sc-hp', p.hp, st.hp);
    UI.setBar('sc-mp', p.mp, st.mp);
    const meta = document.getElementById('sc-meta');
    if (meta) {
      const life = Player.lifespan();
      const warn = life - p.age < Math.max(5, life * 0.08);
      meta.innerHTML = '<span title="Tuổi / Thọ nguyên" class="' + (warn ? 'warn' : '') + '">⏳ ' + Math.floor(p.age) + ' / ' + U.fmt(life) + ' tuổi</span><span title="Lực chiến">⚔️ ' + U.fmt(Player.power(st)) + '</span>';
    }
    const res = document.getElementById('top-res');
    if (res) {
      res.innerHTML = '<span class="res" title="Linh thạch">💎 <b>' + U.fmt(p.stones) + '</b></span>' +
        '<span class="res" title="Điểm ngộ đạo">💡 <b>' + U.fmt(p.insight) + '</b></span>' +
        (G.sect ? '<span class="res" title="Cống hiến tông môn">🏅 <b>' + U.fmt(G.sect.contrib) + '</b></span>' : '');
    }
    const ind = document.getElementById('battle-ind');
    if (ind) {
      const b = Combat.b;
      const show = !!(b && !b.over && UI.battleTab[b.kind] !== G.ui.tab);
      ind.hidden = !show;
    }
    const tab = UI.tabs[G.ui.tab];
    if (tab && tab.refresh && !(tab.locked && tab.locked())) tab.refresh();
    UI.refreshBadges();
  },

  badgeCounts() {
    const out = {};
    out.quests = Quests.badge();
    const now = Date.now();
    out.cave = G.cave.garden.filter((g) => g && g.ready <= now).length;
    out.pets = G.nests.filter((n) => n && n.ready <= now).length;
    out.cultivate = Player.canBreak() && Player.isMajorNext() ? '!' : (Player.canBreak() && !G.settings.autoBreak ? '!' : 0);
    out.sect = G.sect && (Sect.salaryReady() || G.sect.missions.some((m) => Sect.progress(m) >= m.n)) ? '!' : 0;
    out.dungeon = Dungeon.left() > 0 && D.dungeons.some((d) => Player.gs() >= d.req) && !G.dungeon.run ? Dungeon.left() : 0;
    return out;
  },
  refreshBadges() {
    const c = UI.badgeCounts();
    document.querySelectorAll('[data-badge]').forEach((el) => {
      const v = c[el.dataset.badge];
      el.hidden = !v;
      if (v) el.textContent = v;
    });
  },

  /* ---------- Nhật ký ---------- */
  renderLog() {
    const body = document.getElementById('lp-body');
    if (!body || !G) return;
    body.innerHTML = G.log.slice(0, 80).map(UI.logLine).join('');
  },
  logLine(l) { return '<div class="log-line ' + l.type + '"><span class="lt">' + l.time + '</span>' + l.msg + '</div>'; },
  appendLog(l) {
    const body = document.getElementById('lp-body');
    if (!body) return;
    body.insertAdjacentHTML('afterbegin', UI.logLine(l));
    while (body.childNodes.length > 80) body.removeChild(body.lastChild);
  },

  /* ---------- Thông báo ---------- */
  toast(msg, type = 'info') {
    const root = document.getElementById('toasts');
    if (!root || !msg) return;
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.innerHTML = msg;
    root.appendChild(el);
    while (root.children.length > 4) root.removeChild(root.firstChild);
    setTimeout(() => el.classList.add('out'), 3200);
    setTimeout(() => el.remove(), 3700);
  },
  result(r) {
    if (!r) return;
    if (r.msg) UI.toast(r.msg, r.ok ? 'good' : 'bad');
  },
  flash(color) {
    const f = document.getElementById('flash');
    if (!f) return;
    f.style.setProperty('--flash', color || '#fff');
    f.classList.remove('on');
    void f.offsetWidth;
    f.classList.add('on');
  },

  /* ---------- Hộp thoại ---------- */
  modals: [],
  modalOpen() { return UI.modals.length > 0; },
  modal(o) {
    const root = document.getElementById('modal-root');
    const wrap = document.createElement('div');
    wrap.className = 'modal-wrap';
    const acts = (o.actions || []).map((a, i) => '<button class="btn ' + (a.cls || '') + '" data-mi="' + i + '"' + (a.disabled ? ' disabled' : '') + '>' + a.label + '</button>').join('');
    wrap.innerHTML = '<div class="modal ' + (o.cls || '') + '" role="dialog" aria-modal="true">' +
      (o.title ? '<div class="modal-head"><h3>' + o.title + '</h3>' + (o.noClose ? '' : '<button class="icon-btn sm modal-x" aria-label="Đóng">✕</button>') + '</div>' : '') +
      '<div class="modal-body">' + (o.body || '') + '</div>' +
      (acts ? '<div class="modal-actions">' + acts + '</div>' : '') + '</div>';
    const m = { el: wrap, o };
    wrap.addEventListener('click', (e) => {
      if (e.target === wrap && !o.noClose) return UI.closeModal(m);
      if (e.target.closest('.modal-x')) return UI.closeModal(m);
      const b = e.target.closest('[data-mi]');
      if (b && !b.disabled) {
        const a = o.actions[+b.dataset.mi];
        const keep = a.fn && a.fn(m) === false;
        if (!keep && a.close !== false) UI.closeModal(m);
      }
    });
    root.appendChild(wrap);
    UI.modals.push(m);
    if (o.onOpen) o.onOpen(m);
    const first = wrap.querySelector('.modal-actions .btn.primary') || wrap.querySelector('.modal-actions .btn');
    if (first && first.focus) first.focus({ preventScroll: true });
    return m;
  },
  closeModal(m) {
    if (!m || !m.el.parentNode) return;
    m.el.remove();
    UI.modals = UI.modals.filter((x) => x !== m);
    if (m.o.onClose) m.o.onClose(m);
    if (!UI.modals.length && UI.dirty) { UI.dirty = false; UI.renderMain(true); }
  },
  closeTopModal() {
    const m = UI.modals[UI.modals.length - 1];
    if (m && !m.o.noClose) UI.closeModal(m);
  },
  confirm(msg, onYes, opts = {}) {
    return UI.modal({
      title: opts.title || 'Xác nhận', body: '<p>' + msg + '</p>',
      actions: [
        { label: opts.no || 'Hủy', cls: 'ghost' },
        { label: opts.yes || 'Đồng ý', cls: opts.danger ? 'danger' : 'primary', fn: onYes },
      ],
    });
  },

  /* ---------- Thành phần dùng chung ---------- */
  itemIcon(id) { return D.items[id] ? D.items[id].icon : '❔'; },
  itemName(id) { return D.items[id] ? D.items[id].name : id; },
  tierBadge(t) { return '<span class="tier">' + D.numHan[t] + ' giai</span>'; },
  needList(map, mult = 1) {
    return Object.keys(map).map((id) => {
      const need = map[id] * mult, have = Inv.count(id);
      return '<span class="need ' + (have >= need ? 'ok' : 'miss') + '">' + UI.itemIcon(id) + ' ' + UI.itemName(id) + ' ' + U.fmt(have) + '/' + need + '</span>';
    }).join('');
  },
  gearLine(g) {
    const q = D.qualities[g.q];
    return '<span class="gear-name" style="color:' + q.color + '">' + D.slots[g.slot].icon + ' ' + Gear.name(g) + '</span>';
  },
  gearStatsHTML(g) {
    const m = Gear.mainStats(g);
    let h = '<div class="gstats">';
    for (const k in m) h += '<div class="gs-main">' + D.fmtBonus(k, m[k]) + '</div>';
    for (const af of g.affixes) h += '<div class="gs-aff">✦ ' + D.fmtBonus(af.k, af.v) + '</div>';
    return h + '</div>';
  },
  section(title, inner, extra = '') {
    return '<section class="panel ' + extra + '"><h2 class="panel-title"><span>' + title + '</span></h2>' + inner + '</section>';
  },
  pageHead(title, sub) {
    return '<div class="page-head"><h1>' + title + '</h1>' + (sub ? '<p>' + sub + '</p>' : '') + '</div>';
  },
  effChips(effs, shield) {
    let h = '';
    for (const e of effs) {
      const info = D.effectInfo[e.type];
      if (info) h += '<span class="eff" title="' + info.name + ' (' + e.turns + ' lượt)">' + info.icon + e.turns + '</span>';
    }
    if (shield > 0) h += '<span class="eff" title="Hộ thuẫn">🛡️' + U.fmt(shield) + '</span>';
    return h;
  },
  el(name) { return D.elements[name] || D.elements.none; },
  elChip(name) {
    if (name === 'all') return '<span class="el-chip" style="--c:#fff6dc">Ngũ Hành</span>';
    const e = UI.el(name);
    return '<span class="el-chip" style="--c:' + e.color + '">' + e.name + '</span>';
  },
};

/* Giao diện chiến đấu, thám hiểm, bí cảnh, Thông Thiên Tháp */

UI.battleVisible = () => {

  return !!(b && document.getElementById('battle') && UI.battleTab[b.kind] === G.ui.tab && !UI.modalOpen());

UI.battleStart = (b) => {
  UI._seq = 0;
  if (UI.battleTab[b.kind] === G.ui.tab) UI.renderMain(true);
  UI.refresh();
};

UI.fighterHTML = (f, side, extra) =>
  '<div class="fighter ' + side + '" id="bf-' + side + '">' +
    '<div class="f-ava-wrap"><div class="f-ava">' + f.icon + '</div><div class="floats"></div></div>' +
    '<div class="f-info">' +
      '<div class="f-name">' + U.esc(f.name) + (f.boss ? ' <span class="tag boss">Thủ lĩnh</span>' : '') + '</div>' +
      '<div class="f-sub">' + (extra || '') + '</div>' +
      UI.bar('bf-' + side + '-hp', 'hp', 'HP') +
      (f.maxMp ? UI.bar('bf-' + side + '-mp', 'mp', 'MP') : '') +
      '<div class="f-effs" id="bf-' + side + '-eff"></div>' +
    '</div>' +
  '</div>';

UI.battleHTML = (kind) => {
  const b = Combat.b;
  if (!b || UI.battleTab[b.kind] !== kind) return '';
  const en = b.enemy;
  const spd = G.settings.battleSpeed;
  return '<section class="battle" id="battle">' +
    '<div class="b-head"><span class="b-title">' + U.esc(b.title || 'Chiến đấu') + '</span>' +
      '<div class="b-ctrl">' +
        '<button class="chip-btn ' + (G.settings.autoBattle ? 'on' : '') + '" data-act="toggleAutoBattle">' + (G.settings.autoBattle ? '🤖 Tự động' : '✋ Thủ công') + '</button>' +
        '<button class="chip-btn" data-act="battleSpeed">⏩ ' + spd + 'x</button>' +
      '</div></div>' +
    '<div class="b-field">' +
      UI.fighterHTML(b.player, 'player', D.gsName(Player.gs())) +
      '<div class="b-vs">VS</div>' +
      UI.fighterHTML(en, 'enemy', en.lvName + ' · ' + UI.elChip(en.el)) +
    '</div>' +
    (b.pet ? '<div class="b-pet">' + b.pet.icon + ' ' + b.pet.name + ' hộ chiến · công ' + U.fmt(b.pet.atk) + '</div>' : '') +
    '<div class="b-actions" id="b-actions"></div>' +
    '<div class="b-result" id="b-result" hidden></div>' +
    '<div class="b-log" id="b-log"></div>' +
  '</section>';
};

UI.battleActionsHTML = (b) => {
  if (b.over) return '';
  if (!b.waiting) return '<div class="b-wait">' + (G.settings.autoBattle ? 'Đang tự động chiến đấu…' : 'Chờ lượt…') + '</div>';
  const pl = b.player;
  let h = '<button class="btn sm" data-act="bAct" data-arg="attack">⚔️ Tấn công</button>';
  for (const sk of pl.skills) {
    const s = sk.s;
    const cd = pl.cds[s.id] > 0 ? pl.cds[s.id] : 0;
    const ok = Combat.canUse(pl, sk);
    h += '<button class="btn sm skill" data-act="bAct" data-arg="' + s.id + '"' + (ok ? '' : ' disabled') + ' title="' + U.esc(UI.skillDesc(s, sk.lv)) + '">' +
      s.name + (cd ? ' <small>(' + cd + ')</small>' : ' <small>' + Math.round(s.mp * 100) + '%MP</small>') + '</button>';
  }
  for (const id of ['hoi_khi_dan', 'dai_hoan_dan', 'cuu_chuyen_dan', 'hoi_linh_dan']) {
    if (Inv.has(id)) h += '<button class="btn sm ghost" data-act="bAct" data-arg="item:' + id + '">' + D.items[id].icon + ' ' + D.items[id].name + ' ×' + Inv.count(id) + '</button>';
  }
  if (b.kind !== 'tower' && b.kind !== 'sect') h += '<button class="btn sm ghost" data-act="bAct" data-arg="flee">🏃 Bỏ chạy</button>';
  return h;
};

UI.battleResultHTML = (b) => {
  const t = b.result === 'win' ? '<h3 class="good">Chiến Thắng</h3>' : b.result === 'flee' ? '<h3>Đã Thoát Thân</h3>' : '<h3 class="bad">Thất Bại</h3>';
  let rw = '';
  if (b.rewards && b.rewards.length) rw = '<div class="rw-list">' + b.rewards.map((r) => '<span class="rw">' + r + '</span>').join('') + '</div>';
  let btns = '';
  if (b.kind === 'explore') {
    btns = Explore.auto ? '<span class="muted">Tự động thám hiểm tiếp…</span> <button class="btn sm ghost" data-act="exAuto">Dừng tự động</button>' :
      '<button class="btn primary" data-act="exploreAgain">Tiếp tục thám hiểm</button><button class="btn ghost" data-act="battleClose">Đóng</button>';
  } else if (b.kind === 'dungeon') {
    const run = G.dungeon.run;
    if (run && run.status === 'rest') btns = '<button class="btn primary" data-act="dgNext">Tiến vào ải ' + (run.stage + 1) + '</button>' + (G.settings.autoBattle ? '<span class="muted">Tự động tiến lên…</span>' : '');
    else btns = '<button class="btn primary" data-act="dgLeave">Rời bí cảnh</button>';
  } else if (b.kind === 'tower') {
    btns = (b.result === 'win' ? '<button class="btn primary" data-act="towerGo">Khiêu chiến tầng ' + (G.tower.best + 1) + '</button>' : '<button class="btn primary" data-act="towerGo">Thử lại</button>') +
      '<button class="btn ghost" data-act="battleClose">Đóng</button>';
  } else {
    btns = '<button class="btn primary" data-act="battleClose">Đóng</button>';
  }
  return t + rw + '<div class="b-res-btns">' + btns + '</div>';
};

UI.battleUpdate = (b) => {
  const root = document.getElementById('battle');
  if (!root || Combat.b !== b) { b.events.length = 0; UI.refresh(); return; }
  const pl = b.player, en = b.enemy;
  UI.setBar('bf-player-hp', Math.max(0, pl.hp), pl.maxHp);
  UI.setBar('bf-player-mp', Math.max(0, pl.mp), pl.maxMp);
  UI.setBar('bf-enemy-hp', Math.max(0, en.hp), en.maxHp);
  const pe = document.getElementById('bf-player-eff'), ee = document.getElementById('bf-enemy-eff');
  if (pe) pe.innerHTML = UI.effChips(pl.effs, pl.shield) + (pl.stunned ? '<span class="eff">💫</span>' : '');
  if (ee) ee.innerHTML = UI.effChips(en.effs, en.shield) + (en.stunned ? '<span class="eff">💫</span>' : '');
  const acts = document.getElementById('b-actions');
  if (acts) acts.innerHTML = UI.battleActionsHTML(b);
  const res = document.getElementById('b-result');
  if (res) {
    res.hidden = !b.over;
    if (b.over && !res.dataset.done) { res.innerHTML = UI.battleResultHTML(b); res.dataset.done = '1'; }
  }
  const log = document.getElementById('b-log');
  if (log) {
    let html = '';
    for (const l of b.log) if (l.id > UI._seq) { html = '<div class="bl ' + l.cls + '">' + l.text + '</div>' + html; UI._seq = l.id; }
    if (html) log.insertAdjacentHTML('afterbegin', html);
    while (log.childNodes.length > 40) log.removeChild(log.lastChild);
  }
  for (const ev of b.events) {
    const host = document.querySelector('#bf-' + ev.side + ' .floats');
    if (!host) continue;
    const s = document.createElement('span');
    s.className = 'float ' + (ev.cls || '');
    s.textContent = ev.text;
    s.style.left = (35 + Math.random() * 30) + '%';
    host.appendChild(s);
    setTimeout(() => s.remove(), 1100);
    if (ev.cls === 'dmg' || ev.cls === 'crit' || ev.cls === 'pet' || ev.cls === 'dot') {
      const ava = document.querySelector('#bf-' + ev.side + ' .f-ava');
      if (ava) { ava.classList.remove('hit'); void ava.offsetWidth; ava.classList.add('hit'); }
    }
  }
  b.events.length = 0;
  UI.refresh();
};

A.bAct = (arg) => Combat.playerAct(arg);
A.toggleAutoBattle = () => {
  G.settings.autoBattle = !G.settings.autoBattle;
  const b = Combat.b;
  if (b && b.waiting && G.settings.autoBattle) { b.waiting = false; Combat.playerAuto(b); Combat.afterAction(b, b.player); }
  UI.renderMain(true);
  if (b) UI.battleUpdate(b);
};
A.battleSpeed = () => {
  const order = [1, 2, 4];
  G.settings.battleSpeed = order[(order.indexOf(G.settings.battleSpeed) + 1) % order.length];
  UI.renderMain(true);
  if (Combat.b) UI.battleUpdate(Combat.b);
};
A.battleClose = () => { Combat.clear(); UI.renderMain(true); };

/* ---------- Thám hiểm ---------- */
UI.tabs.explore = {
  name: 'Thám Hiểm', short: 'Thám hiểm', icon: '🗺️',
  render() {
    const cur = Explore.map();
    let maps = '<div class="map-grid">';
    for (const m of D.maps) {
      const un = Explore.unlocked(m);
      maps += '<button class="map-card' + (m.id === cur.id ? ' active' : '') + (un ? '' : ' locked') + '" data-act="setMap" data-arg="' + m.id + '" style="--hue:' + m.hue + '"' + (un ? '' : ' disabled') + '>' +
        '<span class="mc-icon">' + m.icon + '</span><span class="mc-name">' + m.name + '</span>' +
        '<span class="mc-lv">' + D.gsName(m.lv[0]) + (m.lv[1] !== m.lv[0] ? ' → ' + D.gsName(m.lv[1]) : '') + '</span>' +
        (un ? '' : '<span class="mc-lock">🔒 Cần ' + D.gsName(m.lv[0] - 1) + '</span>') + '</button>';
    }
    maps += '</div>';
    const mons = cur.mons.map((id) => '<span class="mon-chip" title="' + D.monsters[id].name + '">' + D.monsters[id].icon + ' ' + D.monsters[id].name + '</span>').join('');
    const boss = D.monsters[cur.boss];
    const herbs = D.herbsByTier[cur.tier].map((id) => UI.itemIcon(id) + ' ' + UI.itemName(id)).join(' · ');
    const busy = Combat.active() || Explore.busy;
    const panel =
      '<div class="ex-head" style="--hue:' + cur.hue + '"><div class="ex-icon">' + cur.icon + '</div><div><h2>' + cur.name + '</h2><p>' + cur.desc + '</p></div></div>' +
      '<div class="ex-info"><div><b>Yêu thú:</b> ' + mons + '</div><div><b>Thủ lĩnh:</b> <span class="mon-chip boss">' + boss.icon + ' ' + boss.name + '</span> · ' + D.gsName(cur.lv[1]) + '</div>' +
      '<div><b>Sản vật:</b> ' + herbs + ' · ' + UI.itemIcon(D.oreByTier[cur.tier]) + ' ' + UI.itemName(D.oreByTier[cur.tier]) + ' · 🔮 Yêu đan ' + D.numHan[cur.tier] + ' giai</div></div>' +
      '<div class="ex-actions">' +
        '<button class="btn primary big" data-act="explore" id="ex-btn"' + (busy ? ' disabled' : '') + '>🧭 Thám hiểm</button>' +
        '<button class="btn ' + (Explore.auto ? 'on' : 'ghost') + '" data-act="exAuto" id="ex-auto">' + (Explore.auto ? '⏸ Dừng tự động' : '🔁 Tự động thám hiểm') + '</button>' +
        '<button class="btn danger-ghost" data-act="exBoss" id="ex-boss">👹 Khiêu chiến thủ lĩnh</button>' +
      '</div>' +
      '<div class="ex-prog" id="ex-prog" hidden><div class="ex-prog-fill"></div></div>' +
      '<div class="ex-status" id="ex-status">' + (UI._exStatus || 'Linh khí nơi này dồi dào. Hãy cẩn thận yêu thú.') + '</div>';
    return UI.pageHead('Thám Hiểm', 'Ngao du bốn phương, săn yêu thú, tìm linh dược và kỳ ngộ.') +
      UI.section('Hành trình', panel, 'explore-panel') + UI.battleHTML('explore') + UI.section('Khu vực', maps);
  },
  mounted() { if (Combat.b && Combat.b.kind === 'explore') UI.battleUpdate(Combat.b); if (Explore.busy) UI.exploreProgress(true); },
  refresh() {
    const m = Explore.map();
    const bb = document.getElementById('ex-boss');
    if (bb) {
      const left = (G.bossCd[m.id] || 0) - Date.now();
      const busy = Combat.active() || Explore.busy;
      bb.disabled = left > 0 || busy;
      bb.textContent = left > 0 ? '👹 Thủ lĩnh hồi sinh sau ' + U.clock(left / 1000) : '👹 Khiêu chiến thủ lĩnh';
    }
    const eb = document.getElementById('ex-btn');
    if (eb) eb.disabled = Combat.active() || Explore.busy;
    const pr = document.getElementById('ex-prog');
    if (pr && Explore.busy) {
      pr.hidden = false;
      pr.firstChild.style.width = Math.min(100, (Date.now() - Explore.progressStart) / Explore.DURATION * 100) + '%';
    }
  },
};
UI.exploreProgress = (on) => {
  const pr = document.getElementById('ex-prog');
  if (pr) { pr.hidden = !on; if (on) pr.firstChild.style.width = '0%'; }
  if (on) UI.setExploreStatus('Đang thám hiểm…');
};
UI.setExploreStatus = (msg) => {
  UI._exStatus = msg;
  const el = document.getElementById('ex-status');
  if (el) el.innerHTML = msg;
};
A.setMap = (id) => {
  if (Explore.setMap(id)) { UI._exStatus = ''; UI.renderMain(true); }
  else UI.toast('Không thể đổi khu vực lúc này.', 'bad');
};
A.explore = () => { Combat.clear(); if (Explore.start()) UI.refresh(); };
A.exploreAgain = () => { Combat.clear(); UI.renderMain(true); Explore.start(); };
A.exAuto = () => {
  Explore.setAuto(!Explore.auto);
  if (Explore.auto) { Combat.clear(); UI.renderMain(true); Explore.autoStep(); }
  else UI.renderMain(true);
};
A.exBoss = () => { Combat.clear(); if (!Explore.challengeBoss()) UI.toast('Chưa thể khiêu chiến.', 'bad'); };

/* ---------- Bí cảnh ---------- */
UI.tabs.dungeon = {
  name: 'Bí Cảnh', short: 'Bí cảnh', icon: '🏛️',
  locked() { return Player.gs() < D.dungeons[0].req ? 'Mở khóa khi đạt ' + D.gsName(D.dungeons[0].req) + '.' : false; },
  render() {
    const run = G.dungeon.run;
    let body = '';
    if (run) {
      const d = D.dungeonById[run.id];
      let pips = '<div class="pips">';
      for (let i = 0; i < d.stages; i++) {
        const cls = i < run.stage || run.status === 'done' ? 'done' : i === run.stage ? 'cur' : '';
        pips += '<span class="pip ' + cls + '">' + (i === d.stages - 1 ? '👹' : i + 1) + '</span>';
      }
      pips += '</div>';
      let status = '';
      if (run.status === 'done') status = '<div class="dg-done"><h3 class="good">Chinh phục thành công!</h3><div class="rw-list">' + run.loot.map((r) => '<span class="rw">' + r + '</span>').join('') + '</div><button class="btn primary" data-act="dgLeave">Rời bí cảnh</button></div>';
      else if (run.status === 'failed') status = '<div class="dg-done"><h3 class="bad">Thất bại</h3><p>Ngươi bị đánh văng khỏi bí cảnh.</p><button class="btn primary" data-act="dgLeave">Rời bí cảnh</button></div>';
      else if (run.status === 'rest' && !Combat.b) status = '<div class="dg-done"><p>Ải ' + run.stage + ' đã vượt qua. Điều tức rồi tiến lên.</p><button class="btn primary" data-act="dgNext">Tiến vào ải ' + (run.stage + 1) + '</button></div>';
      body = UI.section(d.icon + ' ' + d.name, pips + status) + UI.battleHTML('dungeon');
    } else {
      body = '<div class="card-grid">' + D.dungeons.map((d) => {
        const can = Dungeon.canEnter(d);
        const boss = D.monsters[d.boss];
        return '<div class="card dungeon-card' + (Player.gs() < d.req ? ' dim' : '') + '">' +
          '<div class="dc-icon">' + d.icon + '</div><h3>' + d.name + '</h3><p class="muted">' + d.desc + '</p>' +
          '<div class="kv"><span>Yêu cầu</span><b>' + D.gsName(d.req) + '</b></div>' +
          '<div class="kv"><span>Số ải</span><b>' + d.stages + '</b></div>' +
          '<div class="kv"><span>Thủ lĩnh</span><b>' + boss.icon + ' ' + boss.name + '</b></div>' +
          '<div class="kv"><span>Phần thưởng</span><b>Trang bị Huyền phẩm+, bí tịch, trứng</b></div>' +
          '<button class="btn primary" data-act="dgEnter" data-arg="' + d.id + '"' + (can === true ? '' : ' disabled') + '>' + (can === true ? 'Tiến vào' : can) + '</button></div>';
      }).join('') + '</div>';
    }
    return UI.pageHead('Bí Cảnh', 'Lượt còn lại hôm nay: <b>' + Dungeon.left() + '</b> (mỗi ngày ' + Dungeon.maxDaily() + ' lượt, thêm lượt bằng Bí Cảnh Lệnh). Sinh lực không hồi giữa các ải.') + body;
  },
  mounted() { if (Combat.b && Combat.b.kind === 'dungeon') UI.battleUpdate(Combat.b); },
};
A.dgEnter = (id) => { Combat.clear(); if (Dungeon.enter(id)) UI.renderMain(); };
A.dgNext = () => { Dungeon.proceed(); };
A.dgLeave = () => { Dungeon.leave(); UI.renderMain(); };

UI.tabs.tower = {
  name: 'Thông Thiên Tháp', short: 'Tháp', icon: '🗼',
  locked() { return Player.gs() < 1 ? 'Mở khóa khi đạt Luyện Khí.' : false; },
  render() {
    const f = G.tower.best + 1;
    const en = Tower.enemy(f);
    const r = Tower.reward(f);
    const rw = ['💎 ~' + U.fmt(r.stones) + ' linh thạch'];
    if (f % 5 === 0) rw.push('🌿 Linh dược, 🔮 yêu đan');
    if (f % 10 === 0) rw.push('🎁 Trang bị Huyền phẩm+, có thể có bí tịch');
    if (f % 30 === 0) rw.push('🥚 Trứng linh thú');
    if (f % 50 === 0) rw.push('💧 Tẩy Linh Dịch');
    const busy = Combat.active();
    const next = '<div class="tower-next">' +
      '<div class="tw-floor"><span class="tw-num">' + f + '</span><span>tầng</span></div>' +
      '<div class="tw-info"><div class="tw-en">' + en.icon + ' <b>' + en.name + '</b> ' + (en.boss ? '<span class="tag boss">Thủ lĩnh</span>' : en.elite ? '<span class="tag">Tinh anh</span>' : '') + '</div>' +
      '<div class="muted">' + en.lvName + ' · HP ' + U.fmt(en.maxHp) + ' · Công ' + U.fmt(en.atk) + ' · Thủ ' + U.fmt(en.def) + '</div>' +
      '<div class="rw-list">' + rw.map((x) => '<span class="rw">' + x + '</span>').join('') + '</div></div>' +
      '<div class="tw-btns"><button class="btn primary big" data-act="towerGo"' + (busy ? ' disabled' : '') + '>Khiêu chiến</button>' +
      '<button class="btn ' + (Tower.auto ? 'on' : 'ghost') + '" data-act="towerAuto">' + (Tower.auto ? '⏸ Dừng leo' : '🔁 Tự động leo') + '</button></div></div>';
    return UI.pageHead('Thông Thiên Tháp', 'Tầng cao nhất đã vượt: <b>' + G.tower.best + '</b>. Thí luyện không tiêu hao sinh lực; thất bại có thể thử lại ngay.') +
      UI.section('Tầng kế tiếp', next) + UI.battleHTML('tower');
  },
  mounted() { if (Combat.b && Combat.b.kind === 'tower') UI.battleUpdate(Combat.b); },
};
A.towerGo = () => { Combat.clear(); if (Tower.challenge()) UI.renderMain(true); };
A.towerAuto = () => {
  Tower.auto = !Tower.auto;
  if (Tower.auto && !Combat.active()) { Combat.clear(); Tower.challenge(); }
  UI.renderMain(true);
};

  },
};

/* Hạt linh khí bay vào đan điền */
UI.qi = {
  raf: 0, parts: [], rate: 1, last: 0,
  start() {
    UI.qi.stop();
    const cv = document.getElementById('qi-canvas');
    if (!cv) return;
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) return;
    const ctx = cv.getContext('2d');
    const fit = () => {
      const r = cv.getBoundingClientRect();
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      cv.width = Math.max(1, r.width * dpr); cv.height = Math.max(1, r.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    fit();
    UI.qi.parts = [];
    UI.qi.last = performance.now();
    const color = Player.realm().color;
    const loop = (t) => {
      if (!document.getElementById('qi-canvas')) return UI.qi.stop();
      const dt = Math.min(0.05, (t - UI.qi.last) / 1000);
      UI.qi.last = t;
      const w = cv.clientWidth, h = cv.clientHeight;
      if (cv.width < 2) fit();
      const cx = w / 2, cy = h * 0.64;
      const spawn = 6 + Math.min(40, Math.log10(UI.qi.rate + 1) * 5);
      if (Math.random() < spawn * dt) {
        const a = Math.random() * Math.PI * 2, R = Math.max(w, h) * 0.55;
        UI.qi.parts.push({ x: cx + Math.cos(a) * R, y: cy + Math.sin(a) * R, life: 1, sp: 0.35 + Math.random() * 0.5, r: 1 + Math.random() * 2.2 });
      }
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = color;
      for (const p of UI.qi.parts) {
        p.x += (cx - p.x) * p.sp * dt * 1.6;
        p.y += (cy - p.y) * p.sp * dt * 1.6 - 6 * dt;
        const d = Math.hypot(cx - p.x, cy - p.y);
        p.life = Math.min(1, d / 60);
        ctx.globalAlpha = 0.15 + 0.6 * p.life;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      UI.qi.parts = UI.qi.parts.filter((p) => p.life > 0.08);
      UI.qi.raf = requestAnimationFrame(loop);
    };
    UI.qi.raf = requestAnimationFrame(loop);
  },
  stop() { cancelAnimationFrame(UI.qi.raf); UI.qi.raf = 0; },
};

UI.tribUpdate = (s) => {
  const m = UI._trib;
  if (!m) return;
  UI.setBar('trib-hp', Math.max(0, s.hp), s.maxHp);
  const c = document.getElementById('trib-count');
  if (c) c.innerHTML = s.done ? (s.ok ? '<b class="good">Độ kiếp thành công!</b>' : '<b class="bad">Độ kiếp thất bại</b>') : 'Lôi kiếp <b>' + s.i + '</b> / ' + s.n;
  const log = document.getElementById('trib-log');
  if (log) log.innerHTML = s.log.slice().reverse().map((l) => '<div>' + l + '</div>').join('');
  if (s.flash) {
    s.flash = false;
    const bolt = document.getElementById('trib-bolt'), scene = document.getElementById('trib-scene');
    if (bolt) { bolt.classList.remove('on'); void bolt.offsetWidth; bolt.classList.add('on'); }
    if (scene) { scene.classList.remove('shake'); void scene.offsetWidth; scene.classList.add('shake'); }
  }
  const btns = m.el.querySelectorAll('.modal-actions .btn');
  if (btns[0]) btns[0].disabled = s.done;
  if (btns[1]) btns[1].disabled = !s.done;
  if (s.done && s.ok) UI.flash(Player.realm().color);
};

    const cur = Gear.get(G.player.equip[slot]);
    let best = cur, bs = cur ? Gear.score(cur) : -1;
    for (const g of G.gear) {
      if (g.slot !== slot || G.player.realm < Gear.reqRealm(g)) continue;
      const s = Gear.score(g);
      if (s > bs) { bs = s; best = g; }
    }
    if (best && best !== cur) { Gear.equip(best.uid); n++; }
  }
  UI.toast(n ? 'Đã thay ' + n + ' món trang bị.' : 'Trang bị hiện tại đã là tốt nhất.', n ? 'good' : 'info');
  UI.render();
};

'use strict';
/* Công pháp & thần thông (logic + giao diện), hành trang, chi tiết vật phẩm */

const Arts = {
  techCost(id) {
    const t = D.techniques[id], lv = G.player.techs[id] || 1;
    return Math.floor(25 * Math.pow(1.7, t.grade) * Math.pow(lv, 1.6));
  },
  techUp(id) {
    const p = G.player, lv = p.techs[id];
    if (!lv) return { ok: false, msg: 'Chưa lĩnh ngộ.' };
    if (lv >= D.TECH_MAX) return { ok: false, msg: 'Đã đại thành.' };
    const c = Arts.techCost(id);
    if (p.insight < c) return { ok: false, msg: 'Cần ' + U.fmt(c) + ' ngộ đạo.' };
    p.insight -= c;
    p.techs[id] = lv + 1;
    Quests.check(); Ach.check();
    Sfx.play('up');
    return { ok: true, msg: D.techniques[id].name + ' đạt tầng ' + (lv + 1) + '.' };
  },
  techSwitch(id) {
    if (!G.player.techs[id]) return { ok: false, msg: 'Chưa lĩnh ngộ.' };
    G.player.tech = id;
    return { ok: true, msg: 'Chuyển tu ' + D.techniques[id].name + '.' };
  },
  skillCost(id) {
    const s = D.skills[id], lv = G.player.skills[id] || 1;
    return { insight: Math.floor(12 * Math.pow(1.6, s.tier) * Math.pow(lv, 1.5)), stones: Math.floor(30 * D.tierPrice(s.tier) * lv) };
  },
  skillUp(id) {
    const p = G.player, lv = p.skills[id];
    if (!lv) return { ok: false, msg: 'Chưa học.' };
    if (lv >= D.SKILL_MAX) return { ok: false, msg: 'Đã đạt cảnh giới viên mãn.' };
    const c = Arts.skillCost(id);
    if (p.insight < c.insight) return { ok: false, msg: 'Cần ' + U.fmt(c.insight) + ' ngộ đạo.' };
    if (p.stones < c.stones) return { ok: false, msg: 'Cần ' + U.fmt(c.stones) + ' linh thạch.' };
    p.insight -= c.insight; p.stones -= c.stones;
    p.skills[id] = lv + 1;
    Sfx.play('up');
    return { ok: true, msg: D.skills[id].name + ' đạt cấp ' + (lv + 1) + '.' };
  },
  skillToggle(id) {
    const p = G.player;
    if (!p.skills[id]) return { ok: false, msg: 'Chưa học.' };
    const i = p.eq.indexOf(id);
    if (i >= 0) { p.eq.splice(i, 1); return { ok: true, msg: 'Đã tháo ' + D.skills[id].name + '.' }; }
    if (p.eq.length >= D.SKILL_SLOTS) return { ok: false, msg: 'Chỉ trang bị tối đa ' + D.SKILL_SLOTS + ' thần thông.' };
    p.eq.push(id);
    Quests.check();
    return { ok: true, msg: 'Đã trang bị ' + D.skills[id].name + '.' };
  },
};

UI.skillDesc = (s, lv = 1) => {
  const lm = 1 + 0.1 * (lv - 1);
  const parts = [];
  if (s.mult) parts.push('Sát thương ' + Math.round(s.mult * lm * 100) + '%' + (s.hits > 1 ? ' ×' + s.hits + ' đòn' : ''));
  if (s.pierce) parts.push('xuyên giáp ' + Math.round(s.pierce * 100) + '%');
  if (s.lifesteal) parts.push('hút máu ' + Math.round(s.lifesteal * 100) + '%');
  for (const e of s.effs) {
    const info = D.effectInfo[e.type];
    if (e.type === 'heal') parts.push('hồi ' + Math.round(e.pow * (1 + (lm - 1) * 0.5) * 100) + '% sinh lực');
    else if (e.type === 'shield') parts.push('hộ thuẫn ' + Math.round(e.pow * (1 + (lm - 1) * 0.5) * 100) + '% sinh lực');
    else if (info.dot) parts.push(Math.round((e.chance + 0.02 * (lv - 1)) * 100) + '% ' + info.name.toLowerCase() + ' ' + e.turns + ' lượt');
    else if (e.type === 'stun') parts.push(Math.round((e.chance + 0.02 * (lv - 1)) * 100) + '% gây choáng');
    else parts.push(info.name + ' ' + Math.round(e.pow * 100) + '% (' + (e.turns || 2) + ' lượt)');
  }
  parts.push(Math.round(s.mp * 100) + '% linh lực', 'hồi chiêu ' + s.cd);
  return parts.join(' · ');
};

          (sel.enh < 15 ? '<div class="needs">' + UI.needList({ [c.ore]: c.n }) + '<span class="need ' + (G.player.stones >= c.stones ? 'ok' : 'miss') + '">💎 ' + U.fmt(c.stones) + '</span></div>' +
          '<p class="small">Tỉ lệ thành công: <b>' + Math.round(ch * 100) + '%</b>' + (sel.enh >= 10 ? ' · <span class="bad">thất bại sẽ giảm 1 cấp</span>' : '') + '</p>' +

};

        '<button class="btn sm primary" data-act="claimDaily" data-arg="' + i + '"' + (done && !task.claimed ? '' : ' disabled') + '>' + (task.claimed ? 'Đã nhận' : 'Nhận') + '</button></div>';
    }).join('');

      const got = d.chests.includes(j), ok = d.points >= p;
      return '<button class="chest' + (got ? ' got' : ok ? ' ready' : '') + '" data-act="claimChest" data-arg="' + j + '"' + (ok && !got ? '' : ' disabled') + '><span>' + (got ? '📭' : '🎁') + '</span><small>' + p + ' điểm</small></button>';

      UI.section('Tiên Đồ Chính Tuyến', main) + '<div class="grid-2">' + UI.section('Nhiệm Vụ Hằng Ngày', daily + chests) + UI.section('Điểm Danh 7 Ngày', login) + '</div>';
  },
