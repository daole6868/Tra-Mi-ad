      dungeon: { date: '', used: 0, bonus: 0, run: null },
      tower: { best: 0 },
      reinc: { count: 0, points: 0, talents: {}, bestGs: 0, totalPoints: 0 },
      settings: { sound: true, autoBreak: true, autoHeal: true, battleSpeed: 1, autoBattle: true, autoSalvage: -1, autoEvents: true },
      log: [],
      flags: {},
      ui: { tab: 'cultivate' },
    };
  },

  /** Bổ sung các trường thiếu (khi nâng cấp phiên bản) */
  fixup(s) {
    const b = Save.blank();
    for (const k in b) if (s[k] === undefined) s[k] = b[k];
    for (const k of ['prof', 'quests', 'dungeon', 'tower', 'reinc', 'settings', 'cave']) {
      for (const kk in b[k]) if (s[k][kk] === undefined) s[k][kk] = b[k][kk];
    }
    if (s.player) {
      const p = s.player;
      p.buffs = p.buffs || {};
      p.attrPills = p.attrPills || { ngoTinh: 0, canCot: 0, khiVan: 0, thanThuc: 0 };
      p.techs = p.techs || { dan_khi_quyet: 1 };
      p.skills = p.skills || {};
      p.eq = p.eq || [];
      p.equip = p.equip || {};
      p.lifePills = p.lifePills || 0;
      p.lifeBonus = p.lifeBonus || 0;
      p.tribBonus = p.tribBonus || 0;
      p.breakFails = p.breakFails || 0;
      p.karma = p.karma || 0;
      p.tox = p.tox || 0;
    }
    while (s.cave.garden.length < Cave.slots(s.cave.lv)) s.cave.garden.push(null);
    s.dungeon.run = null;
    return s;
  },

  serialize() { return JSON.stringify(G); },

  save() {
    if (!G || Main.skipSave) return false;
    try {
      localStorage.setItem(Save.KEY, Save.serialize());
      G.lastSave = Date.now();
      return true;
    } catch (e) {
      return false;
    }
  },

  loadRaw() {
    try { return localStorage.getItem(Save.KEY); } catch (e) { return null; }
  },

  parse(str) {
    const s = JSON.parse(str);
    if (!s || typeof s !== 'object' || !('v' in s)) throw new Error('Dữ liệu không hợp lệ');
    return Save.fixup(s);
  },

  exportString() {
    return btoa(unescape(encodeURIComponent(Save.serialize())));
  },

  importString(str) {
    const json = decodeURIComponent(escape(atob(str.trim())));
    return Save.parse(json);
  },

  wipe() {
    try { localStorage.removeItem(Save.KEY); } catch (e) { /* bỏ qua */ }
  },
};

/** Tạo kiếp sống mới. keep: dữ liệu giữ lại sau luân hồi */
function newLife(opts, keep) {
  const s = Save.blank();
  if (keep) {
    s.ach = keep.ach || {};
    s.stats = keep.stats || {};
    s.reinc = keep.reinc || s.reinc;
    s.settings = keep.settings || s.settings;
    s.tower = { best: 0 };
  }
  G = s;
  const bg = D.backgrounds.find((b) => b.id === opts.bg) || D.backgrounds[0];
  const attrs = Object.assign({}, opts.attrs);
  const tp = Reinc.lv('thien_phu');
  for (const k in attrs) attrs[k] += tp;
  for (const k in bg.attrs) attrs[k] = (attrs[k] || 0) + bg.attrs[k];
  s.player = {
    name: opts.name, gender: opts.gender, bg: bg.id,
    root: opts.root, attrs, attrPills: { ngoTinh: 0, canCot: 0, khiVan: 0, thanThuc: 0 },
    realm: 0, stage: 0, tuVi: 0, age: 16, lifeBonus: 0, lifePills: 0,
    hp: 1, mp: 1, karma: 0, insight: bg.insight || 0, stones: 100 + (bg.stones || 0) + Reinc.lv('gia_tai') * 500,
    tox: 0, injuredUntil: 0, buffs: {},
    tech: 'dan_khi_quyet', techs: { dan_khi_quyet: 1 }, skills: {}, eq: [], equip: {},
    tribBonus: 0, breakFails: 0,
  };
  const nghe = Reinc.lv('nghe_cu');
  s.prof.alch.lv += nghe;
  s.prof.forge.lv += nghe;
  /* Vật phẩm khởi đầu */
  Inv.add('hoi_khi_dan', 3);
  Inv.add('book_s_' + Player.starterSkill(opts.root), 1);
  for (const id in bg.items || {}) Inv.add(id, bg.items[id]);
  const w = Gear.create('weapon', 1, bg.gear ? bg.gear.quality : 0);
  const a = Gear.create('armor', 1, 0);
  Gear.equip(w.uid, true);
  Gear.equip(a.uid, true);
  const st = Player.stats();
  s.player.hp = st.hp;
  s.player.mp = st.mp;
  Quests.initMain();
  Market.refresh(true);
  s.flags.intro = true;
  return s;
}

/* ===== js/systems/player.js ===== */
'use strict';
/* Nhân vật: chỉ số, tu luyện, đột phá, thọ nguyên */

const Player = {
  gs() { return D.rsToGs(G.player.realm, G.player.stage); },
  realm() { return D.realms[G.player.realm]; },
  req() {
    const p = G.player, r = D.realms[p.realm];
    return Math.floor(r.baseReq * Math.pow(r.grow, p.stage));
  },
  isMax() { return Player.gs() >= D.MAX_GS; },
  isMajorNext() {
    const p = G.player;
    return p.stage >= D.realms[p.realm].stages - 1;
  },
  rootType() { return D.rootTypes.find((r) => r.id === G.player.root.type) || D.rootTypes[0]; },
  rootName(root) {
    root = root || G.player.root;
    const rt = D.rootTypes.find((r) => r.id === root.type);
    if (rt.all) return rt.name;
    return rt.name + ' (' + root.els.map((e) => D.elements[e].name).join(' · ') + ')';
  },
  hasElement(el) {
    const root = G.player.root;
    if (!el || el === 'none') return false;
    if (el === 'all') return true;
    const rt = Player.rootType();
    return !!rt.all || root.els.includes(el);
  },
  matchBonus() {
    const rt = Player.rootType();
    return 0.4 / Math.max(1, rt.count || 1);
  },
  starterSkill(root) {
    const map = { kim: 'kim_quang_tram', moc: 'dang_man', thuy: 'bang_tien', hoa: 'hoa_cau', tho: 'tho_thuan', loi: 'hoa_cau', bang: 'bang_tien', phong: 'kim_quang_tram' };
    const el = root.els && root.els[0];
    return map[el] || 'hoa_cau';
  },

  attrs() {
    const p = G.player, out = {};
    for (const k in D.attrs) out[k] = (p.attrs[k] || 0) + (p.attrPills[k] || 0);
    return out;
  },

  /** Tổng hợp mọi nguồn bonus */
  bonuses() {
    const p = G.player, b = {};
    const t = D.techniques[p.tech];
    if (t) U.addBonus(b, t.bonus, 1 + 0.1 * ((p.techs[p.tech] || 1) - 1));
    for (const slot of D.slotOrder) {
      const g = Gear.get(p.equip[slot]);
      if (!g) continue;
      U.addBonus(b, Gear.mainStats(g));
      for (const af of g.affixes) b[af.k] = (b[af.k] || 0) + af.v;
    }
    if (G.sect) {
      const sd = D.sectById[G.sect.id];
      U.addBonus(b, sd.bonus, 1 + 0.5 * G.sect.rank);
    }
    const pet = Pets.active();
    if (pet) U.addBonus(b, Pets.passive(pet));
    for (const a of D.achievements) if (G.ach[a.id]) U.addBonus(b, a.b);
    for (const tl of D.reincTalents) {
      const lv = Reinc.lv(tl.id);
      if (lv && tl.key) b[tl.key] = (b[tl.key] || 0) + tl.per * lv;
    }
    const now = Date.now();
    for (const k in p.buffs) {
      const bf = p.buffs[k];
      if (bf.until > now) {
        const key = k === 'atk' ? 'atkPct' : k === 'def' ? 'defPct' : k;
        b[key] = (b[key] || 0) + bf.val;
      }
    }
    if (p.tribBonus) b.allPct = (b.allPct || 0) + p.tribBonus;
    return b;
  },

  stats() {
    const b = Player.bonuses(), a = Player.attrs();
    const s = D.statScale(Player.gs());
    const all = 1 + (b.allPct || 0) / 100;
    let hp = 100 * s * (1 + 0.05 * a.canCot) + (b.hp || 0);
    let mp = 50 * s * (1 + 0.06 * a.thanThuc) + (b.mp || 0);
    let atk = 12 * s * (1 + 0.03 * a.thanThuc) + (b.atk || 0);
    let def = 5 * s * (1 + 0.03 * a.canCot) + (b.def || 0);
    let spd = 10 + (b.spd || 0);
    hp *= (1 + (b.hpPct || 0) / 100) * all;
    mp *= (1 + (b.mpPct || 0) / 100) * all;
    atk *= (1 + (b.atkPct || 0) / 100) * all;
    def *= (1 + (b.defPct || 0) / 100) * all;
    spd *= (1 + (b.spdPct || 0) / 100);
    return {
      hp: Math.floor(hp), mp: Math.floor(mp), atk: Math.floor(atk), def: Math.floor(def),
      spd: Math.round(spd * 10) / 10,
      crit: Math.min(75, 5 + 0.5 * a.thanThuc + 0.3 * a.khiVan + (b.crit || 0)),
      critDmg: 150 + (b.critDmg || 0),
      dodge: Math.min(50, 3 + (b.dodge || 0)),
      lifesteal: Math.min(40, b.lifesteal || 0),
      drop: (b.drop || 0) + 3 * a.khiVan,
      bonus: b,
    };
  },

  /** Lực chiến tham khảo */
  power(st) {
    st = st || Player.stats();
    return Math.floor(st.atk * 3 + st.def * 2 + st.hp * 0.35 + st.mp * 0.1 + st.atk * (st.crit / 100) * (st.critDmg / 100) * 2 + st.spd * 5);
  },

  isInjured() { return G.player.injuredUntil > Date.now(); },

  /** Tốc độ tu luyện (tu vi/giây) kèm bảng phân tích */
  cultRate(detail) {
    const p = G.player, realm = Player.realm(), b = Player.bonuses(), a = Player.attrs();
    const parts = [];
    let rate = realm.rate * (1 + 0.1 * p.stage);
    parts.push(['Cảnh giới', U.fmt(rate) + '/s']);
    const rt = Player.rootType();
    rate *= rt.mult; parts.push(['Linh căn', '×' + rt.mult]);
    const ng = 1 + 0.04 * a.ngoTinh; rate *= ng; parts.push(['Ngộ tính', '×' + ng.toFixed(2)]);
    const t = D.techniques[p.tech];
    const tm = t.mult * (1 + 0.08 * ((p.techs[p.tech] || 1) - 1));
    rate *= tm; parts.push(['Công pháp', '×' + tm.toFixed(2)]);
    if (Player.hasElement(t.el)) {
      const mb = 1 + Player.matchBonus(); rate *= mb; parts.push(['Hợp linh căn', '×' + mb.toFixed(2)]);
    }
    const cm = Cave.mult(); rate *= cm; parts.push(['Động phủ', '×' + cm.toFixed(2)]);
    const cb = 1 + (b.cult || 0) / 100; rate *= cb; if (b.cult) parts.push(['Gia trì', '×' + cb.toFixed(2)]);
    if (p.tox > 0) { const tf = 1 - p.tox * 0.005; rate *= tf; parts.push(['Đan độc', '×' + tf.toFixed(2)]); }
    if (Player.isInjured()) { rate *= 0.5; parts.push(['Trọng thương', '×0.5']); }
    return detail ? { rate, parts } : rate;
  },

  insightRate() {
    const b = Player.bonuses(), a = Player.attrs();
    return 0.05 * (1 + 0.5 * G.player.realm) * (1 + 0.1 * a.ngoTinh) * (1 + (b.insight || 0) / 100);
  },

  lifespan() {
    const b = Player.bonuses();
    const base = Player.realm().life + G.player.lifeBonus;
    return Math.floor(base * (1 + (b.life || 0) / 100));
  },

  /** Cộng tu vi; tự đột phá tiểu cảnh giới nếu bật. Trả về số tầng đã lên */
  gainTuVi(amount, allowAuto = true) {
    const p = G.player;
    let ups = 0;
    let guard = 0;
    while (amount > 0 && guard++ < 200) {
      if (Player.isMax()) { p.tuVi = Math.min(p.tuVi + amount, Player.req()); break; }
      const req = Player.req();
      if (p.tuVi + amount < req) { p.tuVi += amount; break; }
      if (!Player.isMajorNext() && allowAuto && G.settings.autoBreak) {
        amount -= req - p.tuVi;
        p.tuVi = 0;
        Player.advanceMinor(true);
        ups++;
      } else {
        p.tuVi = req;
        break;
      }
    }
    return ups;
  },

  canBreak() { return !Player.isMax() && G.player.tuVi >= Player.req(); },

  advanceMinor(quiet) {
    const p = G.player;
    p.stage++;
    p.tuVi = 0;
    Stats.add('breakthroughs');
    Player.onRealmChange();
    if (!quiet) UI.toast('Đột phá thành công: ' + D.stageName(p.realm, p.stage), 'good');
    Log.add('Đột phá ' + D.stageName(p.realm, p.stage) + '.', 'realm');
    Sfx.play('up');
  },

  /** Tỉ lệ đột phá đại cảnh giới (loại chance) */
  breakChance(usePill) {
    const p = G.player, next = D.realms[p.realm + 1];
    if (!next) return 0;
    if (next.type === 'auto') return 1;
    const a = Player.attrs();
    let c = (next.chance || 0.5) + a.khiVan * 0.01 + p.breakFails * 0.05;
    if (usePill) c += 0.3;
    return U.clamp(c, 0.05, 1);
  },

  /** Đột phá đại cảnh giới (auto/chance). Thiên kiếp xử lý ở Trib */
  majorBreak(usePill) {
    const p = G.player, next = D.realms[p.realm + 1];
    if (!next || !Player.canBreak()) return null;
    if (next.type === 'trib') return null;
    if (usePill && next.pill && Inv.has(next.pill)) Inv.remove(next.pill, 1);
    else usePill = false;
    const chance = Player.breakChance(usePill);
    if (Math.random() < chance) {
      Player.enterRealm(p.realm + 1);
      return { ok: true, chance };
    }
    p.tuVi = Math.floor(p.tuVi * 0.7);
    p.breakFails++;
    p.injuredUntil = Date.now() + 5 * 60 * 1000;
    Log.add('Đột phá ' + next.name + ' thất bại! Tu vi tổn hao, kinh mạch bị thương.', 'bad');
    Sfx.play('fail');
    return { ok: false, chance };
  },

  enterRealm(r) {
    const p = G.player;
    p.realm = r;
    p.stage = 0;
    p.tuVi = 0;
    p.breakFails = 0;
    Stats.add('breakthroughs');
    Player.onRealmChange();
    const st = Player.stats();
    p.hp = st.hp; p.mp = st.mp;
    Log.add('Chúc mừng! Đột phá thành công ' + D.realms[r].name + ' kỳ. Thọ nguyên tăng lên ' + Player.lifespan() + ' năm.', 'realm');
    Sfx.play('realm');
    UI.flash(D.realms[r].color);
  },

  onRealmChange() {
    const gs = Player.gs();
    if (gs > (G.reinc.bestGs || 0)) G.reinc.bestGs = gs;
    Quests.check();
    Ach.check();
  },

  /** Hồi phục ngoài chiến đấu mỗi tick */
  regen(dt) {
    const p = G.player, st = Player.stats();
    if (Combat.active()) return;
    p.hp = Math.min(st.hp, p.hp + st.hp * 0.025 * dt);
    p.mp = Math.min(st.mp, p.mp + st.mp * 0.03 * dt);
  },

  /** Tick tu luyện chính */
  tick(dt, offline) {
    const p = G.player;
    const rate = Player.cultRate();
    const gain = rate * dt * (offline ? 0.8 : 1);
    Player.gainTuVi(gain);
    p.insight += Player.insightRate() * dt * (offline ? 0.8 : 1);
    p.tox = Math.max(0, p.tox - dt / 60);
    p.age += dt / D.YEAR_SECONDS;
    for (const k in p.buffs) if (p.buffs[k].until <= Date.now()) delete p.buffs[k];
    if (!offline) Player.regen(dt);
    return gain;
  },

  karmaLabel() {
    const k = G.player.karma;
    if (k >= 100) return ['Đại Thiện', 'good'];
    if (k >= 30) return ['Chính Nghĩa', 'good'];
    if (k <= -100) return ['Ma Đầu', 'bad'];
    if (k <= -30) return ['Tà Đạo', 'bad'];
    return ['Trung Lập', ''];
  },

  addKarma(n) { G.player.karma = U.clamp(G.player.karma + n, -500, 500); Ach.check(); },

  gainStones(n, noBonus) {
    if (!noBonus) {
      const b = Player.bonuses();
      n *= 1 + (b.stonePct || 0) / 100;
    }
    n = Math.floor(n);
    G.player.stones += n;
    Stats.add('stonesEarned', n);
    return n;
  },
  spendStones(n) {
    n = Math.ceil(n);
    if (G.player.stones < n) return false;
    G.player.stones -= n;
    return true;
  },

  /** Bế quan: đổi thọ nguyên lấy tu vi */
  beQuan(years) {
    const p = G.player;
    if (Combat.active()) return { err: 'Đang chiến đấu, không thể bế quan.' };
    if (p.age + years >= Player.lifespan()) return { err: 'Thọ nguyên không đủ để bế quan ' + years + ' năm.' };
    const rate = Player.cultRate();
    const before = Player.gs();
    const gain = rate * years * 30;
    p.age += years;
    const ups = Player.gainTuVi(gain);
    const ins = Player.insightRate() * years * 20;
    p.insight += ins;
    p.tox = Math.max(0, p.tox - years * 0.5);
    Stats.add('beQuanYears', years);
    Quests.check();
    Ach.check();
    return { gain, ins, ups, before };
  },
};

/* Bộ đếm thống kê trọn đời */
const Stats = {
  add(k, n = 1) {
    G.stats[k] = (G.stats[k] || 0) + n;
    Quests.onStat(k);
  },
  get(k) { return G.stats[k] || 0; },
};

/* Nhật ký sự kiện */
const Log = {
  add(msg, type = '') {
    const t = new Date();
    const time = String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');
    G.log.unshift({ msg, type, time });
    if (G.log.length > 150) G.log.length = 150;
    UI.appendLog && UI.appendLog({ msg, type, time });
  },
};

/* ===== js/systems/inventory.js ===== */
'use strict';
/* Hành trang, trang bị, phần thưởng */

const Inv = {
  count(id) { return G.inv[id] || 0; },
  has(id, n = 1) { return (G.inv[id] || 0) >= n; },
  add(id, n = 1) {
    if (!D.items[id] || n <= 0) return;
    G.inv[id] = (G.inv[id] || 0) + n;
    const cat = D.items[id].cat;
    if (cat === 'herb') Stats.add('herbs', n);
  },
  remove(id, n = 1) {
    if ((G.inv[id] || 0) < n) return false;
    G.inv[id] -= n;
    if (G.inv[id] <= 0) delete G.inv[id];
    return true;
  },
  hasAll(map, mult = 1) {
    for (const id in map) if (!Inv.has(id, map[id] * mult)) return false;
    return true;
  },
  removeAll(map, mult = 1) {
    if (!Inv.hasAll(map, mult)) return false;
    for (const id in map) Inv.remove(id, map[id] * mult);
    return true;
  },
  buyPrice(id) {
    const it = D.items[id];
    const bg = D.backgrounds.find((b) => b.id === G.player.bg);
    const disc = (bg && bg.shopDiscount) || 0;
    return Math.max(1, Math.floor(it.price * D.tierPrice(it.tier) * (1 - disc)));
  },
  sellPrice(id) {
    const it = D.items[id];
    return Math.max(1, Math.floor(it.price * D.tierPrice(it.tier) * 0.35));
  },
  sell(id, n = 1) {
    n = Math.min(n, Inv.count(id));
    if (n <= 0) return 0;
    Inv.remove(id, n);
    return Player.gainStones(Inv.sellPrice(id) * n, true);
  },

  /** Dùng vật phẩm ngoài chiến đấu */
  use(id, n = 1) {
    const it = D.items[id];
    const p = G.player;
    if (!it || !Inv.has(id)) return { ok: false, msg: 'Không có vật phẩm.' };
    if (it.cat === 'book') return Inv.learn(id);
    if (it.cat === 'egg') return Pets.placeEgg(id);
    const e = it.effect;
    if (!e) return { ok: false, msg: 'Vật phẩm này không thể sử dụng trực tiếp.' };
    let used = 0;
    const msgs = [];
    const st = Player.stats();
    for (let i = 0; i < n; i++) {
      if (!Inv.has(id)) break;
      let m = null;
      switch (e.type) {
        case 'heal':
          if (p.hp >= st.hp && (!e.mp || p.mp >= st.mp)) { m = '!Sinh lực đã đầy.'; break; }
          p.hp = Math.min(st.hp, p.hp + st.hp * e.pct);
          if (e.mp) p.mp = Math.min(st.mp, p.mp + st.mp * e.mp);
          m = 'Hồi phục sinh lực.';
          break;
        case 'mp':
          if (p.mp >= st.mp) { m = '!Linh lực đã đầy.'; break; }
          p.mp = Math.min(st.mp, p.mp + st.mp * e.pct);
          m = 'Hồi phục linh lực.';
          break;
        case 'cure':
          if (!Player.isInjured()) { m = '!Ngươi không bị thương.'; break; }
          p.injuredUntil = 0; m = 'Thương thế đã lành.';
          break;
        case 'tuvi': {
          if (Player.isMax()) { m = '!Tu vi đã đạt đỉnh.'; break; }
          if (p.tox >= 90) { m = '!Đan độc quá nặng, không thể dùng thêm.'; break; }
          if (Player.canBreak()) { m = '!Tu vi đã đầy, hãy đột phá trước.'; break; }
          const f = it.tier >= p.realm ? 1 : Math.pow(0.35, p.realm - it.tier);
          const amt = Player.cultRate() * e.sec * f;
          Player.gainTuVi(amt);
          p.tox = Math.min(100, p.tox + e.tox);
          m = '+' + U.fmt(amt) + ' tu vi' + (f < 1 ? ' (đan dược cấp thấp, hiệu quả giảm)' : '') + '.';
          break;
        }
        case 'buff':
          p.buffs[e.buff] = { val: e.val, until: Date.now() + e.dur * 1000 };
          m = it.desc;
          break;
        case 'attr':
          if ((p.attrPills[e.attr] || 0) >= 5) { m = '!Đã dùng tối đa loại đan này trong kiếp này.'; break; }
          p.attrPills[e.attr] = (p.attrPills[e.attr] || 0) + 1;
          m = D.attrs[e.attr].name + ' +1.';
          break;
        case 'detox':
          if (p.tox <= 0) { m = '!Cơ thể không có đan độc.'; break; }
          p.tox = Math.max(0, p.tox - e.val); m = 'Đan độc giảm ' + e.val + '.';
          break;
        case 'life': {
          if (p.lifePills >= 8) { m = '!Thọ Nguyên Đan đã mất hiệu lực với ngươi.'; break; }
          const add = Math.max(20, Math.floor(Player.realm().life * e.pct));
          p.lifeBonus += add; p.lifePills++;
          m = 'Thọ nguyên +' + add + ' năm.';
          break;
        }
        case 'insight': {
          const b = Player.bonuses();
          const amt = Math.floor(e.base * (1 + p.realm) * (1 + (b.insight || 0) / 100));
          p.insight += amt; m = '+' + U.fmt(amt) + ' ngộ đạo.';
          break;
        }
        case 'dungeonTicket':
          G.dungeon.bonus++; m = 'Thêm 1 lượt vào bí cảnh.';
          break;
        case 'stoneBag': {
          const amt = Player.gainStones(40 * D.statScale(Player.gs()) * U.rand(0.8, 1.5), true);
          m = '+' + U.fmt(amt) + ' linh thạch.';
          break;
        }
        case 'reroot':
          Inv.remove(id, 1);
          UI.rerootModal();
          return { ok: true, msg: '' };
        case 'break':
          m = '!Đan dược này được dùng tự động khi đột phá ' + D.realms[e.realm].name + '.';
          break;
        case 'charm':
          m = '!Tị Lôi Phù tự kích hoạt khi độ kiếp.';
          break;
        default:
          m = '!Không thể sử dụng.';
      }
      if (m && m[0] === '!') {
        if (!used) return { ok: false, msg: m.slice(1) };
        break;
      }
      Inv.remove(id, 1);
      used++;
      msgs.length = 0; msgs.push(m);
    }
    Quests.check();
    return { ok: used > 0, msg: (used > 1 ? 'Dùng ' + used + ' ' + it.name + '. ' : 'Dùng ' + it.name + '. ') + (msgs[0] || '') };
  },

  learn(id) {
    const it = D.items[id], p = G.player;
    const L = it.learn;
    if (L.kind === 'tech') {
      const t = D.techniques[L.id];
      if (p.techs[L.id]) {
        const ins = 30 * Math.pow(2, t.grade);
        Inv.remove(id, 1); p.insight += ins;
        return { ok: true, msg: 'Đã lĩnh ngộ ' + t.name + ' từ trước, chuyển hóa thành ' + ins + ' ngộ đạo.' };
      }
      Inv.remove(id, 1);
      p.techs[L.id] = 1;
      Log.add('Lĩnh ngộ công pháp ' + t.name + '.', 'good');
      return { ok: true, msg: 'Lĩnh ngộ công pháp ' + t.name + '! Vào trang Công Pháp để chuyển tu.' };
    }
    const s = D.skills[L.id];
    if (p.skills[L.id]) {
      const ins = 15 * s.tier;
      Inv.remove(id, 1); p.insight += ins;
      return { ok: true, msg: 'Đã học ' + s.name + ' từ trước, chuyển hóa thành ' + ins + ' ngộ đạo.' };
    }
    Inv.remove(id, 1);
    p.skills[L.id] = 1;
    if (p.eq.length < D.SKILL_SLOTS) p.eq.push(L.id);
    Log.add('Học được thần thông ' + s.name + '.', 'good');
    Quests.check();
    return { ok: true, msg: 'Học được thần thông ' + s.name + (p.eq.includes(L.id) ? ' và đã trang bị.' : '.') };
  },

  /** Danh sách vật phẩm theo nhóm */
  list(cat) {
    const out = [];
    for (const id in G.inv) {
      const it = D.items[id];
      if (!it) continue;
      if (cat && cat !== 'all' && it.cat !== cat) continue;
      out.push(it);
    }
    const order = { pill: 0, herb: 1, ore: 2, core: 3, book: 4, egg: 5, special: 6 };
    out.sort((a, b) => (order[a.cat] - order[b.cat]) || (a.tier - b.tier) || a.name.localeCompare(b.name));
    return out;
  },
};

const Gear = {
  MAX: 150,
  get(uid) { return uid ? G.gear.find((g) => g.uid === uid) : null; },
  name(g) { return D.slots[g.slot].names[g.tier - 1] + (g.enh ? ' +' + g.enh : ''); },
  reqRealm(g) { return Math.max(0, g.tier - 1); },
  isEquipped(g) { return G.player.equip[g.slot] === g.uid; },

  rollAffixes(q) {
    const n = D.qualities[q].affixes;
    const pool = D.affixes.slice();
    const out = [];
    for (let i = 0; i < n && pool.length; i++) {
      const a = U.weighted(pool);
      pool.splice(pool.indexOf(a), 1);
      out.push({ k: a.k, v: Math.round(a.base * (1 + 0.5 * q) * U.rand(0.7, 1.3) * 10) / 10 });
    }
    return out;
  },

  rollQuality(bonusPct = 0, minQ = 0) {
    const list = D.qualities.map((q, i) => ({ i, w: i < minQ ? 0 : q.w * Math.pow(1 + bonusPct / 100, i) }));
    return U.weighted(list).i;
  },

  create(slot, tier, q) {
    const g = { uid: U.uid(), slot, tier: U.clamp(tier, 1, 10), q, enh: 0, affixes: Gear.rollAffixes(q), lock: false };
    G.gear.push(g);
    if (G.settings.autoSalvage >= 0 && q <= G.settings.autoSalvage && G.player && G.player.equip && Object.keys(G.player.equip).length >= 2) {
      const r = Gear.salvage(g.uid, true);
      if (r) { g._salvaged = true; }
    }
    return g;
  },

  randomSlot() { return U.pick(D.slotOrder); },

  mainStats(g) {
    const base = D.slots[g.slot].main, out = {};
    const qm = D.qualities[g.q].mult;
    for (const k in base) {
      if (D.flatKeys[k] && k !== 'spd') out[k] = base[k] * D.tierScale(g.tier) * qm * (1 + 0.07 * g.enh);
      else if (k === 'spd') out[k] = (base[k] + 0.6 * g.tier) * qm * (1 + 0.05 * g.enh);
      else out[k] = (base[k] + 0.3 * g.tier) * qm * (1 + 0.05 * g.enh);
    }
    return out;
  },

  value(g) { return Math.floor(10 * D.tierPrice(g.tier) * Math.pow(D.qualities[g.q].mult, 2) * (1 + 0.15 * g.enh)); },

  equip(uid, force) {
    const g = Gear.get(uid);
    if (!g) return { ok: false, msg: 'Không tìm thấy trang bị.' };
    if (!force && G.player.realm < Gear.reqRealm(g)) return { ok: false, msg: 'Cần đạt ' + D.realms[Gear.reqRealm(g)].name + ' để trang bị.' };
    const p = G.player;
    const st0 = Player.stats();
    p.equip[g.slot] = uid;
    const st = Player.stats();
    p.hp = Math.min(st.hp, p.hp * (st.hp / Math.max(1, st0.hp)));
    p.mp = Math.min(st.mp, p.mp);
    return { ok: true, msg: 'Đã trang bị ' + Gear.name(g) + '.' };
  },
  unequip(slot) {
    delete G.player.equip[slot];
    const st = Player.stats();
    G.player.hp = Math.min(G.player.hp, st.hp);
    G.player.mp = Math.min(G.player.mp, st.mp);
  },

  remove(uid) {
    const i = G.gear.findIndex((g) => g.uid === uid);
    if (i >= 0) G.gear.splice(i, 1);
  },

  sell(uid) {
    const g = Gear.get(uid);
    if (!g || g.lock || Gear.isEquipped(g)) return 0;
    Gear.remove(uid);
    return Player.gainStones(Gear.value(g), true);
  },

  salvageYield(g) {
    return { ore: D.oreByTier[g.tier], n: 1 + g.q + Math.floor(g.enh / 3), stones: Math.floor(Gear.value(g) * 0.3) };
  },
  salvage(uid, quiet) {
    const g = Gear.get(uid);
    if (!g || g.lock || Gear.isEquipped(g)) return null;
    const y = Gear.salvageYield(g);
    Gear.remove(uid);
    Inv.add(y.ore, y.n);
    Player.gainStones(y.stones, true);
    if (!quiet) Sfx.play('coin');
    return y;
  },

  enhanceCost(g) {
    return {
      stones: Math.floor(20 * D.tierPrice(g.tier) * Math.pow(g.enh + 1, 1.5)),
      ore: D.oreByTier[g.tier],
      n: 1 + Math.floor(g.enh / 3),
    };
  },
  enhanceChance(g) {
    const b = Player.bonuses();
    const base = g.enh < 3 ? 1 : Math.max(0.3, 1 - (g.enh - 2) * 0.055);
    return Math.min(1, base + (b.forge || 0) / 200);
  },
  enhance(uid) {
    const g = Gear.get(uid);
    if (!g) return { ok: false, msg: 'Không tìm thấy trang bị.' };
    if (g.enh >= 15) return { ok: false, msg: 'Đã cường hóa tối đa.' };
    const c = Gear.enhanceCost(g);
    if (G.player.stones < c.stones) return { ok: false, msg: 'Không đủ linh thạch.' };
    if (!Inv.has(c.ore, c.n)) return { ok: false, msg: 'Thiếu ' + c.n + ' ' + D.items[c.ore].name + '.' };
    Player.spendStones(c.stones);
    Inv.remove(c.ore, c.n);
    Stats.add('enhances');
    if (Math.random() < Gear.enhanceChance(g)) {
      g.enh++;
      Ach.check();
      Sfx.play('up');
      return { ok: true, success: true, msg: 'Cường hóa thành công! ' + Gear.name(g) };
    }
    let msg = 'Cường hóa thất bại.';
    if (g.enh >= 10) { g.enh--; msg += ' Cấp cường hóa giảm còn +' + g.enh + '.'; }
    Sfx.play('fail');
    return { ok: true, success: false, msg };
  },

  sorted(filter) {
    const list = G.gear.filter((g) => !filter || filter === 'all' || g.slot === filter);
    return list.sort((a, b) => (Gear.isEquipped(b) - Gear.isEquipped(a)) || (b.tier - a.tier) || (b.q - a.q) || (b.enh - a.enh));
  },

  /** Điểm so sánh đơn giản để biết món nào tốt hơn */
  score(g) {
    const m = Gear.mainStats(g);
    let s = (m.atk || 0) * 3 + (m.def || 0) * 2 + (m.hp || 0) * 0.35 + (m.mp || 0) * 0.1 + (m.spd || 0) * 5 + (m.crit || 0) * 4 + (m.dodge || 0) * 4;
    const sc = D.tierScale(g.tier);
    for (const af of g.affixes) s += af.v * sc * 0.6;
    return s;
  },
};

/* Phát phần thưởng tổng hợp */
const Loot = {
  give(r, src) {
    const out = [];
    if (!r) return out;
    if (r.stones) out.push('💎 ' + U.fmt(Player.gainStones(r.stones, r.raw)) + ' linh thạch');
    if (r.insight) { G.player.insight += r.insight; out.push('💡 ' + U.fmt(r.insight) + ' ngộ đạo'); }
    if (r.contrib && G.sect) { Sect.addContrib(r.contrib); out.push('🏅 ' + U.fmt(r.contrib) + ' cống hiến'); }
    if (r.tuvi) { Player.gainTuVi(r.tuvi); out.push('✨ ' + U.fmt(r.tuvi) + ' tu vi'); }
    if (r.items) {
      for (const id in r.items) {
        if (!D.items[id] || r.items[id] <= 0) continue;
        Inv.add(id, r.items[id]);
        out.push(D.items[id].icon + ' ' + D.items[id].name + ' ×' + r.items[id]);
      }
    }
    if (r.gear) {
      for (const gd of r.gear) {
        const g = Gear.create(gd.slot || Gear.randomSlot(), gd.tier, gd.q);
        out.push('<span style="color:' + D.qualities[g.q].color + '">' + D.slots[g.slot].icon + ' ' + Gear.name(g) + ' (' + D.qualities[g.q].short + ')</span>' + (g._salvaged ? ' → phân giải' : ''));
      }
    }
    return out;
  },
};

/* ===== js/systems/combat.js ===== */
'use strict';
/* Hệ thống chiến đấu theo lượt (thanh hành động theo tốc độ) */

const Combat = {
  b: null,
  timer: null,
  SPEEDS: { 1: 650, 2: 330, 4: 160 },

  active() { return !!(Combat.b && !Combat.b.over); },

  elemMod(atkEl, defEl) {
    if (!atkEl || atkEl === 'none' || !defEl) return 1;
    if (atkEl === 'all') return 1.15;
    const ae = D.elements[atkEl], de = D.elements[defEl];
    if (!ae || !de) return 1;
    if (ae.variant) return de.variant ? 1 : 1.15;
    if (de.variant) return 0.9;
    if (D.counters[atkEl] === defEl) return 1.3;
    if (D.counters[defEl] === atkEl) return 0.8;
    return 1;
  },

  makeEnemy(monId, gs, opts = {}) {
    const m = D.monsters[monId];
    /* Hiệu chỉnh theo người chơi điển hình: ~6 lượt để hạ, mỗi đòn mất ~5% sinh lực */
    const E = D.expected(gs);
    const k = (opts.mult || 1) * (gs > D.MAX_GS ? Math.pow(1.12, gs - D.MAX_GS) : 1);
    const h = E.hp * 0.055;
    const r = D.gsToRS(Math.min(gs, D.MAX_GS)).r;
    let hp = 4.4 * E.atk * (1.4 + 0.35 * r) * m.hp * k;
    let atk = (h + Math.sqrt(h * h + 4 * h * E.def)) / 2 * m.atk * k;
    let def = 0.35 * E.atk * m.def * k;
    const spd = 10 * m.spd * (1 + 0.01 * Math.min(gs, 60));
    let crit = 5, critDmg = 150;
    if (opts.elite) { hp *= 1.6; atk *= 1.12; def *= 1.1; }
    if (opts.boss) { hp *= 3; atk *= 1.25; def *= 1.15; crit = 12; critDmg = 170; }
    let name = m.name;
    if (opts.elite) name = 'Tinh Anh · ' + name;
    if (opts.title) name = opts.title;
    return {
      id: monId, name, icon: m.icon, el: m.el, gs, lvName: D.gsName(Math.min(gs, D.MAX_GS)),
      hp: Math.floor(hp), maxHp: Math.floor(hp), mp: 0, maxMp: 0,
      atk: Math.floor(atk), def: Math.floor(def), spd, crit, critDmg, dodge: 3, lifesteal: 0,
      skills: m.skills.map((id) => ({ s: D.mskills[id], lv: 1 })),
      cds: {}, effs: [], shield: 0, gauge: U.rand(0, 30), boss: !!opts.boss, elite: !!opts.elite, side: 'enemy',
    };
  },

  makePlayer(sim) {
    const p = G.player, st = Player.stats();
    return {
      name: p.name, icon: p.gender === 'nu' ? '🧘‍♀️' : '🧘‍♂️', el: 'none',
      hp: sim ? st.hp : Math.max(1, Math.min(p.hp, st.hp)), maxHp: st.hp,
      mp: sim ? st.mp : Math.min(p.mp, st.mp), maxMp: st.mp,
      atk: st.atk, def: st.def, spd: st.spd, crit: st.crit, critDmg: st.critDmg, dodge: st.dodge, lifesteal: st.lifesteal,
      skills: p.eq.filter((id) => D.skills[id]).map((id) => ({ s: D.skills[id], lv: p.skills[id] || 1 })),
      cds: {}, effs: [], shield: 0, gauge: U.rand(10, 40), side: 'player', isPlayer: true,
    };
  },

  /** opts: {kind, title, sim, onWin(b)->string[], onLose(b), onEnd(b), canFlee} */
  start(enemy, opts = {}) {
    if (Combat.active()) return false;
    const pet = Pets.active();
    const b = {
      kind: opts.kind || 'explore', title: opts.title || '', opts,
      player: Combat.makePlayer(opts.sim), enemy,
      pet: pet ? Pets.fighter(pet) : null,
      turn: 0, log: [], events: [], over: false, result: null, rewards: [],
      waiting: false, potions: 0,
    };
    Combat.b = b;
    Combat.say(b, '⚔️ Gặp ' + enemy.name + ' (' + enemy.lvName + ')', 'sys');
    UI.battleStart && UI.battleStart(b);
    Combat.schedule(400);
    return true;
  },

  schedule(ms) {
    clearTimeout(Combat.timer);
    const delay = ms != null ? ms : Combat.SPEEDS[G.settings.battleSpeed] || 650;
    Combat.timer = setTimeout(Combat.step, delay);
  },

  say(b, text, cls = '') {
    b.seq = (b.seq || 0) + 1;
    b.log.push({ text, cls, id: b.seq });
    if (b.log.length > 80) b.log.shift();
  },
  pop(b, side, text, cls) { b.events.push({ side, text, cls }); },

  /** Hệ số buff/debuff */
  mod(f, up, down) {
    let m = 1;
    for (const e of f.effs) {
      if (e.type === up) m += e.pow;
      if (e.type === down) m -= e.pow;
    }
    return Math.max(0.2, m);
  },

  nextActor(b) {
    const fs = [b.player, b.enemy];
    let best = null, bt = Infinity;
    for (const f of fs) {
      const t = (100 - f.gauge) / Math.max(1, f.spd);
      if (t < bt) { bt = t; best = f; }
    }
    if (bt > 0) for (const f of fs) f.gauge += f.spd * bt;
    best.gauge -= 100;
    return best;
  },

  step() {
    const b = Combat.b;
    if (!b || b.over) return;
    if (b.waiting) return;
    const actor = b.nextActor || Combat.nextActor(b);
    b.nextActor = null;
    const target = actor === b.player ? b.enemy : b.player;
    b.turn++;
    /* Hiệu ứng đầu lượt */
    Combat.tickEffects(b, actor);
    if (Combat.checkEnd(b)) return;
    if (actor.stunned) {
      actor.stunned = false;
      Combat.say(b, actor.name + ' bị choáng, mất lượt!', 'muted');
      Combat.pop(b, actor.side, 'Choáng', 'stun');
      return Combat.afterAction(b, actor);
    }
    for (const k in actor.cds) if (actor.cds[k] > 0) actor.cds[k]--;
    if (actor.isPlayer) {
      actor.mp = Math.min(actor.maxMp, actor.mp + actor.maxMp * 0.06);
      const manual = !G.settings.autoBattle && UI.battleVisible && UI.battleVisible();
      if (manual) {
        b.waiting = true;
        b.actorPending = actor;
        UI.battleUpdate && UI.battleUpdate(b);
        return;
      }
      Combat.playerAuto(b);
    } else {
      Combat.enemyAct(b, actor, target);
    }
    Combat.afterAction(b, actor);
  },

  afterAction(b, actor) {
    if (actor && actor.isPlayer && b.pet && !b.over) Combat.petAct(b);
    if (Combat.checkEnd(b)) return;
    if (b.turn > 200) { Combat.finish(b, 'lose', 'Trận chiến kéo dài quá lâu, ngươi kiệt sức rút lui.'); return; }
    UI.battleUpdate && UI.battleUpdate(b);
    Combat.schedule();
  },

  /** Người chơi thao tác tay: choice = 'attack' | skillId | 'item:<id>' | 'flee' */
  playerAct(choice) {
    const b = Combat.b;
    if (!b || b.over || !b.waiting) return;
    const pl = b.player;
    if (choice === 'flee') {
      b.waiting = false;
      return Combat.flee(b);
    }
    if (choice.startsWith('item:')) {
      const ok = Combat.useItem(b, choice.slice(5));
      if (!ok) return;
    } else if (choice === 'attack') {
      Combat.doSkill(b, pl, b.enemy, null);
    } else {
      const sk = pl.skills.find((x) => x.s.id === choice);
      if (!sk || !Combat.canUse(pl, sk)) return;
      Combat.doSkill(b, pl, b.enemy, sk);
    }
    b.waiting = false;
    Combat.afterAction(b, pl);
  },

  canUse(f, sk) {
    return !(f.cds[sk.s.id] > 0) && f.mp >= sk.s.mp * f.maxMp - 0.001;
  },

  bestHealItem(needMp) {
    const order = needMp ? ['cuu_chuyen_dan', 'hoi_linh_dan'] : ['cuu_chuyen_dan', 'dai_hoan_dan', 'hoi_khi_dan'];
    return order.find((id) => Inv.has(id));
  },

  useItem(b, id) {
    const it = D.items[id];
    if (!it || !Inv.has(id) || !it.effect) return false;
    const pl = b.player, e = it.effect;
    if (e.type === 'heal') {
      const h = pl.maxHp * e.pct;
      pl.hp = Math.min(pl.maxHp, pl.hp + h);
      if (e.mp) pl.mp = Math.min(pl.maxMp, pl.mp + pl.maxMp * e.mp);
      Combat.pop(b, 'player', '+' + U.fmt(h), 'heal');
    } else if (e.type === 'mp') {
      pl.mp = Math.min(pl.maxMp, pl.mp + pl.maxMp * e.pct);
      Combat.pop(b, 'player', '+MP', 'mp');
    } else if (e.type === 'buff' && (e.buff === 'atk' || e.buff === 'def')) {
      G.player.buffs[e.buff] = { val: e.val, until: Date.now() + e.dur * 1000 };
      Combat.addEff(pl, { type: e.buff === 'atk' ? 'atkUp' : 'defUp', pow: e.val / 100, turns: 99 });
    } else return false;
    Inv.remove(id, 1);
    b.potions++;
    Combat.say(b, pl.name + ' dùng ' + it.name + '.', 'good');
    return true;
  },

  playerAuto(b) {
    const pl = b.player;
    const hpR = pl.hp / pl.maxHp, mpR = pl.mp / pl.maxMp;
    if (G.settings.autoHeal && hpR < 0.35 && b.potions < 6) {
      const id = Combat.bestHealItem(false);
      if (id && Combat.useItem(b, id)) return;
    }
    if (G.settings.autoHeal && mpR < 0.12 && b.potions < 6 && pl.skills.length) {
      const id = Combat.bestHealItem(true);
      if (id && Combat.useItem(b, id)) return;
    }
    let best = null, bestScore = 1.0;
    for (const sk of pl.skills) {
      if (!Combat.canUse(pl, sk)) continue;
      const s = sk.s;
      let score = 0;
      if (s.self) {
        const heal = s.effs.find((e) => e.type === 'heal');
        const shield = s.effs.find((e) => e.type === 'shield');
        const buff = s.effs.find((e) => e.type === 'atkUp' || e.type === 'defUp');
        if (heal && hpR < 0.5) score = 3 + (1 - hpR) * 4;
        if (shield && hpR < 0.75 && pl.shield <= 0) score = Math.max(score, 2.5);
        if (buff && !pl.effs.some((e) => e.type === buff.type)) score = Math.max(score, 2.2);
      } else {
        score = s.mult * s.hits * (1 + 0.1 * (sk.lv - 1)) * Combat.elemMod(s.el, b.enemy.el);
        if (s.effs.some((e) => e.type === 'stun')) score += 0.3;
      }
      if (score > bestScore) { bestScore = score; best = sk; }
    }
    Combat.doSkill(b, pl, b.enemy, best);
  },

  enemyAct(b, en, target) {
    const hpR = en.hp / en.maxHp;
    let pick = null;
    const ready = en.skills.filter((sk) => !(en.cds[sk.s.id] > 0));
    for (const sk of ready) {
      const s = sk.s;
      if (s.self) {
        if (s.effs.some((e) => e.type === 'heal') && hpR < 0.4) { pick = sk; break; }
        if (s.effs.some((e) => (e.type === 'atkUp' || e.type === 'defUp') && !en.effs.some((x) => x.type === e.type)) && Math.random() < 0.5) { pick = sk; break; }
        if (s.effs.some((e) => e.type === 'shield') && en.shield <= 0 && hpR < 0.7) { pick = sk; break; }
      }
    }
    if (!pick) {
      const atk = ready.filter((sk) => !sk.s.self);
      if (atk.length && Math.random() < (en.boss ? 0.7 : 0.55)) pick = U.pick(atk);
    }
    Combat.doSkill(b, en, target, pick);
  },

  addEff(f, e) {
    if (['atkUp', 'defUp', 'atkDown', 'defDown'].includes(e.type)) {
      const ex = f.effs.find((x) => x.type === e.type);
      if (ex) { ex.pow = Math.max(ex.pow, e.pow); ex.turns = Math.max(ex.turns, e.turns); return; }
    }
    f.effs.push(e);
  },

  doSkill(b, att, def, sk) {
    const s = sk ? sk.s : null;
    const lvM = sk ? 1 + 0.1 * (sk.lv - 1) : 1;
    const name = s ? s.name : 'Tấn công';
    if (s) {
      if (att.isPlayer) att.mp -= s.mp * att.maxMp;
      att.cds[s.id] = s.cd + 1;
    }
    if (s && s.self) {
      Combat.say(b, att.name + ' thi triển ' + name + '.', att.isPlayer ? 'pl' : 'en');
      for (const e of s.effs) Combat.applyEff(b, att, att, e, lvM, att);
      return;
    }
    const hits = s ? s.hits : 1;
    const mult = (s ? s.mult : 1) * lvM;
    let total = 0, crits = 0, missed = 0;
    for (let h = 0; h < hits && def.hp > 0; h++) {
      const r = Combat.hit(b, att, def, mult, s);
      if (r.miss) missed++;
      else { total += r.dmg; if (r.crit) crits++; }
    }
    let txt = att.name + (s ? ' thi triển ' + name : ' tấn công');
    if (missed === hits) txt += ' — bị né tránh!';
    else txt += ', gây ' + U.fmt(total) + ' sát thương' + (crits ? ' (bạo kích!)' : '') + (hits > 1 ? ' [' + (hits - missed) + ' đòn]' : '') + '.';
    Combat.say(b, txt, att.isPlayer ? 'pl' : 'en');
    if (total > 0) {
      const ls = (att.lifesteal || 0) / 100 + (s && s.lifesteal ? s.lifesteal : 0);
      if (ls > 0) {
        const heal = total * ls;
        att.hp = Math.min(att.maxHp, att.hp + heal);
        Combat.pop(b, att.side, '+' + U.fmt(heal), 'heal');
      }
      if (s) for (const e of s.effs) Combat.applyEff(b, att, def, e, lvM, att);
    }
    Sfx.play(crits ? 'crit' : 'hit');
  },

  hit(b, att, def, mult, s) {
    if (Math.random() * 100 < def.dodge) {
      Combat.pop(b, def.side, 'Né', 'miss');
      return { miss: true };
    }
    const atk = att.atk * Combat.mod(att, 'atkUp', 'atkDown');
    let dfn = def.def * Combat.mod(def, 'defUp', 'defDown');
    if (s && s.pierce) dfn *= 1 - s.pierce;
    const el = s ? s.el : 'none';
    let em = Combat.elemMod(el, def.el);
    if (att.isPlayer && s && Player.hasElement(el)) em *= 1.2;
    let dmg = mult * atk * atk / (atk + dfn) * em * U.rand(0.92, 1.08);
    const crit = Math.random() * 100 < att.crit;
    if (crit) dmg *= att.critDmg / 100;
    dmg = Math.max(1, Math.floor(dmg));
    Combat.damage(b, def, dmg, crit ? 'crit' : 'dmg');
    return { dmg, crit };
  },

  damage(b, f, dmg, cls) {
    if (f.shield > 0) {
      const ab = Math.min(f.shield, dmg);
      f.shield -= ab; dmg -= ab;
      if (ab > 0) Combat.pop(b, f.side, '🛡' + U.fmt(ab), 'shield');
    }
    f.hp -= dmg;
    if (dmg > 0) Combat.pop(b, f.side, '-' + U.fmt(dmg), cls);
  },

  applyEff(b, src, tgt, e, lvM, caster) {
    const chance = (e.chance == null ? 1 : e.chance) + 0.02 * ((lvM - 1) / 0.1);
    const info = D.effectInfo[e.type];
    if (e.type === 'heal') {
      const h = tgt.maxHp * e.pow * (1 + (lvM - 1) * 0.5);
      tgt.hp = Math.min(tgt.maxHp, tgt.hp + h);
      Combat.pop(b, tgt.side, '+' + U.fmt(h), 'heal');
      return;
    }
    if (e.type === 'shield') {
      tgt.shield += tgt.maxHp * e.pow * (1 + (lvM - 1) * 0.5);
      Combat.pop(b, tgt.side, 'Hộ thuẫn', 'shield');
      return;
    }
    if (Math.random() > chance) return;
    if (e.type === 'stun') {
      if (tgt.boss && Math.random() < 0.5) return;
      tgt.stunned = true;
      Combat.say(b, info.icon + ' ' + tgt.name + ' bị choáng!', 'muted');
      return;
    }
    if (info.dot) {
      Combat.addEff(tgt, { type: e.type, turns: e.turns, dmg: caster.atk * e.pow * (1 + (lvM - 1) * 0.5) * 0.6 });
      Combat.say(b, info.icon + ' ' + tgt.name + ' bị ' + info.name.toLowerCase() + '.', 'muted');
      return;
    }
    Combat.addEff(tgt, { type: e.type, pow: e.pow * (1 + (lvM - 1) * 0.3), turns: e.turns || 2 });
    Combat.say(b, info.icon + ' ' + tgt.name + ': ' + info.name + '.', 'muted');
  },

  tickEffects(b, f) {
    for (const e of f.effs) {
      const info = D.effectInfo[e.type];
      if (info && info.dot) {
        const d = Math.max(1, Math.floor(e.dmg));
        f.hp -= d;
        Combat.pop(b, f.side, '-' + U.fmt(d), 'dot');
      }
      e.turns--;
    }
    f.effs = f.effs.filter((e) => e.turns > 0);
  },

  petAct(b) {
    const pet = b.pet;
    pet.turn = (pet.turn || 0) + 1;
    const skill = pet.turn % 3 === 0;
    const mult = skill ? 2.2 : 0.9;
    const atk = pet.atk;
    const dfn = b.enemy.def * Combat.mod(b.enemy, 'defUp', 'defDown');
    let dmg = mult * atk * atk / (atk + dfn) * Combat.elemMod(pet.el, b.enemy.el) * U.rand(0.9, 1.1);
    dmg = Math.max(1, Math.floor(dmg));
    Combat.damage(b, b.enemy, dmg, 'pet');
    Combat.say(b, pet.icon + ' ' + pet.name + (skill ? ' tung tuyệt kỹ' : ' tấn công') + ', gây ' + U.fmt(dmg) + ' sát thương.', 'pet');
  },

  flee(b) {
    const chance = b.enemy.boss ? 0.35 : 0.6 + (b.player.spd - b.enemy.spd) * 0.02;
    if (Math.random() < U.clamp(chance, 0.2, 0.9)) {
      Combat.finish(b, 'flee', 'Ngươi thi triển độn thuật, thoát khỏi trận chiến.');
    } else {
      Combat.say(b, 'Chạy trốn thất bại!', 'bad');
      Combat.afterAction(b, b.player);
    }
  },

  checkEnd(b) {
    if (b.over) return true;
    if (b.enemy.hp <= 0) { Combat.finish(b, 'win'); return true; }
    if (b.player.hp <= 0) { Combat.finish(b, 'lose'); return true; }
    return false;
  },

  finish(b, result, msg) {
    if (b.over) return;
    b.over = true;
    b.result = result;
    clearTimeout(Combat.timer);
    b.waiting = false;
    const p = G.player;
    if (!b.opts.sim) {
      p.hp = Math.max(1, Math.floor(b.player.hp));
      p.mp = Math.max(0, Math.floor(b.player.mp));
    }
    if (result === 'win') {
      Combat.say(b, '🏆 Chiến thắng! Đánh bại ' + b.enemy.name + '.', 'good');
      if (b.pet) Pets.gainBattleExp(b.enemy.gs);
      try { b.rewards = (b.opts.onWin && b.opts.onWin(b)) || []; } catch (e) { console.error(e); b.rewards = []; }
      Sfx.play('win');
    } else if (result === 'lose') {
      Combat.say(b, msg || '💀 Thất bại! Ngươi bị trọng thương phải rút lui.', 'bad');
      if (!b.opts.sim) {
        p.hp = 1;
        const loss = Math.floor(p.tuVi * 0.05);
        p.tuVi -= loss;
        if (loss > 0) Combat.say(b, 'Tu vi tổn hao ' + U.fmt(loss) + '.', 'bad');
      }
      try { b.opts.onLose && b.opts.onLose(b); } catch (e) { console.error(e); }
      Sfx.play('fail');
    } else {
      Combat.say(b, msg, 'muted');
      try { b.opts.onLose && b.opts.onLose(b); } catch (e) { console.error(e); }
    }
    for (const r of b.rewards) Combat.say(b, '🎁 ' + r, 'loot');
    Quests.check();
    Ach.check();
    UI.battleUpdate && UI.battleUpdate(b);
    try { b.opts.onEnd && b.opts.onEnd(b); } catch (e) { console.error(e); }
  },

  /** Đóng trận đã kết thúc */
  clear() {
    if (Combat.b && Combat.b.over) Combat.b = null;
  },

  /** Hủy trận (ví dụ khi luân hồi) */
  abort() {
    clearTimeout(Combat.timer);
    Combat.b = null;
  },
};

/* ===== js/systems/explore.js ===== */
'use strict';
/* Thám hiểm bản đồ, rơi đồ, thủ lĩnh */

const Explore = {
  busy: false,
  auto: false,
  timer: null,
  progressStart: 0,
  DURATION: 1100,
  BOSS_CD: 180 * 1000,

  map() { return D.mapById[G.map] || D.maps[0]; },
  unlocked(m) { return Player.gs() >= m.lv[0] - 1 || m.index === 0; },

  setMap(id) {
    const m = D.mapById[id];
    if (!m || !Explore.unlocked(m)) return false;
    if (Combat.active() || Explore.busy) return false;
    G.map = id;
    return true;
  },

  /** Cấp yêu thú gặp phải, bám theo cảnh giới người chơi */
  monsterGs(m) {
    const g = Player.gs();
    return U.clamp(g + U.randInt(-1, 1), m.index === 0 ? 0 : m.lv[0], m.lv[1]);
  },

  start() {
    if (Explore.busy || Combat.active() || UI.modalOpen()) return false;
    if (Dungeon.busy()) {
      UI.toast('Đang ở trong bí cảnh — hãy hoàn thành hoặc rời bí cảnh trước.', 'bad');
      Explore.setAuto(false);
      return false;
    }
    const st = Player.stats();
    if (G.player.hp < st.hp * 0.15) {
      UI.toast('Sinh lực quá thấp, hãy nghỉ ngơi hoặc dùng đan dược.', 'bad');
      Explore.setAuto(false);
      return false;
    }
    Explore.busy = true;
    Explore.progressStart = Date.now();
    UI.exploreProgress && UI.exploreProgress(true);
    clearTimeout(Explore.timer);
    Explore.timer = setTimeout(Explore.resolve, Explore.DURATION);
    return true;
  },

  setAuto(v) {
    Explore.auto = !!v;
    if (!v) clearTimeout(Explore.autoTimer);
    UI.renderIf && UI.renderIf('explore');
  },

  scheduleAuto(ms = 700) {
    clearTimeout(Explore.autoTimer);
    if (!Explore.auto) return;
    Explore.autoTimer = setTimeout(Explore.autoStep, ms);
  },

  autoStep() {
    if (!Explore.auto) return;
    if (Combat.active() || Explore.busy || UI.modalOpen()) return Explore.scheduleAuto(1000);
    const p = G.player, st = Player.stats();
    if (p.hp < st.hp * 0.6) {
      if (G.settings.autoHeal && p.hp < st.hp * 0.4) {
        const id = Combat.bestHealItem(false);
        if (id) { Inv.use(id, 1); return Explore.scheduleAuto(300); }
      }
      UI.setExploreStatus && UI.setExploreStatus('Đang điều tức hồi phục…');
      return Explore.scheduleAuto(1000);
    }
    Explore.start();
  },

  resolve() {
    Explore.busy = false;
    UI.exploreProgress && UI.exploreProgress(false);
    const m = Explore.map();
    Stats.add('explores');
    const roll = U.weighted([
      { k: 'mon', w: 61 }, { k: 'herb', w: 14 }, { k: 'ore', w: 10 },
      { k: 'stones', w: 6 }, { k: 'event', w: 6 }, { k: 'chest', w: 3 },
    ]).k;
    const tier = m.tier;
    switch (roll) {
      case 'mon': {
        const mid = U.pick(m.mons);
        const elite = Math.random() < 0.08;
        Explore.fight(Combat.makeEnemy(mid, Explore.monsterGs(m), { elite, tier }), m, false);
        return;
      }
      case 'herb': {
        const id = U.pick(D.herbsByTier[tier]);
        const n = U.randInt(1, 2) + (Math.random() < Player.stats().drop / 200 ? 1 : 0);
        Inv.add(id, n);
        Explore.found('🌿 Phát hiện linh dược: ' + D.items[id].name + ' ×' + n);
        break;
      }
      case 'ore': {
        const id = D.oreByTier[tier];
        const n = U.randInt(1, 2);
        Inv.add(id, n);
        Explore.found('⛏️ Khai thác được ' + D.items[id].name + ' ×' + n);
        break;
      }
      case 'stones': {
        const n = Player.gainStones(6 * D.statScale(Explore.monsterGs(m)) * U.rand(0.8, 1.3));
        Explore.found('💎 Nhặt được ' + U.fmt(n) + ' linh thạch');
        break;
      }
      case 'event':
        Events.trigger(m);
        break;
      case 'chest': {
        const r = Explore.chestReward(tier, false);
        const txt = Loot.give(r);
        Explore.found('🎁 Tìm thấy rương báu: ' + txt.join(', '));
        Sfx.play('coin');
        break;
      }
    }
    Quests.check();
    Explore.scheduleAuto();
  },

  found(msg) {
    Log.add(msg, 'loot');
    UI.setExploreStatus && UI.setExploreStatus(msg);
    UI.renderIf && UI.renderIf('explore', true);
  },

  chestReward(tier, big) {
    const r = { items: {} };
    const roll = Math.random();
    if (roll < 0.4 || big) r.gear = [{ tier, q: Gear.rollQuality(Player.stats().drop + 40, big ? 2 : 1) }];
    if (roll >= 0.4 && roll < 0.7) r.items[U.pick(D.herbsByTier[tier])] = U.randInt(2, 4);
    if (roll >= 0.7 || big) r.items['yeu_dan_' + tier] = U.randInt(1, 3);
    if (Math.random() < (big ? 0.35 : 0.08)) {
      const books = Object.keys(D.skills).filter((id) => !D.skills[id].sect && D.skills[id].tier <= tier);
      r.items['book_s_' + U.pick(books)] = 1;
    }
    r.stones = 10 * D.statScale(D.realmStart[Math.min(tier, 10)] || 1);
    return r;
  },

  fight(enemy, m, isBoss) {
    Combat.start(enemy, {
      kind: 'explore',
      title: m.name,
      onWin: (b) => Explore.rewards(b.enemy, m, isBoss),
      onEnd: (b) => {
        if (b.result === 'lose') {
          Explore.setAuto(false);
          Log.add('Bại trận trước ' + b.enemy.name + '.', 'bad');
        }
        if (Explore.auto) Explore.scheduleAuto(1200);
      },
    });
  },

  rewards(en, m, isBoss) {
    const st = Player.stats();
    const dropMult = 1 + st.drop / 100;
    const r = { items: {} };
    Stats.add('kills');
    if (isBoss || en.boss) Stats.add('bossKills');
    if (G.sect) Sect.onKill();
    r.stones = 4 * D.statScale(en.gs) * U.rand(0.8, 1.2) * (en.boss ? 6 : en.elite ? 2 : 1);
    /* Tu vi từ chiến đấu */
    const diff = Player.gs() - en.gs;
    const lf = diff <= 0 ? 1 : Math.max(0.1, 1 - 0.25 * diff);
    const tv = Player.cultRate() * 1.5 * lf * (en.boss ? 5 : en.elite ? 2 : 1);
    if (!Player.canBreak()) r.tuvi = Math.floor(tv);
    const tier = m.tier;
    if (Math.random() < 0.35 * dropMult || en.boss) r.items['yeu_dan_' + tier] = (en.boss ? U.randInt(2, 4) : 1);
    if (Math.random() < 0.12 * dropMult) r.items[U.pick(D.herbsByTier[tier])] = 1;
    if (Math.random() < 0.08 * dropMult) r.items[D.oreByTier[tier]] = U.randInt(1, 2);
    const gearChance = en.boss ? 0.7 : en.elite ? 0.25 : 0.07;
    if (Math.random() < gearChance * dropMult) {
      r.gear = [{ tier, q: Gear.rollQuality(st.drop + (en.boss ? 60 : en.elite ? 25 : 0), en.boss ? 1 : 0) }];
    }
    const bookChance = en.boss ? 0.12 : 0.008;
    if (Math.random() < bookChance * dropMult) {
      const books = Object.keys(D.skills).filter((id) => !D.skills[id].sect && Math.abs(D.skills[id].tier - tier) <= 1);
      r.items['book_s_' + U.pick(books)] = 1;
    }
    if (en.boss && Math.random() < 0.15 * dropMult) r.items[tier >= 5 ? 'trung_yeu_thu' : 'trung_linh_thu'] = 1;
    if (en.boss && Math.random() < 0.05 * dropMult) {
      const techs = Object.keys(D.techniques).filter((id) => !D.techniques[id].sect && D.techniques[id].grade > 0 && D.techBookTier[D.techniques[id].grade] <= tier + 1);
      if (techs.length) r.items['book_t_' + U.pick(techs)] = 1;
    }
    return Loot.give(r);
  },

  bossReady(m) { return (G.bossCd[m.id] || 0) <= Date.now(); },

  challengeBoss() {
    const m = Explore.map();
    if (Combat.active() || Explore.busy || Dungeon.busy()) return false;
    if (!Explore.bossReady(m)) return false;
    G.bossCd[m.id] = Date.now() + Explore.BOSS_CD;
    const gs = Math.min(D.MAX_GS, m.lv[1]);
    const en = Combat.makeEnemy(m.boss, gs, { boss: true, tier: m.tier });
    Explore.fight(en, m, true);
    return true;
  },
};

/* ===== js/systems/events.js ===== */
'use strict';
/* Kỳ ngộ ngẫu nhiên khi thám hiểm */

const Events = {
  /* Mỗi sự kiện: text(ctx), choices[{label(ctx), can(ctx)->true|lý do, run(ctx)->{text, fight?}}], auto(ctx)->index */
  list: [
    {
      id: 'lao_gia', title: 'Lão Nhân Hấp Hối', icon: '🧓', w: 10,
      text: () => 'Bên vệ đường, một lão giả râu tóc bạc phơ nằm thoi thóp, bên hông đeo một túi trữ vật cũ kỹ. Lão yếu ớt đưa tay về phía ngươi…',
      choices: [
        { label: () => 'Cứu chữa (tốn 1 Hồi Khí Đan)', can: () => Inv.has('hoi_khi_dan') || 'Cần 1 Hồi Khí Đan',
          run: (c) => {
            Inv.remove('hoi_khi_dan', 1); Player.addKarma(10);
            const r = Math.random();
            if (r < 0.4) {
              const pool = Object.keys(D.techniques).filter((id) => !D.techniques[id].sect && D.techniques[id].grade >= 1 && D.techniques[id].grade <= Math.min(3, 1 + Math.floor(c.tier / 3)));
              const id = 'book_t_' + U.pick(pool);
              Inv.add(id, 1);
              return { text: 'Lão giả hồi tỉnh, cảm kích tặng ngươi một quyển ' + D.items[id].name + '. Thiện duyên +10.' };
            }
            if (r < 0.8) {
              const ins = Math.floor(60 * (1 + G.player.realm)); G.player.insight += ins;
              return { text: 'Lão giả truyền cho ngươi chút tâm đắc tu luyện cả đời. Ngộ đạo +' + ins + '. Thiện duyên +10.' };
